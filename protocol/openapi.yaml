openapi: 3.2.0
info:
  title: Dirt MCP Paper Bridge
  version: 0.1.0
  description: Local contract between the Dirt MCP stdio server and Paper plugin.
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:8765
    description: Default loopback development endpoint
security:
  - bearerAuth: []
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Report bridge availability and versions
      responses:
        '200':
          description: Bridge health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/GetMethodNotAllowed'
  /v1/inspect-region:
    post:
      operationId: inspectRegion
      summary: Count block states in a bounded region of loaded chunks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectRegionRequest'
      responses:
        '200':
          description: Region inspection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectRegionResponse'
        '400':
          description: Invalid JSON, fields, coordinates, or world height
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '413':
          description: Normalized region exceeds the configured volume limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected inspection failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Region contains an unloaded chunk or inspection was interrupted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/inspect-blocks:
    post:
      operationId: inspectBlocks
      summary: Return exact filtered block geometry from a bounded region of loaded chunks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectBlocksRequest'
      responses:
        '200':
          description: Exact sparse blocks or deterministic axis-aligned runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectBlocksResponse'
        '400':
          description: Invalid JSON, fields, coordinates, filters, options, or world height
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '413':
          description: Region volume or exact result exceeds its limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected inspection failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Region contains an unloaded chunk or inspection was interrupted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/replace-blocks:
    post:
      operationId: replaceBlocks
      summary: Replace one exact block state in a bounded region of loaded chunks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceBlocksRequest'
      responses:
        '200':
          description: Executed edit or exact dry-run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceBlocksResponse'
        '400':
          description: Invalid JSON, fields, coordinates, world height, or block state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '409':
          description: Another Dirt MCP edit is active in this world
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Region volume or estimated changed-block count exceeds its configured limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected edit failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Region contains an unloaded chunk or editing was interrupted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/fill-region:
    post:
      operationId: fillRegion
      summary: Fill a bounded region of loaded chunks with one block state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FillRegionRequest'
      responses:
        '200':
          description: Executed edit or exact dry-run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FillRegionResponse'
        '400':
          description: Invalid JSON, fields, coordinates, world height, or block state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '409':
          description: Another Dirt MCP edit is active in this world
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Region volume or estimated changed-block count exceeds its configured limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected edit failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Region contains an unloaded chunk or editing was interrupted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/undo-last-edit:
    post:
      operationId: undoLastEdit
      summary: Undo the newest successful Dirt MCP edit in a loaded world
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UndoLastEditRequest'
      responses:
        '200':
          description: Completed undo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UndoLastEditResponse'
        '400':
          description: Invalid JSON or fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '409':
          description: No undo is available or another Dirt MCP edit is active in this world
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected undo failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Undo was interrupted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer realm="dirt-mcp"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GetMethodNotAllowed:
      description: Method not allowed
      headers:
        Allow:
          schema:
            const: GET
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PostMethodNotAllowed:
      description: Method not allowed
      headers:
        Allow:
          schema:
            const: POST
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - internal_error
                - invalid_request
                - method_not_allowed
                - change_limit_exceeded
                - nothing_to_undo
                - region_too_large
                - result_too_large
                - unauthorized
                - world_busy
                - world_not_found
                - world_unavailable
            message:
              type: string
    BlockPosition:
      type: object
      additionalProperties: false
      required:
        - x
        - y
        - z
      properties:
        x:
          type: integer
          format: int32
        y:
          type: integer
          format: int32
        z:
          type: integer
          format: int32
    Bounds:
      type: object
      additionalProperties: false
      required:
        - min
        - max
      properties:
        min:
          $ref: '#/components/schemas/BlockPosition'
        max:
          $ref: '#/components/schemas/BlockPosition'
    Dimensions:
      type: object
      additionalProperties: false
      required:
        - x
        - y
        - z
      properties:
        x:
          type: integer
          format: int64
          minimum: 1
        y:
          type: integer
          format: int64
          minimum: 1
        z:
          type: integer
          format: int64
          minimum: 1
    InspectRegionRequest:
      type: object
      additionalProperties: false
      required:
        - world
        - min
        - max
      properties:
        world:
          type: string
          minLength: 1
        min:
          $ref: '#/components/schemas/BlockPosition'
        max:
          $ref: '#/components/schemas/BlockPosition'
    InspectRegionResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - bounds
        - dimensions
        - volume
        - blockStates
      properties:
        world:
          type: string
          minLength: 1
        bounds:
          $ref: '#/components/schemas/Bounds'
        dimensions:
          $ref: '#/components/schemas/Dimensions'
        volume:
          type: integer
          format: int64
          minimum: 1
        blockStates:
          type: object
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
    InspectBlocksRequest:
      type: object
      additionalProperties: false
      required:
        - world
        - min
        - max
      properties:
        world:
          type: string
          minLength: 1
        min:
          $ref: '#/components/schemas/BlockPosition'
        max:
          $ref: '#/components/schemas/BlockPosition'
        include:
          type: array
          description: Block-state patterns to include; omitted properties match any value.
          items:
            type: string
            minLength: 1
        exclude:
          type: array
          description: Block-state patterns to exclude after include filtering.
          items:
            type: string
            minLength: 1
        includeAir:
          type: boolean
          default: false
          description: Include air-family block states in filtering and results.
        maxResults:
          type: integer
          format: int32
          minimum: 1
          maximum: 10000
          default: 10000
        mode:
          type: string
          enum:
            - blocks
            - runs
          default: blocks
    InspectedBlock:
      type: object
      additionalProperties: false
      required:
        - position
        - state
      properties:
        position:
          $ref: '#/components/schemas/BlockPosition'
        state:
          type: string
          minLength: 1
    BlockRun:
      type: object
      additionalProperties: false
      required:
        - state
        - from
        - to
      properties:
        state:
          type: string
          minLength: 1
        from:
          description: Inclusive first position of the axis-aligned run.
          $ref: '#/components/schemas/BlockPosition'
        to:
          description: Inclusive last position of the axis-aligned run.
          $ref: '#/components/schemas/BlockPosition'
    InspectBlocksResponse:
      oneOf:
        - $ref: '#/components/schemas/InspectBlocksListResponse'
        - $ref: '#/components/schemas/InspectBlockRunsResponse'
      discriminator:
        propertyName: mode
        mapping:
          blocks: '#/components/schemas/InspectBlocksListResponse'
          runs: '#/components/schemas/InspectBlockRunsResponse'
    InspectBlocksListResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - bounds
        - volume
        - matchedBlocks
        - mode
        - blocks
      properties:
        world:
          type: string
          minLength: 1
        bounds:
          $ref: '#/components/schemas/Bounds'
        volume:
          type: integer
          format: int64
          minimum: 1
          maximum: 32768
        matchedBlocks:
          type: integer
          format: int64
          minimum: 0
          maximum: 32768
        mode:
          const: blocks
        blocks:
          type: array
          maxItems: 10000
          items:
            $ref: '#/components/schemas/InspectedBlock'
    InspectBlockRunsResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - bounds
        - volume
        - matchedBlocks
        - mode
        - runs
      properties:
        world:
          type: string
          minLength: 1
        bounds:
          $ref: '#/components/schemas/Bounds'
        volume:
          type: integer
          format: int64
          minimum: 1
          maximum: 32768
        matchedBlocks:
          type: integer
          format: int64
          minimum: 0
          maximum: 32768
        mode:
          const: runs
        runs:
          type: array
          maxItems: 10000
          items:
            $ref: '#/components/schemas/BlockRun'
    ReplaceBlocksRequest:
      type: object
      additionalProperties: false
      required:
        - world
        - min
        - max
        - source
        - destination
      properties:
        world:
          type: string
          minLength: 1
        min:
          $ref: '#/components/schemas/BlockPosition'
        max:
          $ref: '#/components/schemas/BlockPosition'
        source:
          type: string
          minLength: 1
        destination:
          type: string
          minLength: 1
        dryRun:
          type: boolean
          default: false
    ReplaceBlocksResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - bounds
        - source
        - destination
        - dryRun
        - matchedBlocks
        - changedBlocks
      properties:
        world:
          type: string
          minLength: 1
        bounds:
          $ref: '#/components/schemas/Bounds'
        source:
          type: string
          minLength: 1
        destination:
          type: string
          minLength: 1
        dryRun:
          type: boolean
        matchedBlocks:
          type: integer
          format: int64
          minimum: 0
        changedBlocks:
          type: integer
          format: int64
          minimum: 0
    FillRegionRequest:
      type: object
      additionalProperties: false
      required:
        - world
        - min
        - max
        - destination
      properties:
        world:
          type: string
          minLength: 1
        min:
          $ref: '#/components/schemas/BlockPosition'
        max:
          $ref: '#/components/schemas/BlockPosition'
        destination:
          type: string
          minLength: 1
        dryRun:
          type: boolean
          default: false
    FillRegionResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - bounds
        - destination
        - dryRun
        - volume
        - changedBlocks
      properties:
        world:
          type: string
          minLength: 1
        bounds:
          $ref: '#/components/schemas/Bounds'
        destination:
          type: string
          minLength: 1
        dryRun:
          type: boolean
        volume:
          type: integer
          format: int64
          minimum: 1
        changedBlocks:
          type: integer
          format: int64
          minimum: 0
    UndoLastEditRequest:
      type: object
      additionalProperties: false
      required:
        - world
      properties:
        world:
          type: string
          minLength: 1
    UndoLastEditResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - changedBlocks
      properties:
        world:
          type: string
          minLength: 1
        changedBlocks:
          type: integer
          format: int64
          minimum: 1
    Health:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - version
        - minecraftVersion
      properties:
        status:
          const: ok
        service:
          const: dirt-mcp-paper
        version:
          type: string
        minecraftVersion:
          type: string
