openapi: 3.1.1
info:
  title: Dirt MCP Paper Bridge
  version: 0.1.0
  description: Authoritative authenticated loopback HTTP contract between the Dirt MCP stdio server and Paper plugin.
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:{port}
    description: Authenticated loopback bridge endpoint
    variables:
      port:
        default: '8765'
        description: Paper bridge port configured by the server administrator.
security:
  - bearerAuth: []
paths:
  /v1/capabilities:
    parameters:
      - $ref: '#/components/parameters/DirtCallId'
    get:
      operationId: getCapabilities
      summary: List bridge operations currently allowed by the Paper plugin
      responses:
        '200':
          description: Allowed configurable operations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/GetMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/BridgeBusy'
  /v1/ping:
    parameters:
      - $ref: '#/components/parameters/DirtCallId'
    get:
      operationId: pingServer
      summary: Verify that the Paper plugin and required editing dependency are ready
      responses:
        '200':
          description: The Paper bridge and required runtime dependency are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OperationDisabled'
        '405':
          $ref: '#/components/responses/GetMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Bridge admission is full, or Paper or FAWE is not ready
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    oneOf:
                      - $ref: '#/components/schemas/BridgeBusyError'
                      - $ref: '#/components/schemas/UnhealthyError'
  /v1/server-status:
    parameters:
      - $ref: '#/components/parameters/DirtCallId'
    post:
      operationId: getServerStatus
      summary: Report server status with explicitly selected optional sections
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerStatusRequest'
      responses:
        '200':
          description: Current Paper status and the requested optional sections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OperationDisabled'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Bridge admission is full or current Paper context is unavailable
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    oneOf:
                      - $ref: '#/components/schemas/BridgeBusyError'
                      - $ref: '#/components/schemas/ServerUnavailableError'
  /v1/count-region-block-states:
    parameters:
      - $ref: '#/components/parameters/DirtCallId'
    post:
      operationId: countRegionBlockStates
      summary: Count block states in a bounded region of loaded chunks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountRegionBlockStatesRequest'
      responses:
        '200':
          description: Region inspection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountRegionBlockStatesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OperationDisabled'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    $ref: '#/components/schemas/WorldNotFoundError'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '413':
          description: Normalized region exceeds the configured volume or touched-chunk limit
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    $ref: '#/components/schemas/RegionTooLargeError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Bridge admission is full, or inspection capacity or required world state is unavailable
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    oneOf:
                      - $ref: '#/components/schemas/BridgeBusyError'
                      - $ref: '#/components/schemas/ServerUnavailableError'
                      - $ref: '#/components/schemas/WorldUnavailableError'
  /v1/get-blocks:
    parameters:
      - $ref: '#/components/parameters/DirtCallId'
    post:
      operationId: getBlocks
      summary: Return replay-ready exact block structure from a bounded region of loaded chunks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetBlocksRequest'
      responses:
        '200':
          description: Exact singleton palettes with origin-relative placements and inclusive cuboids
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExactBlockStructureResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OperationDisabled'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    $ref: '#/components/schemas/WorldNotFoundError'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '413':
          description: Region volume, touched chunks, or exact result exceeds its limit
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    oneOf:
                      - $ref: '#/components/schemas/RegionTooLargeError'
                      - $ref: '#/components/schemas/ResultTooLargeError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Bridge admission is full, or inspection capacity or required world state is unavailable
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    oneOf:
                      - $ref: '#/components/schemas/BridgeBusyError'
                      - $ref: '#/components/schemas/ServerUnavailableError'
                      - $ref: '#/components/schemas/WorldUnavailableError'
  /v1/scan-orthographic-view:
    parameters:
      - $ref: '#/components/parameters/DirtCallId'
    post:
      operationId: scanOrthographicView
      summary: Return a selected non-air depth along each sightline in an orthographic view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanOrthographicViewRequest'
      responses:
        '200':
          description: Replay-ready exact visible block structure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExactBlockStructureResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OperationDisabled'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    $ref: '#/components/schemas/WorldNotFoundError'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '413':
          description: View volume, touched chunks, or exact result exceeds its limit; scan-volume messages report requested and maximum volumes
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    oneOf:
                      - $ref: '#/components/schemas/RegionTooLargeError'
                      - $ref: '#/components/schemas/ResultTooLargeError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Bridge admission is full, or inspection capacity or required world state is unavailable
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    oneOf:
                      - $ref: '#/components/schemas/BridgeBusyError'
                      - $ref: '#/components/schemas/ServerUnavailableError'
                      - $ref: '#/components/schemas/WorldUnavailableError'
  /v1/get-player-context:
    parameters:
      - $ref: '#/components/parameters/DirtCallId'
    post:
      operationId: getPlayerContext
      summary: Capture an online player's pose and optional state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetPlayerContextRequest'
      responses:
        '200':
          description: One coherent player snapshot with the requested optional sections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPlayerContextResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OperationDisabled'
        '404':
          description: The selected player is not online
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    $ref: '#/components/schemas/PlayerNotFoundError'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '409':
          description: The selected player state cannot be represented safely
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    $ref: '#/components/schemas/PlayerUnavailableError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Bridge admission is full or required Paper world state is unavailable
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    oneOf:
                      - $ref: '#/components/schemas/BridgeBusyError'
                      - $ref: '#/components/schemas/ServerUnavailableError'
                      - $ref: '#/components/schemas/WorldUnavailableError'
  /v1/get-perspective-view:
    parameters:
      - $ref: '#/components/parameters/DirtCallId'
    post:
      operationId: getPerspectiveView
      summary: Trace a bounded perspective block view from a player or arbitrary camera
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetPerspectiveViewRequest'
      responses:
        '200':
          description: Resolved camera pose and exact sparse first block-collision hits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPerspectiveViewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OperationDisabled'
        '404':
          description: The selected player is not online or the selected world is not loaded
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    oneOf:
                      - $ref: '#/components/schemas/PlayerNotFoundError'
                      - $ref: '#/components/schemas/WorldNotFoundError'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '409':
          description: The selected player camera cannot be represented safely
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    $ref: '#/components/schemas/PlayerUnavailableError'
        '413':
          description: The ray count, ray-distance budget, or checked-chunk count exceeds its inspection limit
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    oneOf:
                      - $ref: '#/components/schemas/RegionTooLargeError'
                      - $ref: '#/components/schemas/ResultTooLargeError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Bridge admission is full, or inspection capacity or required world state is unavailable
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    oneOf:
                      - $ref: '#/components/schemas/BridgeBusyError'
                      - $ref: '#/components/schemas/ServerUnavailableError'
                      - $ref: '#/components/schemas/WorldUnavailableError'
  /v1/replace-region-blocks:
    parameters:
      - $ref: '#/components/parameters/DirtCallId'
    post:
      operationId: replaceRegionBlocks
      summary: Replace block-state patterns with a weighted palette in loaded chunks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceRegionBlocksRequest'
      responses:
        '200':
          description: Executed edit or exact dry-run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceRegionBlocksResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OperationDisabled'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    $ref: '#/components/schemas/WorldNotFoundError'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '409':
          description: Another Dirt MCP world operation is active or the newest retained edit requires recovery
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    $ref: '#/components/schemas/WorldBusyError'
        '413':
          description: Region volume or touched chunks exceed configured limits, or the exact changed-block count exceeds the effective configured/request ceiling
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    oneOf:
                      - $ref: '#/components/schemas/ChangeLimitExceededError'
                      - $ref: '#/components/schemas/RegionTooLargeError'
        '500':
          description: Unexpected failure before or after mutation execution began
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    oneOf:
                      - $ref: '#/components/schemas/InternalErrorDetail'
                      - $ref: '#/components/schemas/MutationInternalError'
        '503':
          description: Bridge, world, editing, or bounded undo-history capacity is unavailable
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    oneOf:
                      - $ref: '#/components/schemas/BridgeBusyError'
                      - $ref: '#/components/schemas/HistoryCapacityExceededError'
                      - $ref: '#/components/schemas/ServerUnavailableError'
                      - $ref: '#/components/schemas/WorldUnavailableError'
                      - $ref: '#/components/schemas/MutationWorldUnavailableError'
  /v1/set-blocks:
    parameters:
      - $ref: '#/components/parameters/DirtCallId'
    post:
      operationId: setBlocks
      summary: Place weighted-palette states from origin-relative placements and cuboids in one edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetBlocksRequest'
      responses:
        '200':
          description: Executed edit or exact dry-run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetBlocksResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OperationDisabled'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    $ref: '#/components/schemas/WorldNotFoundError'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '409':
          description: Another Dirt MCP world operation is active or the newest retained edit requires recovery
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    $ref: '#/components/schemas/WorldBusyError'
        '413':
          description: Expanded block count or touched chunks exceed configured limits, or the changed-block count exceeds the effective configured/request ceiling
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    oneOf:
                      - $ref: '#/components/schemas/ChangeLimitExceededError'
                      - $ref: '#/components/schemas/RegionTooLargeError'
        '500':
          description: Unexpected failure before or after mutation execution began
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    oneOf:
                      - $ref: '#/components/schemas/InternalErrorDetail'
                      - $ref: '#/components/schemas/MutationInternalError'
        '503':
          description: Bridge, world, editing, or bounded undo-history capacity is unavailable
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    oneOf:
                      - $ref: '#/components/schemas/BridgeBusyError'
                      - $ref: '#/components/schemas/HistoryCapacityExceededError'
                      - $ref: '#/components/schemas/ServerUnavailableError'
                      - $ref: '#/components/schemas/WorldUnavailableError'
                      - $ref: '#/components/schemas/MutationWorldUnavailableError'
  /v1/get-edit-history:
    parameters:
      - $ref: '#/components/parameters/DirtCallId'
    post:
      operationId: getEditHistory
      summary: Return the retained undoable Dirt edit history for a loaded world
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetEditHistoryRequest'
      responses:
        '200':
          description: Retained undoable edits ordered newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEditHistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OperationDisabled'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    $ref: '#/components/schemas/WorldNotFoundError'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '409':
          description: Another Dirt MCP world operation is active in this world
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    $ref: '#/components/schemas/WorldBusyError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Bridge admission, Paper, or the selected world is unavailable
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    oneOf:
                      - $ref: '#/components/schemas/BridgeBusyError'
                      - $ref: '#/components/schemas/ServerUnavailableError'
                      - $ref: '#/components/schemas/WorldUnavailableError'
  /v1/undo-edits:
    parameters:
      - $ref: '#/components/parameters/DirtCallId'
    post:
      operationId: undoEdits
      summary: Undo an exact newest-first prefix of retained Dirt edits in a loaded world
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UndoEditsRequest'
      responses:
        '200':
          description: Complete undo or partial progress through a runtime failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UndoEditsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OperationDisabled'
        '404':
          description: World is not loaded or a requested edit is not retained
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    oneOf:
                      - $ref: '#/components/schemas/EditNotFoundError'
                      - $ref: '#/components/schemas/WorldNotFoundError'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '409':
          description: The requested IDs are not the exact newest-first history prefix or another Dirt MCP world operation is active in this world
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    oneOf:
                      - $ref: '#/components/schemas/EditNotLatestError'
                      - $ref: '#/components/schemas/WorldBusyError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Undo is unavailable before execution begins
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    oneOf:
                      - $ref: '#/components/schemas/BridgeBusyError'
                      - $ref: '#/components/schemas/ServerUnavailableError'
                      - $ref: '#/components/schemas/WorldUnavailableError'
  /v1/run-minecraft-commands:
    parameters:
      - $ref: '#/components/parameters/DirtCallId'
    post:
      operationId: runMinecraftCommands
      summary: Run registered Minecraft commands sequentially with operator-level permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunMinecraftCommandsRequest'
      responses:
        '200':
          description: Complete ordered dispatch results, or the attempted prefix through the first per-command failure, with bounded synchronous feedback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunMinecraftCommandsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OperationDisabled'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Bridge admission or Paper command execution is unavailable
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    oneOf:
                      - $ref: '#/components/schemas/BridgeBusyError'
                      - $ref: '#/components/schemas/ServerUnavailableError'
components:
  parameters:
    DirtCallId:
      name: X-Dirt-Call-Id
      in: header
      required: true
      description: Caller-generated UUIDv4 for request correlation. Mutations retain it in edit metadata, and undo results return it as undoCallId.
      schema:
        $ref: '#/components/schemas/UuidV4'
  responses:
    BadRequest:
      description: The call ID, JSON body, or request fields are invalid
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - error
            properties:
              error:
                $ref: '#/components/schemas/InvalidRequestError'
    BridgeBusy:
      description: Authenticated bridge admission capacity is exhausted
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - error
            properties:
              error:
                $ref: '#/components/schemas/BridgeBusyError'
    InternalError:
      description: Unexpected internal failure
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - error
            properties:
              error:
                $ref: '#/components/schemas/InternalErrorDetail'
    OperationDisabled:
      description: The authenticated caller requested an administratively disabled operation
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - error
            properties:
              error:
                $ref: '#/components/schemas/OperationDisabledError'
    Unauthorized:
      description: Missing or invalid bearer token
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer realm="dirt-mcp"
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - error
            properties:
              error:
                $ref: '#/components/schemas/UnauthorizedError'
    GetMethodNotAllowed:
      description: Method not allowed
      headers:
        Allow:
          schema:
            type: string
            const: GET
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - error
            properties:
              error:
                $ref: '#/components/schemas/MethodNotAllowedError'
    PostMethodNotAllowed:
      description: Method not allowed
      headers:
        Allow:
          schema:
            type: string
            const: POST
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - error
            properties:
              error:
                $ref: '#/components/schemas/MethodNotAllowedError'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Shared token containing exactly 64 lowercase hexadecimal characters. Used only over the loopback bridge.
  schemas:
    BridgeErrorCode:
      type: string
      description: Error codes returned by bridge operations or authenticated route dispatch.
      enum:
        - bridge_busy
        - change_limit_exceeded
        - edit_not_found
        - edit_not_latest
        - history_capacity_exceeded
        - internal_error
        - invalid_request
        - method_not_allowed
        - operation_disabled
        - player_not_found
        - player_unavailable
        - region_too_large
        - result_too_large
        - route_not_found
        - server_unavailable
        - unauthorized
        - unhealthy
        - world_busy
        - world_not_found
        - world_unavailable
    BridgeErrorBase:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/BridgeErrorCode'
        message:
          type: string
          minLength: 1
    BridgeBusyError:
      allOf:
        - $ref: '#/components/schemas/BridgeErrorBase'
        - type: object
          required:
            - details
          properties:
            code:
              const: bridge_busy
            details:
              type: object
              additionalProperties: false
              required:
                - maximumConcurrentRequests
              properties:
                maximumConcurrentRequests:
                  $ref: '#/components/schemas/PositiveInt32'
      unevaluatedProperties: false
    ChangeLimitExceededError:
      allOf:
        - $ref: '#/components/schemas/BridgeErrorBase'
        - type: object
          required:
            - details
          properties:
            code:
              const: change_limit_exceeded
            details:
              type: object
              additionalProperties: false
              required:
                - maximum
              properties:
                maximum:
                  allOf:
                    - $ref: '#/components/schemas/PositiveInt32'
                  description: Effective changed-block ceiling, using the lower of the configured and optional request limits.
      unevaluatedProperties: false
    EditNotFoundError:
      allOf:
        - $ref: '#/components/schemas/BridgeErrorBase'
        - type: object
          required:
            - details
          properties:
            code:
              const: edit_not_found
            details:
              type: object
              additionalProperties: false
              required:
                - world
                - requestedEditId
              properties:
                world:
                  $ref: '#/components/schemas/WorldName'
                requestedEditId:
                  $ref: '#/components/schemas/UuidV4'
      unevaluatedProperties: false
    EditNotLatestError:
      allOf:
        - $ref: '#/components/schemas/BridgeErrorBase'
        - type: object
          required:
            - details
          properties:
            code:
              const: edit_not_latest
            details:
              type: object
              additionalProperties: false
              description: requestedEditId and newestEditId identify distinct edits.
              required:
                - world
                - requestedEditId
                - newestEditId
              properties:
                world:
                  $ref: '#/components/schemas/WorldName'
                requestedEditId:
                  $ref: '#/components/schemas/UuidV4'
                newestEditId:
                  $ref: '#/components/schemas/UuidV4'
      unevaluatedProperties: false
    HistoryCapacityExceededError:
      allOf:
        - $ref: '#/components/schemas/BridgeErrorBase'
        - type: object
          required:
            - details
          properties:
            code:
              const: history_capacity_exceeded
            details:
              $ref: '#/components/schemas/HistoryCapacityDetails'
      unevaluatedProperties: false
    InternalErrorDetail:
      allOf:
        - $ref: '#/components/schemas/BridgeErrorBase'
        - type: object
          properties:
            code:
              const: internal_error
      unevaluatedProperties: false
    MutationInternalError:
      description: Internal mutation failure whose edit may need reconciliation against retained history.
      allOf:
        - $ref: '#/components/schemas/BridgeErrorBase'
        - type: object
          required:
            - editId
          properties:
            code:
              const: internal_error
            editId:
              $ref: '#/components/schemas/UuidV4'
      unevaluatedProperties: false
    InvalidRequestError:
      allOf:
        - $ref: '#/components/schemas/BridgeErrorBase'
        - type: object
          required:
            - details
          properties:
            code:
              const: invalid_request
            details:
              $ref: '#/components/schemas/InvalidRequestDetails'
      unevaluatedProperties: false
    MethodNotAllowedError:
      allOf:
        - $ref: '#/components/schemas/BridgeErrorBase'
        - type: object
          required:
            - details
          properties:
            code:
              const: method_not_allowed
            details:
              type: object
              additionalProperties: false
              required:
                - allowedMethod
              properties:
                allowedMethod:
                  type: string
                  enum:
                    - GET
                    - POST
      unevaluatedProperties: false
    OperationDisabledError:
      allOf:
        - $ref: '#/components/schemas/BridgeErrorBase'
        - type: object
          required:
            - details
          properties:
            code:
              const: operation_disabled
            details:
              type: object
              additionalProperties: false
              required:
                - operationId
              properties:
                operationId:
                  $ref: '#/components/schemas/BridgeOperationId'
      unevaluatedProperties: false
    PlayerNotFoundError:
      allOf:
        - $ref: '#/components/schemas/BridgeErrorBase'
        - type: object
          required:
            - details
          properties:
            code:
              const: player_not_found
            details:
              type: object
              additionalProperties: false
              required:
                - player
              properties:
                player:
                  $ref: '#/components/schemas/PlayerSelector'
                  description: Exact online player name or canonical UUID requested by the caller.
      unevaluatedProperties: false
    PlayerUnavailableError:
      allOf:
        - $ref: '#/components/schemas/BridgeErrorBase'
        - type: object
          required:
            - details
          properties:
            code:
              const: player_unavailable
            details:
              oneOf:
                - type: object
                  additionalProperties: false
                  required:
                    - reason
                    - player
                  properties:
                    reason:
                      const: spectating_entity
                    player:
                      $ref: '#/components/schemas/PlayerSelector'
                      description: Requested online player name or canonical UUID selector.
                - type: object
                  additionalProperties: false
                  required:
                    - reason
                    - player
                    - field
                  properties:
                    reason:
                      const: non_finite_state
                    player:
                      $ref: '#/components/schemas/PlayerSelector'
                      description: Requested online player name or canonical UUID selector.
                    field:
                      type: string
                      description: Player field whose server value was not a finite JSON number.
                      enum:
                        - feetPosition.x
                        - feetPosition.y
                        - feetPosition.z
                        - eyePosition.x
                        - eyePosition.y
                        - eyePosition.z
                        - rotation.yaw
                        - rotation.pitch
                        - vitals.health
                        - vitals.maxHealth
                        - vitals.absorptionAmount
                        - vitals.saturation
                        - vitals.exhaustion
                        - vitals.experienceProgress
                        - movement.velocity.x
                        - movement.velocity.y
                        - movement.velocity.z
                        - movement.fallDistance
                - type: object
                  additionalProperties: false
                  required:
                    - reason
                    - player
                    - field
                  properties:
                    reason:
                      const: position_out_of_range
                    player:
                      $ref: '#/components/schemas/PlayerSelector'
                      description: Requested online player name or canonical UUID selector.
                    field:
                      type: string
                      description: Coordinate whose floored block position was outside signed int32 range.
                      enum:
                        - feetPosition.x
                        - feetPosition.y
                        - feetPosition.z
                        - eyePosition.x
                        - eyePosition.y
                        - eyePosition.z
                        - perspectiveEndpoint.x
                        - perspectiveEndpoint.y
                        - perspectiveEndpoint.z
      unevaluatedProperties: false
    RegionTooLargeError:
      allOf:
        - $ref: '#/components/schemas/BridgeErrorBase'
        - type: object
          required:
            - details
          properties:
            code:
              const: region_too_large
            details:
              $ref: '#/components/schemas/RegionTooLargeDetails'
      unevaluatedProperties: false
    ResultTooLargeError:
      allOf:
        - $ref: '#/components/schemas/BridgeErrorBase'
        - type: object
          required:
            - details
          properties:
            code:
              const: result_too_large
            details:
              type: object
              additionalProperties: false
              description: minimumRequired is a known lower bound on the required entries and must be greater than maximum.
              required:
                - reason
                - minimumRequired
                - maximum
              properties:
                reason:
                  type: string
                  enum:
                    - structure_entries
                    - palettes
                    - perspective_rays
                    - perspective_ray_distance
                minimumRequired:
                  $ref: '#/components/schemas/PositiveJsonSafeInteger'
                maximum:
                  $ref: '#/components/schemas/PositiveInt32'
      unevaluatedProperties: false
    ServerUnavailableError:
      allOf:
        - $ref: '#/components/schemas/BridgeErrorBase'
        - type: object
          required:
            - details
          properties:
            code:
              const: server_unavailable
            details:
              $ref: '#/components/schemas/ServerUnavailableDetails'
      unevaluatedProperties: false
    UnauthorizedError:
      allOf:
        - $ref: '#/components/schemas/BridgeErrorBase'
        - type: object
          required:
            - details
          properties:
            code:
              const: unauthorized
            details:
              type: object
              additionalProperties: false
              required:
                - reason
              properties:
                reason:
                  const: authentication_failed
      unevaluatedProperties: false
    UnhealthyError:
      allOf:
        - $ref: '#/components/schemas/BridgeErrorBase'
        - type: object
          required:
            - details
          properties:
            code:
              const: unhealthy
            details:
              type: object
              additionalProperties: false
              required:
                - reason
              properties:
                reason:
                  type: string
                  enum:
                    - plugin_disabled
                    - dependency_unavailable
                    - no_loaded_worlds
                    - health_check_failed
                    - paper_unavailable
      unevaluatedProperties: false
    WorldBusyError:
      allOf:
        - $ref: '#/components/schemas/BridgeErrorBase'
        - type: object
          required:
            - details
          properties:
            code:
              const: world_busy
            details:
              $ref: '#/components/schemas/WorldBusyDetails'
      unevaluatedProperties: false
    WorldNotFoundError:
      allOf:
        - $ref: '#/components/schemas/BridgeErrorBase'
        - type: object
          required:
            - details
          properties:
            code:
              const: world_not_found
            details:
              type: object
              additionalProperties: false
              required:
                - world
              properties:
                world:
                  $ref: '#/components/schemas/WorldName'
      unevaluatedProperties: false
    WorldUnavailableError:
      allOf:
        - $ref: '#/components/schemas/BridgeErrorBase'
        - type: object
          required:
            - details
          properties:
            code:
              const: world_unavailable
            details:
              $ref: '#/components/schemas/WorldUnavailableDetails'
      unevaluatedProperties: false
    MutationWorldUnavailableError:
      description: Mutation failure whose edit may need reconciliation against retained history.
      allOf:
        - $ref: '#/components/schemas/BridgeErrorBase'
        - type: object
          required:
            - details
            - editId
          properties:
            code:
              const: world_unavailable
            details:
              $ref: '#/components/schemas/MutationWorldUnavailableDetails'
            editId:
              $ref: '#/components/schemas/UuidV4'
      unevaluatedProperties: false
    InvalidRequestDetails:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - reason
            - expected
          properties:
            reason:
              const: unsupported_media_type
            expected:
              const: application/json
        - type: object
          additionalProperties: false
          required:
            - reason
            - maximumBytes
          properties:
            reason:
              const: body_too_large
            maximumBytes:
              $ref: '#/components/schemas/PositiveInt32'
        - type: object
          additionalProperties: false
          required:
            - reason
          properties:
            reason:
              const: malformed_json
        - type: object
          additionalProperties: false
          required:
            - reason
            - field
          properties:
            reason:
              type: string
              enum:
                - missing
                - invalid_value
                - duplicate
                - unknown_fields
            field:
              type: string
              minLength: 1
              pattern: '.*\S.*'
        - type: object
          additionalProperties: false
          description: allowedValues is the non-empty unique list of values supported for target.
          required:
            - reason
            - target
            - allowedValues
          properties:
            reason:
              const: unsupported_value
            target:
              type: string
              minLength: 1
              pattern: '.*\S.*'
            allowedValues:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: string
                minLength: 1
                pattern: '.*\S.*'
        - type: object
          additionalProperties: false
          description: value must be outside the inclusive range from minimum through maximum, and minimum must be less than or equal to maximum.
          required:
            - reason
            - target
            - value
            - minimum
            - maximum
          properties:
            reason:
              const: out_of_range
            target:
              type: string
              minLength: 1
              pattern: '.*\S.*'
            value:
              description: Rejected value.
              $ref: '#/components/schemas/JsonSafeInteger'
            minimum:
              $ref: '#/components/schemas/JsonSafeInteger'
            maximum:
              $ref: '#/components/schemas/JsonSafeInteger'
        - type: object
          additionalProperties: false
          description: fields is a non-empty unique list of request fields whose aggregate item count exceeds maximum.
          required:
            - reason
            - fields
            - maximum
          properties:
            reason:
              const: too_many_items
            fields:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: string
                minLength: 1
                pattern: '.*\S.*'
            maximum:
              $ref: '#/components/schemas/PositiveInt32'
        - type: object
          additionalProperties: false
          required:
            - reason
            - field
          properties:
            reason:
              const: palette_weights_mixed
            field:
              type: string
              minLength: 1
              pattern: '.*\S.*'
        - type: object
          additionalProperties: false
          description: requested is the positive palette weight total and must differ from required, which is always 100.
          required:
            - reason
            - field
            - requested
            - required
          properties:
            reason:
              const: palette_weight_total
            field:
              type: string
              minLength: 1
              pattern: '.*\S.*'
            requested:
              description: Rejected positive JSON-safe integer total, excluding 100.
              oneOf:
                - type: integer
                  format: int64
                  minimum: 1
                  maximum: 99
                - type: integer
                  format: int64
                  minimum: 101
                  maximum: 9007199254740991
            required:
              const: 100
    RegionTooLargeDetails:
      oneOf:
        - type: object
          additionalProperties: false
          description: The exact product of dimensions must be greater than maximum.
          required:
            - reason
            - dimensions
            - maximum
          properties:
            reason:
              const: volume
            dimensions:
              $ref: '#/components/schemas/Dimensions'
            maximum:
              $ref: '#/components/schemas/PositiveInt32'
        - type: object
          additionalProperties: false
          description: minimumRequired is a known lower bound and must be greater than maximum.
          required:
            - reason
            - minimumRequired
            - maximum
          properties:
            reason:
              const: touched_chunks
            minimumRequired:
              $ref: '#/components/schemas/PositiveJsonSafeInteger'
            maximum:
              $ref: '#/components/schemas/PositiveInt32'
        - type: object
          additionalProperties: false
          description: requested must be greater than maximum.
          required:
            - reason
            - requested
            - maximum
          properties:
            reason:
              const: perspective_chunks
            requested:
              $ref: '#/components/schemas/PositiveInt32'
              description: Exact size of the conservative loaded-chunk preflight for the sampled rays.
            maximum:
              $ref: '#/components/schemas/PositiveInt32'
        - type: object
          additionalProperties: false
          description: minimumRequired is a known lower bound greater than maximum.
          required:
            - reason
            - minimumRequired
            - maximum
          properties:
            reason:
              const: block_count
            minimumRequired:
              $ref: '#/components/schemas/PositiveJsonSafeInteger'
              description: Known lower bound on the blocks represented by placements and runs.
            maximum:
              $ref: '#/components/schemas/PositiveInt32'
    HistoryCapacityDetails:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - reason
            - maximum
          properties:
            reason:
              const: entries_per_world
            maximum:
              $ref: '#/components/schemas/PositiveInt32'
        - type: object
          additionalProperties: false
          required:
            - reason
            - maximum
          properties:
            reason:
              const: entries_total
            maximum:
              $ref: '#/components/schemas/PositiveInt32'
        - type: object
          additionalProperties: false
          required:
            - reason
            - maximum
          properties:
            reason:
              const: retained_changed_blocks
            maximum:
              $ref: '#/components/schemas/PositiveInt32'
    ServerUnavailableDetails:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - reason
          properties:
            reason:
              type: string
              enum:
                - dependency_unavailable
                - paper_unavailable
        - type: object
          additionalProperties: false
          required:
            - reason
            - maximumConcurrentInspections
          properties:
            reason:
              const: inspection_busy
            maximumConcurrentInspections:
              $ref: '#/components/schemas/PositiveInt32'
    WorldBusyDetails:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - reason
            - world
          properties:
            reason:
              const: operation_in_progress
            world:
              $ref: '#/components/schemas/WorldName'
        - type: object
          additionalProperties: false
          required:
            - reason
            - world
            - newestEditId
          properties:
            reason:
              const: recovery_required
            world:
              $ref: '#/components/schemas/WorldName'
            newestEditId:
              $ref: '#/components/schemas/UuidV4'
    WorldUnavailableDetails:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - reason
          properties:
            reason:
              type: string
              enum:
                - stopping
                - interrupted
                - paper_unavailable
        - type: object
          additionalProperties: false
          required:
            - reason
            - world
          properties:
            reason:
              const: world_unloaded
            world:
              $ref: '#/components/schemas/WorldName'
        - type: object
          additionalProperties: false
          required:
            - reason
            - world
            - chunk
          properties:
            reason:
              type: string
              enum:
                - chunk_unloaded
                - chunk_load_failed
            world:
              $ref: '#/components/schemas/WorldName'
            chunk:
              $ref: '#/components/schemas/ChunkPosition'
    MutationWorldUnavailableDetails:
      description: World-unavailable reasons emitted after a mutation or undo has begun.
      oneOf:
        - $ref: '#/components/schemas/WorldUnavailableDetails'
        - type: object
          additionalProperties: false
          required:
            - reason
          properties:
            reason:
              type: string
              enum:
                - operation_failed
                - rollback_failed
                - rolled_back
    BridgeOperationId:
      type: string
      description: Configurable bridge operationId; getCapabilities is the mandatory control-plane operation and is not configurable.
      enum:
        - pingServer
        - getServerStatus
        - countRegionBlockStates
        - getBlocks
        - scanOrthographicView
        - getPlayerContext
        - getPerspectiveView
        - replaceRegionBlocks
        - setBlocks
        - getEditHistory
        - undoEdits
        - runMinecraftCommands
    CapabilitiesResponse:
      type: object
      additionalProperties: false
      required:
        - operations
      properties:
        operations:
          type: array
          uniqueItems: true
          description: Enabled configurable operation IDs.
          items:
            $ref: '#/components/schemas/BridgeOperationId'
    Uuid:
      type: string
      format: uuid
      pattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
    UuidV4:
      type: string
      format: uuid
      pattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-4[0-9A-Fa-f]{3}-[89ABab][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}$'
    Int32:
      type: integer
      format: int32
      minimum: -2147483648
      maximum: 2147483647
    NonNegativeInt32:
      type: integer
      format: int32
      minimum: 0
      maximum: 2147483647
    PositiveInt32:
      type: integer
      format: int32
      minimum: 1
      maximum: 2147483647
    JsonSafeInteger:
      description: Integer within the exact IEEE-754/JSON safe range.
      type: integer
      format: int64
      minimum: -9007199254740991
      maximum: 9007199254740991
    PositiveJsonSafeInteger:
      description: Positive integer within the exact IEEE-754/JSON safe range.
      type: integer
      format: int64
      minimum: 1
      maximum: 9007199254740991
    WorldName:
      type: string
      minLength: 1
      pattern: '.*\S.*'
      description: Nonblank Paper world name. Lookups are exact and case-sensitive; successful responses use the canonical loaded-world name.
    BlockPosition:
      type: object
      additionalProperties: false
      required:
        - x
        - y
        - z
      properties:
        x:
          $ref: '#/components/schemas/Int32'
        y:
          $ref: '#/components/schemas/Int32'
        z:
          $ref: '#/components/schemas/Int32'
    ChunkPosition:
      type: object
      additionalProperties: false
      required:
        - x
        - z
      properties:
        x:
          $ref: '#/components/schemas/Int32'
        z:
          $ref: '#/components/schemas/Int32'
    Bounds:
      type: object
      additionalProperties: false
      description: Normalized inclusive bounds; every minimum coordinate is less than or equal to its maximum coordinate.
      required:
        - min
        - max
      properties:
        min:
          $ref: '#/components/schemas/BlockPosition'
        max:
          $ref: '#/components/schemas/BlockPosition'
    Dimensions:
      type: object
      additionalProperties: false
      required:
        - x
        - y
        - z
      properties:
        x:
          $ref: '#/components/schemas/PositiveJsonSafeInteger'
        y:
          $ref: '#/components/schemas/PositiveJsonSafeInteger'
        z:
          $ref: '#/components/schemas/PositiveJsonSafeInteger'
    CountRegionBlockStatesRequest:
      type: object
      additionalProperties: false
      required:
        - world
        - min
        - max
      properties:
        world:
          $ref: '#/components/schemas/WorldName'
        min:
          $ref: '#/components/schemas/BlockPosition'
        max:
          $ref: '#/components/schemas/BlockPosition'
    CountRegionBlockStatesResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - bounds
        - dimensions
        - volume
        - blockStateCounts
      properties:
        world:
          $ref: '#/components/schemas/WorldName'
        bounds:
          $ref: '#/components/schemas/Bounds'
        dimensions:
          $ref: '#/components/schemas/Dimensions'
        volume:
          $ref: '#/components/schemas/PositiveInt32'
        blockStateCounts:
          type: object
          minProperties: 1
          description: Observed canonical block states and their positive counts. Counts sum to volume.
          propertyNames:
            minLength: 1
            pattern: '.*\S.*'
          additionalProperties:
            $ref: '#/components/schemas/PositiveInt32'
    GetBlocksRequest:
      type: object
      additionalProperties: false
      required:
        - world
        - min
        - max
        - includeBlockStatePatterns
        - excludeBlockStatePatterns
        - includeAir
        - maxResults
      properties:
        world:
          $ref: '#/components/schemas/WorldName'
        min:
          $ref: '#/components/schemas/BlockPosition'
        max:
          $ref: '#/components/schemas/BlockPosition'
        includeBlockStatePatterns:
          type: array
          maxItems: 64
          uniqueItems: true
          description: Block-state patterns to include; include and exclude lists are limited to 64 entries combined.
          items:
            type: string
            minLength: 1
            pattern: '.*\S.*'
        excludeBlockStatePatterns:
          type: array
          maxItems: 64
          uniqueItems: true
          description: Block-state patterns to exclude after include filtering; both lists are limited to 64 entries combined.
          items:
            type: string
            minLength: 1
            pattern: '.*\S.*'
        includeAir:
          type: boolean
          description: Whether to include air-family states.
        maxResults:
          description: Caller ceiling on placements plus runs; Paper also enforces its safety maximum.
          $ref: '#/components/schemas/PositiveInt32'
    ExactPaletteEntry:
      type: object
      additionalProperties: false
      required:
        - blockState
      properties:
        blockState:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Exact canonical block state represented by this palette.
    PalettePlacement:
      type: array
      minItems: 4
      maxItems: 4
      description: Exact [paletteIndex, x, y, z] tuple; paletteIndex is non-negative and coordinates are signed offsets from origin.
      prefixItems:
        - $ref: '#/components/schemas/NonNegativeInt32'
        - $ref: '#/components/schemas/Int32'
        - $ref: '#/components/schemas/Int32'
        - $ref: '#/components/schemas/Int32'
      items: false
    PaletteRun:
      type: array
      minItems: 7
      maxItems: 7
      description: Exact [paletteIndex, x, y, z, toX, toY, toZ] tuple for a component-wise forward inclusive cuboid; coordinates are signed offsets from origin.
      prefixItems:
        - $ref: '#/components/schemas/NonNegativeInt32'
        - $ref: '#/components/schemas/Int32'
        - $ref: '#/components/schemas/Int32'
        - $ref: '#/components/schemas/Int32'
        - $ref: '#/components/schemas/Int32'
        - $ref: '#/components/schemas/Int32'
        - $ref: '#/components/schemas/Int32'
      items: false
    ExactBlockStructureResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - origin
        - palettes
        - placements
        - runs
      properties:
        world:
          $ref: '#/components/schemas/WorldName'
        origin:
          description: Normalized minimum inspection bound used by every relative tuple.
          $ref: '#/components/schemas/BlockPosition'
        palettes:
          type: array
          maxItems: 256
          uniqueItems: true
          description: First-seen exact singleton palettes. Empty exactly when placements and runs are both empty.
          items:
            type: array
            minItems: 1
            maxItems: 1
            items:
              $ref: '#/components/schemas/ExactPaletteEntry'
        placements:
          type: array
          description: Non-overlapping singleton blocks represented relative to origin.
          items:
            $ref: '#/components/schemas/PalettePlacement'
        runs:
          type: array
          description: Non-overlapping forward inclusive cuboids represented relative to origin; no run overlaps a placement.
          items:
            $ref: '#/components/schemas/PaletteRun'
    ScanOrthographicViewRequest:
      type: object
      additionalProperties: false
      required:
        - world
        - origin
        - direction
        - horizontalRadius
        - verticalRadius
        - maxDistance
        - depth
        - maxResults
      properties:
        world:
          $ref: '#/components/schemas/WorldName'
        origin:
          description: Center anchor of the orthographic view; scanning starts one block forward.
          $ref: '#/components/schemas/BlockPosition'
        direction:
          type: string
          description: World-axis direction; north is -Z, east is +X, south is +Z, west is -X, up is +Y, and down is -Y.
          enum:
            - north
            - east
            - south
            - west
            - up
            - down
        horizontalRadius:
          $ref: '#/components/schemas/NonNegativeInt32'
          description: Viewport cells on each side of the center sightline along the direction's horizontal axis.
        verticalRadius:
          $ref: '#/components/schemas/NonNegativeInt32'
          description: Viewport cells on each side of the center sightline along the direction's vertical axis.
        maxDistance:
          $ref: '#/components/schemas/PositiveInt32'
          description: Blocks scanned forward from the origin; distance 1 is adjacent.
        depth:
          $ref: '#/components/schemas/NonNegativeInt32'
          description: Zero-based non-air hit to return on each sightline; 0 is the first, 1 is the second, and so on.
        maxResults:
          description: Caller ceiling on placements plus runs; Paper also enforces its safety maximum.
          $ref: '#/components/schemas/PositiveInt32'
    PlayerSelector:
      type: string
      minLength: 1
      maxLength: 36
      pattern: '.*\S.*'
      description: Case-insensitive exact online player name (available from the server-status response when players are included) or canonical UUID.
    PlayerContextIncludeOptions:
      type: object
      additionalProperties: false
      required:
        - equipment
        - inventory
        - enderChest
        - vitals
        - movement
        - client
        - effects
      properties:
        equipment:
          type: boolean
          description: Include the selected hotbar slot, held items, and armor.
        inventory:
          type: boolean
          description: Include occupied player storage slots, excluding equipment and off-hand.
        enderChest:
          type: boolean
          description: Include occupied ender-chest slots.
        vitals:
          type: boolean
          description: Include health, food, air, experience, fire, and freeze state.
        movement:
          type: boolean
          description: Include velocity, flight state, and movement/posture flags.
        client:
          type: boolean
          description: Include ping, locale, and client/server view distances.
        effects:
          type: boolean
          description: Include sorted active potion effects.
    GetPlayerContextRequest:
      type: object
      additionalProperties: false
      required:
        - player
        - include
      properties:
        player:
          $ref: '#/components/schemas/PlayerSelector'
        include:
          $ref: '#/components/schemas/PlayerContextIncludeOptions'
    ExactPosition:
      type: object
      additionalProperties: false
      required:
        - x
        - y
        - z
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        z:
          type: number
          format: double
    PlayerIdentity:
      type: object
      additionalProperties: false
      required:
        - name
        - uuid
      properties:
        name:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        uuid:
          $ref: '#/components/schemas/Uuid'
    Rotation:
      type: object
      additionalProperties: false
      required:
        - yaw
        - pitch
      properties:
        yaw:
          type: number
          format: double
          description: Paper yaw in degrees.
        pitch:
          type: number
          format: double
    PerspectiveInputRotation:
      type: object
      additionalProperties: false
      required:
        - yaw
        - pitch
      properties:
        yaw:
          type: number
          format: double
          description: Paper yaw in degrees; the resolved response yaw is normalized to [-180, 180).
        pitch:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Paper pitch in degrees; positive values look downward.
    PerspectivePlayerSource:
      type: object
      additionalProperties: false
      required:
        - type
        - player
      properties:
        type:
          const: player
        player:
          $ref: '#/components/schemas/PlayerSelector'
    PerspectiveLocationSource:
      type: object
      additionalProperties: false
      required:
        - type
        - world
        - cameraPosition
        - rotation
      properties:
        type:
          const: location
        world:
          $ref: '#/components/schemas/WorldName'
        cameraPosition:
          allOf:
            - $ref: '#/components/schemas/ExactPosition'
          description: Exact camera and ray origin; no player eye height is added.
        rotation:
          $ref: '#/components/schemas/PerspectiveInputRotation'
    PerspectiveSource:
      oneOf:
        - $ref: '#/components/schemas/PerspectivePlayerSource'
        - $ref: '#/components/schemas/PerspectiveLocationSource'
      discriminator:
        propertyName: type
        mapping:
          player: '#/components/schemas/PerspectivePlayerSource'
          location: '#/components/schemas/PerspectiveLocationSource'
    GetPerspectiveViewRequest:
      type: object
      additionalProperties: false
      required:
        - source
        - width
        - height
        - verticalFieldOfViewDegrees
        - maxDistance
        - fluidCollision
        - ignorePassableBlocks
      properties:
        source:
          $ref: '#/components/schemas/PerspectiveSource'
        width:
          type: integer
          format: int32
          minimum: 1
          maximum: 255
          description: Odd number of left-to-right ray columns.
          not:
            multipleOf: 2
        height:
          type: integer
          format: int32
          minimum: 1
          maximum: 255
          description: Odd number of top-to-bottom ray rows.
          not:
            multipleOf: 2
        verticalFieldOfViewDegrees:
          type: integer
          format: int32
          minimum: 1
          maximum: 170
          description: Vertical projection angle. Paper cannot observe a client's configured or dynamically modified FOV.
        maxDistance:
          type: integer
          format: int32
          minimum: 1
          maximum: 128
          description: Maximum Euclidean block-ray distance from cameraPosition.
        fluidCollision:
          type: string
          enum:
            - never
            - source_only
            - always
        ignorePassableBlocks:
          type: boolean
          description: Whether passable but collidable blocks are ignored by Paper ray tracing.
    PerspectiveViewBasis:
      type: object
      additionalProperties: false
      description: Orthonormal camera basis resolved from the camera rotation.
      required:
        - forward
        - right
        - up
      properties:
        forward:
          $ref: '#/components/schemas/ExactPosition'
        right:
          $ref: '#/components/schemas/ExactPosition'
        up:
          $ref: '#/components/schemas/ExactPosition'
    ResolvedPerspectiveViewport:
      type: object
      additionalProperties: false
      required:
        - width
        - height
        - verticalFieldOfViewDegrees
        - horizontalFieldOfViewDegrees
        - maxDistance
        - fluidCollision
        - ignorePassableBlocks
      properties:
        width:
          type: integer
          format: int32
          minimum: 1
          maximum: 255
          not:
            multipleOf: 2
        height:
          type: integer
          format: int32
          minimum: 1
          maximum: 255
          not:
            multipleOf: 2
        verticalFieldOfViewDegrees:
          type: integer
          format: int32
          minimum: 1
          maximum: 170
        horizontalFieldOfViewDegrees:
          type: number
          format: double
          exclusiveMinimum: 0
          exclusiveMaximum: 180
          description: Horizontal projection angle derived from vertical FOV and viewport aspect ratio.
        maxDistance:
          type: integer
          format: int32
          minimum: 1
          maximum: 128
        fluidCollision:
          type: string
          enum:
            - never
            - source_only
            - always
        ignorePassableBlocks:
          type: boolean
    PerspectiveViewHit:
      type: object
      additionalProperties: false
      required:
        - row
        - column
        - blockStateIndex
        - blockPosition
        - hitPosition
        - face
        - distance
      properties:
        row:
          $ref: '#/components/schemas/NonNegativeInt32'
          description: Zero-based top-to-bottom viewport row.
        column:
          $ref: '#/components/schemas/NonNegativeInt32'
          description: Zero-based left-to-right viewport column.
        blockStateIndex:
          $ref: '#/components/schemas/PositiveInt32'
          description: One-based index into blockStatePalette.
        blockPosition:
          $ref: '#/components/schemas/BlockPosition'
        hitPosition:
          $ref: '#/components/schemas/ExactPosition'
        face:
          oneOf:
            - type: string
              enum:
                - up
                - down
                - north
                - east
                - south
                - west
            - type: 'null'
          description: Hit block face when Paper supplies one.
        distance:
          type: number
          format: double
          minimum: 0
          description: Euclidean ray distance from cameraPosition.
    PlayerEnchantment:
      type: object
      additionalProperties: false
      required:
        - type
        - level
      properties:
        type:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Namespaced enchantment identifier.
        level:
          $ref: '#/components/schemas/Int32'
    PlayerItemStack:
      type: object
      additionalProperties: false
      required:
        - type
        - amount
        - maxStackSize
        - damage
        - maxDamage
        - unbreakable
        - enchantments
      properties:
        type:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Namespaced item type.
        amount:
          $ref: '#/components/schemas/PositiveInt32'
        maxStackSize:
          $ref: '#/components/schemas/PositiveInt32'
        damage:
          oneOf:
            - $ref: '#/components/schemas/NonNegativeInt32'
            - type: 'null'
        maxDamage:
          oneOf:
            - $ref: '#/components/schemas/PositiveInt32'
            - type: 'null'
        unbreakable:
          type: boolean
        enchantments:
          type: array
          description: Enchantments with distinct types in strictly increasing type order.
          items:
            $ref: '#/components/schemas/PlayerEnchantment'
    NullablePlayerItemStack:
      oneOf:
        - $ref: '#/components/schemas/PlayerItemStack'
        - type: 'null'
    PlayerEquipment:
      type: object
      additionalProperties: false
      required:
        - selectedHotbarSlot
        - mainHand
        - offHand
        - helmet
        - chestplate
        - leggings
        - boots
      properties:
        selectedHotbarSlot:
          type: integer
          format: int32
          minimum: 0
          maximum: 8
        mainHand:
          $ref: '#/components/schemas/NullablePlayerItemStack'
        offHand:
          $ref: '#/components/schemas/NullablePlayerItemStack'
        helmet:
          $ref: '#/components/schemas/NullablePlayerItemStack'
        chestplate:
          $ref: '#/components/schemas/NullablePlayerItemStack'
        leggings:
          $ref: '#/components/schemas/NullablePlayerItemStack'
        boots:
          $ref: '#/components/schemas/NullablePlayerItemStack'
    PlayerInventorySlot:
      type: object
      additionalProperties: false
      required:
        - slot
        - item
      properties:
        slot:
          $ref: '#/components/schemas/NonNegativeInt32'
        item:
          $ref: '#/components/schemas/PlayerItemStack'
    PlayerInventory:
      type: object
      additionalProperties: false
      description: Sparse occupied container slots in ascending slot order. Player inventory excludes equipment and off-hand; ender chest uses the same shape.
      required:
        - size
        - slots
      properties:
        size:
          $ref: '#/components/schemas/PositiveInt32'
        slots:
          type: array
          description: Occupied slots with distinct indexes in strictly increasing order.
          items:
            $ref: '#/components/schemas/PlayerInventorySlot'
    PlayerVitals:
      type: object
      additionalProperties: false
      required:
        - health
        - maxHealth
        - absorptionAmount
        - foodLevel
        - saturation
        - exhaustion
        - remainingAir
        - maximumAir
        - experienceLevel
        - experienceProgress
        - calculatedExperiencePoints
        - fireTicks
        - freezeTicks
      properties:
        health:
          type: number
          format: double
          minimum: 0
        maxHealth:
          type: number
          format: double
          exclusiveMinimum: 0
        absorptionAmount:
          type: number
          format: double
          minimum: 0
        foodLevel:
          $ref: '#/components/schemas/Int32'
        saturation:
          type: number
          format: double
        exhaustion:
          type: number
          format: double
        remainingAir:
          $ref: '#/components/schemas/Int32'
        maximumAir:
          $ref: '#/components/schemas/Int32'
        experienceLevel:
          $ref: '#/components/schemas/NonNegativeInt32'
        experienceProgress:
          type: number
          format: double
          minimum: 0
          maximum: 1
        calculatedExperiencePoints:
          $ref: '#/components/schemas/Int32'
          description: Total points calculated from the current experience level and progress.
        fireTicks:
          $ref: '#/components/schemas/Int32'
        freezeTicks:
          $ref: '#/components/schemas/NonNegativeInt32'
    PlayerMovement:
      type: object
      additionalProperties: false
      required:
        - velocity
        - fallDistance
        - allowFlight
        - flying
        - sneaking
        - sprinting
        - swimming
        - gliding
        - sleeping
        - blocking
        - riptiding
      properties:
        velocity:
          $ref: '#/components/schemas/ExactPosition'
        fallDistance:
          type: number
          format: double
        allowFlight:
          type: boolean
        flying:
          type: boolean
        sneaking:
          type: boolean
        sprinting:
          type: boolean
        swimming:
          type: boolean
        gliding:
          type: boolean
        sleeping:
          type: boolean
        blocking:
          type: boolean
        riptiding:
          type: boolean
    PlayerClient:
      type: object
      additionalProperties: false
      required:
        - pingMillis
        - locale
        - clientViewDistance
        - viewDistance
        - sendViewDistance
      properties:
        pingMillis:
          $ref: '#/components/schemas/Int32'
        locale:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        clientViewDistance:
          $ref: '#/components/schemas/NonNegativeInt32'
          description: Chunk render-distance preference reported by the client.
        viewDistance:
          allOf:
            - $ref: '#/components/schemas/Int32'
          description: Effective Paper chunk load distance for this player.
        sendViewDistance:
          allOf:
            - $ref: '#/components/schemas/Int32'
          description: Effective Paper chunk send distance for this player.
    PlayerEffect:
      type: object
      additionalProperties: false
      required:
        - type
        - amplifier
        - durationTicks
        - ambient
        - particles
        - icon
      properties:
        type:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Namespaced effect identifier.
        amplifier:
          $ref: '#/components/schemas/Int32'
        durationTicks:
          allOf:
            - $ref: '#/components/schemas/Int32'
          description: Remaining ticks; Paper uses -1 as the infinite-duration sentinel and plugins may expose other signed values.
        ambient:
          type: boolean
        particles:
          type: boolean
        icon:
          type: boolean
    ResolvedPerspectivePlayerSource:
      type: object
      additionalProperties: false
      required:
        - type
        - player
      properties:
        type:
          const: player
        player:
          $ref: '#/components/schemas/PlayerIdentity'
    ResolvedPerspectiveLocationSource:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          const: location
    ResolvedPerspectiveSource:
      oneOf:
        - $ref: '#/components/schemas/ResolvedPerspectivePlayerSource'
        - $ref: '#/components/schemas/ResolvedPerspectiveLocationSource'
      discriminator:
        propertyName: type
        mapping:
          player: '#/components/schemas/ResolvedPerspectivePlayerSource'
          location: '#/components/schemas/ResolvedPerspectiveLocationSource'
    GetPerspectiveViewResponse:
      type: object
      additionalProperties: false
      description: Exact first Paper block-collision hits from one resolved camera pose; misses are omitted and the result is not a client framebuffer.
      required:
        - capturedAt
        - source
        - world
        - worldId
        - cameraPosition
        - rotation
        - lookDirection
        - basis
        - viewport
        - checkedChunkCount
        - blockStatePalette
        - hits
        - crosshairHitIndex
      properties:
        capturedAt:
          type: string
          format: date-time
        source:
          $ref: '#/components/schemas/ResolvedPerspectiveSource'
        world:
          $ref: '#/components/schemas/WorldName'
        worldId:
          $ref: '#/components/schemas/Uuid'
        cameraPosition:
          $ref: '#/components/schemas/ExactPosition'
        rotation:
          $ref: '#/components/schemas/Rotation'
        lookDirection:
          $ref: '#/components/schemas/ExactPosition'
        basis:
          $ref: '#/components/schemas/PerspectiveViewBasis'
        viewport:
          $ref: '#/components/schemas/ResolvedPerspectiveViewport'
        checkedChunkCount:
          $ref: '#/components/schemas/NonNegativeInt32'
          description: Exact size of the conservative loaded-chunk preflight for the sampled rays.
        blockStatePalette:
          type: array
          uniqueItems: true
          description: Unique block states ordered by first appearance in hits.
          items:
            type: string
            minLength: 1
            pattern: '.*\S.*'
        hits:
          type: array
          description: Sparse first hits in strictly increasing row-major viewport order.
          items:
            $ref: '#/components/schemas/PerspectiveViewHit'
        crosshairHitIndex:
          oneOf:
            - $ref: '#/components/schemas/NonNegativeInt32'
            - type: 'null'
          description: Zero-based hits index for the center ray, or null when it did not hit a block.
    GetPlayerContextResponse:
      type: object
      additionalProperties: false
      description: Coherent Paper main-thread capture. Each requested section is non-null and each excluded section is null. When equipment and inventory are both included, equipment.mainHand equals the selectedHotbarSlot item, or is null when that sparse slot is omitted.
      required:
        - capturedAt
        - player
        - world
        - worldId
        - gameMode
        - feetPosition
        - blockPosition
        - eyePosition
        - rotation
        - lookDirection
        - pose
        - onGround
        - equipment
        - inventory
        - enderChest
        - vitals
        - movement
        - client
        - effects
      properties:
        capturedAt:
          type: string
          format: date-time
        player:
          $ref: '#/components/schemas/PlayerIdentity'
        world:
          $ref: '#/components/schemas/WorldName'
        worldId:
          $ref: '#/components/schemas/Uuid'
        gameMode:
          type: string
          enum:
            - survival
            - creative
            - adventure
            - spectator
        feetPosition:
          $ref: '#/components/schemas/ExactPosition'
        blockPosition:
          $ref: '#/components/schemas/BlockPosition'
        eyePosition:
          $ref: '#/components/schemas/ExactPosition'
        rotation:
          $ref: '#/components/schemas/Rotation'
        lookDirection:
          $ref: '#/components/schemas/ExactPosition'
        pose:
          type: string
          enum:
            - standing
            - fall_flying
            - sleeping
            - swimming
            - spin_attack
            - sneaking
            - long_jumping
            - dying
            - croaking
            - using_tongue
            - sitting
            - roaring
            - sniffing
            - emerging
            - digging
            - sliding
            - shooting
            - inhaling
        onGround:
          type: boolean
        equipment:
          oneOf:
            - $ref: '#/components/schemas/PlayerEquipment'
            - type: 'null'
        inventory:
          oneOf:
            - $ref: '#/components/schemas/PlayerInventory'
            - type: 'null'
        enderChest:
          oneOf:
            - $ref: '#/components/schemas/PlayerInventory'
            - type: 'null'
        vitals:
          oneOf:
            - $ref: '#/components/schemas/PlayerVitals'
            - type: 'null'
        movement:
          oneOf:
            - $ref: '#/components/schemas/PlayerMovement'
            - type: 'null'
        client:
          oneOf:
            - $ref: '#/components/schemas/PlayerClient'
            - type: 'null'
        effects:
          oneOf:
            - type: array
              description: Active effects with distinct types in strictly increasing type order.
              items:
                $ref: '#/components/schemas/PlayerEffect'
            - type: 'null'
    DestinationPaletteEntry:
      type: object
      additionalProperties: false
      required:
        - blockState
      properties:
        blockState:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Block-state string that Paper resolves to the exact state to place; omitted properties use Paper defaults.
        weight:
          type: integer
          minimum: 1
          maximum: 100
          description: Whole-number percentage supplied for every entry or omitted from every entry.
    EditLabel:
      type: string
      minLength: 1
      maxLength: 120
      pattern: '^(?!\s)(?!.*\s$)[^\u0000-\u001F\u007F-\u009F\u2028\u2029]+$'
      description: Concise model-supplied purpose for an edit. Contains 1-120 Unicode code points, is already trimmed and single-line, and contains no ISO control characters.
    EditRecord:
      type: object
      additionalProperties: false
      description: Identity and lifecycle metadata for one Dirt edit transaction.
      required:
        - editId
        - callId
        - label
        - operation
        - world
        - worldId
        - bounds
        - changedBlockCount
        - completedAt
        - status
      properties:
        editId:
          $ref: '#/components/schemas/UuidV4'
        callId:
          $ref: '#/components/schemas/UuidV4'
        label:
          $ref: '#/components/schemas/EditLabel'
        operation:
          type: string
          enum:
            - replace_region_blocks
            - set_blocks
        world:
          $ref: '#/components/schemas/WorldName'
        worldId:
          $ref: '#/components/schemas/Uuid'
        bounds:
          description: Normalized operation bounds; set-block edits use the smallest inclusive bounds containing every requested position.
          $ref: '#/components/schemas/Bounds'
        changedBlockCount:
          $ref: '#/components/schemas/PositiveInt32'
        completedAt:
          type: string
          format: date-time
          description: Timestamp recorded when the original edit completed or entered recovery; later undo attempts do not change it.
        status:
          type: string
          description: Last retained state represented by this record. A successful undo returns the state immediately before consumption.
          enum:
            - committed
            - recovery_required
    ReplaceRegionBlocksRequest:
      type: object
      additionalProperties: false
      required:
        - world
        - label
        - min
        - max
        - sourceBlockStatePatterns
        - destinationPalette
        - seed
        - dryRun
        - maxChangedBlocks
      properties:
        world:
          $ref: '#/components/schemas/WorldName'
        label:
          $ref: '#/components/schemas/EditLabel'
        min:
          $ref: '#/components/schemas/BlockPosition'
        max:
          $ref: '#/components/schemas/BlockPosition'
        sourceBlockStatePatterns:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          description: ORed block-state patterns; omitted properties match any value.
          items:
            type: string
            minLength: 1
            pattern: '.*\S.*'
        destinationPalette:
          type: array
          minItems: 1
          maxItems: 256
          description: Destination block-state inputs resolved by Paper; weights are all omitted for equal probability or all total 100.
          items:
            $ref: '#/components/schemas/DestinationPaletteEntry'
        seed:
          description: Deterministic int32 palette seed selected by the caller.
          $ref: '#/components/schemas/Int32'
        dryRun:
          type: boolean
          description: True previews without mutation; false applies and records non-empty changes.
        maxChangedBlocks:
          description: Caller ceiling on changed blocks, or null to use the server-selected ceiling.
          oneOf:
            - $ref: '#/components/schemas/PositiveInt32'
            - type: 'null'
    ReplaceRegionBlocksResponse:
      type: object
      additionalProperties: false
      oneOf:
        - properties:
            outcome:
              const: preview
            edit:
              type: 'null'
        - properties:
            outcome:
              const: no_change
            changedBlockCount:
              const: 0
            edit:
              type: 'null'
        - properties:
            outcome:
              const: committed
            matchedBlockCount:
              $ref: '#/components/schemas/PositiveInt32'
            changedBlockCount:
              $ref: '#/components/schemas/PositiveInt32'
            edit:
              allOf:
                - $ref: '#/components/schemas/EditRecord'
                - properties:
                    operation:
                      const: replace_region_blocks
                    status:
                      const: committed
      required:
        - world
        - bounds
        - seed
        - outcome
        - edit
        - matchedBlockCount
        - changedBlockCount
      properties:
        world:
          $ref: '#/components/schemas/WorldName'
        bounds:
          description: Normalized inclusive bounds from the requested corners.
          $ref: '#/components/schemas/Bounds'
        seed:
          $ref: '#/components/schemas/Int32'
          description: Supplied request seed.
        outcome:
          type: string
          description: Explicit dryRun=true requires preview; false excludes preview.
          enum:
            - preview
            - no_change
            - committed
        edit:
          oneOf:
            - $ref: '#/components/schemas/EditRecord'
            - type: 'null'
        matchedBlockCount:
          $ref: '#/components/schemas/NonNegativeInt32'
          description: Blocks matching a source pattern; cannot exceed the inclusive bounds volume.
        changedBlockCount:
          $ref: '#/components/schemas/NonNegativeInt32'
          description: Blocks changed or that would change; cannot exceed matchedBlockCount.
    SetBlocksRequest:
      type: object
      additionalProperties: false
      required:
        - world
        - label
        - origin
        - palettes
        - placements
        - runs
        - seed
        - dryRun
        - maxChangedBlocks
      properties:
        world:
          $ref: '#/components/schemas/WorldName'
        label:
          $ref: '#/components/schemas/EditLabel'
        origin:
          $ref: '#/components/schemas/BlockPosition'
        palettes:
          type: array
          maxItems: 256
          description: Weighted palettes referenced by zero-based index; empty exactly when placements and runs are both empty, with at most 256 entries across all palettes.
          items:
            type: array
            minItems: 1
            maxItems: 256
            description: Block-state inputs resolved by Paper; weights are all omitted for equal probability or all supplied as whole percentages totaling 100.
            items:
              $ref: '#/components/schemas/DestinationPaletteEntry'
        placements:
          type: array
          description: Palette-indexed origin-relative singleton positions; all represented blocks across placements and runs must be distinct.
          items:
            $ref: '#/components/schemas/PalettePlacement'
        runs:
          type: array
          description: Palette-indexed origin-relative forward inclusive cuboids; all represented blocks across placements and runs must be distinct.
          items:
            $ref: '#/components/schemas/PaletteRun'
        seed:
          description: Deterministic int32 palette seed selected by the caller.
          $ref: '#/components/schemas/Int32'
        dryRun:
          type: boolean
          description: True previews without mutation; false applies and records non-empty changes.
        maxChangedBlocks:
          description: Caller ceiling on changed blocks, or null to use the server-selected ceiling.
          oneOf:
            - $ref: '#/components/schemas/PositiveInt32'
            - type: 'null'
    SetBlocksResponse:
      type: object
      additionalProperties: false
      oneOf:
        - properties:
            outcome:
              const: preview
            edit:
              type: 'null'
        - properties:
            outcome:
              const: no_change
            changedBlockCount:
              const: 0
            edit:
              type: 'null'
        - properties:
            outcome:
              const: committed
            bounds:
              $ref: '#/components/schemas/Bounds'
            blockCount:
              $ref: '#/components/schemas/PositiveInt32'
            changedBlockCount:
              $ref: '#/components/schemas/PositiveInt32'
            edit:
              allOf:
                - $ref: '#/components/schemas/EditRecord'
                - properties:
                    operation:
                      const: set_blocks
                    status:
                      const: committed
      required:
        - world
        - bounds
        - seed
        - outcome
        - edit
        - blockCount
        - changedBlockCount
        - unchangedBlockCount
      properties:
        world:
          $ref: '#/components/schemas/WorldName'
        bounds:
          description: Smallest inclusive bounds containing all requested resolved blocks, or null for empty geometry.
          oneOf:
            - $ref: '#/components/schemas/Bounds'
            - type: 'null'
        seed:
          $ref: '#/components/schemas/Int32'
          description: Supplied request seed.
        outcome:
          type: string
          description: Explicit dryRun=true requires preview; false excludes preview.
          enum:
            - preview
            - no_change
            - committed
        edit:
          oneOf:
            - $ref: '#/components/schemas/EditRecord'
            - type: 'null'
        blockCount:
          $ref: '#/components/schemas/NonNegativeInt32'
          description: Expanded number of unique blocks represented by placements and runs.
        changedBlockCount:
          $ref: '#/components/schemas/NonNegativeInt32'
          description: Blocks changed or that would change; together with unchangedBlockCount equals blockCount.
        unchangedBlockCount:
          $ref: '#/components/schemas/NonNegativeInt32'
          description: Blocks already in their requested state; together with changedBlockCount equals blockCount.
    GetEditHistoryRequest:
      type: object
      additionalProperties: false
      required:
        - world
      properties:
        world:
          $ref: '#/components/schemas/WorldName'
    GetEditHistoryResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - edits
      properties:
        world:
          $ref: '#/components/schemas/WorldName'
        edits:
          type: array
          uniqueItems: true
          description: Retained undoable edit records for one loaded world UUID, ordered newest first with distinct edit IDs.
          items:
            $ref: '#/components/schemas/EditRecord'
    UndoEditsRequest:
      type: object
      additionalProperties: false
      description: Identity-checked request for an exact newest-first prefix of retained edits. The complete list is validated before restoration begins.
      required:
        - world
        - editIds
      properties:
        world:
          $ref: '#/components/schemas/WorldName'
        editIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: Case-insensitively distinct retained edit IDs in exact newest-first history order, with no skipped entries and no more entries than the configured per-world history capacity.
          items:
            $ref: '#/components/schemas/UuidV4'
    UndoEditsResponse:
      description: Result discriminated by whether every requested edit was undone.
      oneOf:
        - $ref: '#/components/schemas/UndoEditsCompletedResult'
        - $ref: '#/components/schemas/UndoEditsPartialResult'
      discriminator:
        propertyName: outcome
        mapping:
          completed: '#/components/schemas/UndoEditsCompletedResult'
          partial: '#/components/schemas/UndoEditsPartialResult'
    UndoEditsCompletedResult:
      type: object
      additionalProperties: false
      required:
        - outcome
        - world
        - undoneEdits
        - undoCallId
        - undoneAt
      properties:
        outcome:
          const: completed
        world:
          $ref: '#/components/schemas/WorldName'
        undoneEdits:
          type: array
          minItems: 1
          uniqueItems: true
          description: Successfully restored and consumed edit records in the requested newest-first order, each as retained immediately before its undo.
          items:
            $ref: '#/components/schemas/EditRecord'
        undoCallId:
          $ref: '#/components/schemas/UuidV4'
        undoneAt:
          type: string
          format: date-time
          description: Timestamp recorded after the complete requested prefix was undone.
    UndoEditsPartialResult:
      type: object
      additionalProperties: false
      description: Runtime failure after prefix validation; successful earlier undos remain consumed.
      required:
        - outcome
        - world
        - undoCallId
        - undoneEdits
        - failure
      properties:
        outcome:
          const: partial
        world:
          $ref: '#/components/schemas/WorldName'
        undoCallId:
          $ref: '#/components/schemas/UuidV4'
        undoneEdits:
          type: array
          uniqueItems: true
          description: Successfully restored and consumed prefix before the failure, newest first; empty when the first edit failed.
          items:
            $ref: '#/components/schemas/EditRecord'
        failure:
          description: Failure for the retained edit identified by failure.editId.
          oneOf:
            - $ref: '#/components/schemas/MutationInternalError'
            - $ref: '#/components/schemas/MutationWorldUnavailableError'
    RunMinecraftCommandsRequest:
      type: object
      additionalProperties: false
      required:
        - commands
      properties:
        commands:
          type: array
          minItems: 1
          description: Commands in execution order. The active maximum count is reported by server status. Each entry may include one in-game leading slash and must not contain control characters.
          items:
            $ref: '#/components/schemas/MinecraftCommandInput'
    MinecraftCommandInput:
      type: string
      minLength: 1
      pattern: '^(?![ \u1680\u2000-\u2006\u2008-\u200A\u2028\u2029\u205F\u3000]*\/?[ \u1680\u2000-\u2006\u2008-\u200A\u2028\u2029\u205F\u3000]*$)[^\u0000-\u001F\u007F-\u009F]+$'
      description: A command containing no ISO control characters and remaining non-empty after Java whitespace and at most one leading slash are removed.
    NormalizedMinecraftCommand:
      type: string
      minLength: 1
      pattern: '^[^ \u0000-\u001F\u007F-\u009F\u1680\u2000-\u2006\u2008-\u200A\u2028\u2029\u205F\u3000](?:[^\u0000-\u001F\u007F-\u009F]*[^ \u0000-\u001F\u007F-\u009F\u1680\u2000-\u2006\u2008-\u200A\u2028\u2029\u205F\u3000])?$'
      description: A control-free command after Dirt removes Java outer whitespace and at most one leading slash.
    CommandSender:
      type: object
      additionalProperties: false
      required:
        - name
        - isOperator
        - isPlayer
      properties:
        name:
          type: string
          minLength: 1
          description: Actual Paper feedback-forwarding sender name.
        isOperator:
          const: true
          description: The sender has console-equivalent permissions.
        isPlayer:
          const: false
          description: The sender has no player entity or location context.
    CommandResult:
      description: Outcome and bounded synchronous feedback for one normalized command.
      oneOf:
        - $ref: '#/components/schemas/DispatchedCommandResult'
        - $ref: '#/components/schemas/CommandNotFoundResult'
        - $ref: '#/components/schemas/CommandDispatchFailedResult'
    DispatchedCommandResult:
      type: object
      additionalProperties: false
      required:
        - command
        - outcome
        - feedback
        - message
        - rawMessage
      properties:
        command:
          $ref: '#/components/schemas/NormalizedMinecraftCommand'
        outcome:
          const: dispatched
          description: Paper found and invoked a target without a dispatch exception; this does not assert semantic command success.
        feedback:
          type: array
          description: Bounded non-empty plain-text messages synchronously sent to this command's feedback sender.
          items:
            type: string
            minLength: 1
        message:
          type: 'null'
        rawMessage:
          type: 'null'
    CommandNotFoundResult:
      type: object
      additionalProperties: false
      required:
        - command
        - outcome
        - feedback
        - message
        - rawMessage
      properties:
        command:
          $ref: '#/components/schemas/NormalizedMinecraftCommand'
        outcome:
          const: not_found
          description: Paper found no command target; this result ends the batch and later commands are not attempted.
        feedback:
          type: array
          description: Bounded non-empty plain-text messages synchronously sent to this command's feedback sender.
          items:
            type: string
            minLength: 1
        message:
          type: string
          minLength: 1
          description: Actionable explanation of the missing target.
        rawMessage:
          type: 'null'
    CommandDispatchFailedResult:
      type: object
      additionalProperties: false
      required:
        - command
        - outcome
        - feedback
        - message
        - rawMessage
      properties:
        command:
          $ref: '#/components/schemas/NormalizedMinecraftCommand'
        outcome:
          const: dispatch_failed
          description: The command target raised a Paper CommandException; this result ends the batch and later commands are not attempted.
        feedback:
          type: array
          description: Bounded non-empty plain-text messages synchronously sent to this command's feedback sender.
          items:
            type: string
            minLength: 1
        message:
          type: string
          minLength: 1
          description: Deepest non-empty cause message found within bounded traversal of the dispatch failure.
        rawMessage:
          type: string
          minLength: 1
          description: Original non-empty Paper CommandException message, or a stable fallback when Paper supplies none.
    RunMinecraftCommandsResponse:
      type: object
      additionalProperties: false
      required:
        - sender
        - feedbackTruncated
        - results
      properties:
        sender:
          $ref: '#/components/schemas/CommandSender'
        feedbackTruncated:
          type: boolean
          description: Whether synchronous feedback exceeded the active request-wide Unicode-code-point limit.
        results:
          type: array
          minItems: 1
          description: Non-empty attempted prefix in original order. All non-final results are dispatched; the final result is the first failure, or every supplied command was dispatched.
          items:
            $ref: '#/components/schemas/CommandResult'
    OperationLimitConfiguration:
      type: object
      additionalProperties: false
      required:
        - maxRegionVolume
        - maxEditTouchedChunks
        - maxInspectionTouchedChunks
        - maxPerspectiveTouchedChunks
        - maxBlockStatePatterns
        - maxPaletteEntries
        - maxChangedBlocks
        - maxInspectionVolume
        - maxPerspectiveRayDistanceBudget
        - maxInspectionResultLimit
        - maxPerspectiveRays
        - maxCommandsPerRequest
        - maxCommandFeedbackCharacters
      properties:
        maxRegionVolume:
          $ref: '#/components/schemas/PositiveInt32'
          description: Maximum cuboid mutation/count volume or expanded blocks represented by a set-blocks edit.
        maxEditTouchedChunks:
          $ref: '#/components/schemas/PositiveInt32'
          description: Maximum distinct loaded chunks one mutation may touch.
        maxInspectionTouchedChunks:
          $ref: '#/components/schemas/PositiveInt32'
          description: Maximum distinct loaded chunks a region inspection may snapshot.
        maxPerspectiveTouchedChunks:
          $ref: '#/components/schemas/PositiveInt32'
          description: Maximum distinct loaded chunks a perspective view may check.
        maxBlockStatePatterns:
          type: integer
          format: int32
          minimum: 1
          maximum: 64
          description: Maximum match patterns in one operation; inspection include and exclude lists share this cap.
        maxPaletteEntries:
          type: integer
          format: int32
          minimum: 1
          maximum: 256
          description: Maximum exact block-state entries in one edit or exact inspection structure palette.
        maxChangedBlocks:
          $ref: '#/components/schemas/PositiveInt32'
          description: Maximum blocks one mutation may change; cannot exceed maxRegionVolume.
        maxInspectionVolume:
          $ref: '#/components/schemas/PositiveInt32'
          description: Maximum blocks scanned by exact block retrieval or an orthographic view; cannot exceed maxRegionVolume.
        maxPerspectiveRayDistanceBudget:
          $ref: '#/components/schemas/PositiveInt32'
          description: Maximum perspective ray count multiplied by maximum ray distance.
        maxInspectionResultLimit:
          $ref: '#/components/schemas/PositiveInt32'
          description: Paper safety ceiling on placements plus runs returned by an exact inspection structure. The effective limit is the lower of this value and request maxResults, and cannot exceed maxInspectionVolume.
        maxPerspectiveRays:
          $ref: '#/components/schemas/PositiveInt32'
          description: Maximum rays in one perspective view; cannot exceed maxPerspectiveRayDistanceBudget.
        maxCommandsPerRequest:
          $ref: '#/components/schemas/PositiveInt32'
          description: Maximum commands accepted in one ordered command batch.
        maxCommandFeedbackCharacters:
          $ref: '#/components/schemas/PositiveInt32'
          description: Maximum Unicode code points of synchronous plain-text feedback retained across one command batch.
    EditHistoryConfiguration:
      type: object
      additionalProperties: false
      required:
        - maxEntriesPerWorld
        - maxEntriesTotal
        - maxRetainedChangedBlocks
      properties:
        maxEntriesPerWorld:
          $ref: '#/components/schemas/PositiveInt32'
          description: Maximum retained undoable edits in one loaded world; cannot exceed maxEntriesTotal.
        maxEntriesTotal:
          $ref: '#/components/schemas/PositiveInt32'
          description: Maximum retained undoable edits across all loaded worlds.
        maxRetainedChangedBlocks:
          $ref: '#/components/schemas/PositiveInt32'
          description: Maximum sum of changed-block counts across all retained undoable edits; must be at least OperationLimitConfiguration.maxChangedBlocks.
    ServerStatusConfiguration:
      type: object
      additionalProperties: false
      description: Client-relevant operation limits; excludes transport, concurrency, logging, defaults, and MCP policy.
      required:
        - limits
        - editHistory
      properties:
        limits:
          $ref: '#/components/schemas/OperationLimitConfiguration'
        editHistory:
          $ref: '#/components/schemas/EditHistoryConfiguration'
    PingResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          const: ok
    ServerBuilds:
      type: object
      additionalProperties: false
      required:
        - minecraft
        - paper
        - dirtPlugin
        - fawe
      properties:
        minecraft:
          type: string
          minLength: 1
        paper:
          type: string
          minLength: 1
        dirtPlugin:
          type: string
          minLength: 1
        fawe:
          type: string
          minLength: 1
    ServerPerformance:
      type: object
      additionalProperties: false
      required:
        - tpsOneMinute
        - averageTickTimeMillis
      properties:
        tpsOneMinute:
          type: number
          format: double
          minimum: 0
        averageTickTimeMillis:
          type: number
          format: double
          minimum: 0
    OnlinePlayer:
      type: object
      additionalProperties: false
      required:
        - name
        - world
        - gameMode
        - facing
        - blockPosition
      properties:
        name:
          type: string
          minLength: 1
        world:
          $ref: '#/components/schemas/WorldName'
        gameMode:
          type: string
          enum:
            - survival
            - creative
            - adventure
            - spectator
        facing:
          type: string
          description: Current horizontal cardinal direction the player is facing.
          enum:
            - north
            - east
            - south
            - west
        blockPosition:
          $ref: '#/components/schemas/BlockPosition'
    PlayerSummary:
      type: object
      additionalProperties: false
      description: Current player counts and entries; online equals entries length, and entries are ordered by case-insensitive player name.
      required:
        - online
        - maximum
        - entries
      properties:
        online:
          $ref: '#/components/schemas/NonNegativeInt32'
        maximum:
          $ref: '#/components/schemas/NonNegativeInt32'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/OnlinePlayer'
    WorldStatus:
      type: object
      additionalProperties: false
      required:
        - name
        - environment
        - minY
        - maxY
        - spawn
        - timeOfDay
        - storm
        - thundering
        - playerCount
      properties:
        name:
          $ref: '#/components/schemas/WorldName'
        environment:
          type: string
          description: Paper world environment.
          enum:
            - normal
            - nether
            - the_end
            - custom
        minY:
          $ref: '#/components/schemas/Int32'
          description: Minimum valid block Y, inclusive.
        maxY:
          $ref: '#/components/schemas/Int32'
          description: Maximum valid block Y, inclusive.
        spawn:
          $ref: '#/components/schemas/BlockPosition'
        timeOfDay:
          type: integer
          format: int64
          minimum: 0
          maximum: 23999
        storm:
          type: boolean
        thundering:
          type: boolean
        playerCount:
          $ref: '#/components/schemas/NonNegativeInt32'
    ServerStatusRequest:
      type: object
      additionalProperties: false
      required:
        - includePlayers
        - includeWorlds
        - includeConfiguration
      properties:
        includePlayers:
          type: boolean
        includeWorlds:
          type: boolean
        includeConfiguration:
          type: boolean
    ServerStatusResponse:
      type: object
      additionalProperties: false
      required:
        - builds
        - performance
        - players
        - worlds
        - configuration
      properties:
        builds:
          $ref: '#/components/schemas/ServerBuilds'
        performance:
          $ref: '#/components/schemas/ServerPerformance'
        players:
          description: Player summary when requested; otherwise null.
          oneOf:
            - $ref: '#/components/schemas/PlayerSummary'
            - type: 'null'
        worlds:
          description: Loaded worlds when requested; otherwise null.
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/WorldStatus'
            - type: 'null'
        configuration:
          description: Client-relevant operation configuration when requested; otherwise null.
          oneOf:
            - $ref: '#/components/schemas/ServerStatusConfiguration'
            - type: 'null'
