openapi: 3.2.0
info:
  title: Dirt MCP Paper Bridge
  version: 0.1.0
  description: Local contract between the Dirt MCP stdio server and Paper plugin.
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:8765
    description: Default loopback development endpoint
security:
  - bearerAuth: []
paths:
  /v1/ping:
    get:
      operationId: pingServer
      summary: Verify the authenticated Dirt-to-Paper-to-FAWE path without mutation
      responses:
        '200':
          description: Every Dirt MCP runtime layer is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/GetMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Dirt, Paper, or FAWE is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/server-status:
    get:
      operationId: getServerStatus
      summary: Report current server, player, world, build, limit, logging, and MCP tool context
      responses:
        '200':
          description: Lightweight current server and active Dirt configuration context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/GetMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Current Paper context is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/count-region-block-states:
    post:
      operationId: countRegionBlockStates
      summary: Count block states in a bounded region of loaded chunks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountRegionBlockStatesRequest'
      responses:
        '200':
          description: Region inspection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountRegionBlockStatesResponse'
        '400':
          description: Invalid JSON, fields, coordinates, or world height
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '413':
          description: Normalized region exceeds the configured volume or touched-chunk limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected inspection failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Region contains an unloaded chunk, inspection was interrupted, or inspection capacity is exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/get-blocks:
    post:
      operationId: getBlocks
      summary: Return replay-ready exact block structure from a bounded region of loaded chunks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetBlocksRequest'
      responses:
        '200':
          description: Exact singleton palettes with origin-relative placements and inclusive cuboids
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBlocksResponse'
        '400':
          description: Invalid JSON, fields, coordinates, filters, options, or world height
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '413':
          description: Region volume, touched chunks, or exact result exceeds its limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected inspection failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Region contains an unloaded chunk, inspection was interrupted, or inspection capacity is exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/scan-orthographic-view:
    post:
      operationId: scanOrthographicView
      summary: Return a selected non-air depth along each sightline in an orthographic view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanOrthographicViewRequest'
      responses:
        '200':
          description: Exact sparse visible block layer and its world-aligned view basis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanOrthographicViewResponse'
        '400':
          description: Invalid JSON, fields, coordinates, view geometry, or world height
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '413':
          description: View volume, touched chunks, or exact result exceeds its limit; scan-volume messages report requested and maximum volumes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected inspection failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: View contains an unloaded chunk, inspection was interrupted, or inspection capacity is exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/get-player-context:
    post:
      operationId: getPlayerContext
      summary: Capture an online player's pose and optional state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetPlayerContextRequest'
      responses:
        '200':
          description: One coherent player snapshot with the requested optional sections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPlayerContextResponse'
        '400':
          description: Invalid player selector or include flags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The selected player is not online
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '500':
          description: Unexpected player-context failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Paper access was interrupted or unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/get-perspective-view:
    post:
      operationId: getPerspectiveView
      summary: Trace a bounded perspective block view from a player or arbitrary camera
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetPerspectiveViewRequest'
      responses:
        '200':
          description: Resolved camera pose and exact sparse first block-collision hits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPerspectiveViewResponse'
        '400':
          description: Invalid source, coordinates, rotation, or perspective options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The selected player is not online or the selected world is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '409':
          description: The selected player camera cannot be represented safely
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: The ray count, ray-distance budget, or checked-chunk count exceeds its inspection limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected perspective-view failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: A required chunk is unloaded, Paper access was interrupted, or inspection capacity is exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/replace-region-blocks:
    post:
      operationId: replaceRegionBlocks
      summary: Replace block-state patterns with a weighted palette in loaded chunks
      parameters:
        - $ref: '#/components/parameters/DirtCallId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceRegionBlocksRequest'
      responses:
        '200':
          description: Executed edit or exact dry-run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceRegionBlocksResponse'
        '400':
          description: Invalid call ID, JSON, fields, coordinates, world height, or block state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '409':
          description: Another Dirt MCP world operation is active or the newest retained edit requires recovery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Region volume, touched chunks, or exact changed-block count exceeds its configured limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected edit failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Region contains an unloaded chunk, editing was interrupted, or bounded history capacity was unavailable before mutation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/fill-region:
    post:
      operationId: fillRegion
      summary: Fill a bounded region of loaded chunks with a weighted palette
      parameters:
        - $ref: '#/components/parameters/DirtCallId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FillRegionRequest'
      responses:
        '200':
          description: Executed edit or exact dry-run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FillRegionResponse'
        '400':
          description: Invalid call ID, JSON, fields, coordinates, world height, or block state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '409':
          description: Another Dirt MCP world operation is active or the newest retained edit requires recovery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Region volume, touched chunks, or exact changed-block count exceeds its configured limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected edit failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Region contains an unloaded chunk, editing was interrupted, or bounded history capacity was unavailable before mutation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/set-blocks:
    post:
      operationId: setBlocks
      summary: Place weighted-palette states from origin-relative placements and cuboids in one edit
      parameters:
        - $ref: '#/components/parameters/DirtCallId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetBlocksRequest'
      responses:
        '200':
          description: Executed edit or exact dry-run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetBlocksResponse'
        '400':
          description: Invalid call ID, JSON, fields, palettes, geometry, resolved coordinates, world height, block state, or overlapping block
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '409':
          description: Another Dirt MCP world operation is active or the newest retained edit requires recovery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Expanded block count, touched chunks, or changed-block count exceeds its configured limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected edit failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: A represented block is in an unloaded chunk, editing was interrupted, or bounded history capacity was unavailable before mutation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/get-edit-history:
    post:
      operationId: getEditHistory
      summary: Return the retained undoable Dirt edit history for a loaded world
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetEditHistoryRequest'
      responses:
        '200':
          description: Retained undoable edits ordered newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEditHistoryResponse'
        '400':
          description: Invalid JSON or fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '409':
          description: Another Dirt MCP world operation is active in this world
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected history lookup failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Edit history is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/undo-edit:
    post:
      operationId: undoEdit
      summary: Undo an identified retained Dirt edit in a loaded world
      parameters:
        - $ref: '#/components/parameters/DirtCallId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UndoEditRequest'
      responses:
        '200':
          description: Completed identified undo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UndoEditResponse'
        '400':
          description: Invalid call ID, JSON, fields, or edit ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: World is not loaded or the edit is not retained
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '409':
          description: The edit is not the newest retained edit or another Dirt MCP world operation is active in this world
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected undo failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Undo was interrupted, its world became unavailable, or an existing touched chunk could not be loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/run-minecraft-commands:
    post:
      operationId: runMinecraftCommands
      summary: Run registered Minecraft commands sequentially with operator-level permissions
      parameters:
        - $ref: '#/components/parameters/DirtCallId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunMinecraftCommandsRequest'
      responses:
        '200':
          description: Complete ordered dispatch results, or the attempted prefix through the first per-command failure, with bounded synchronous feedback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunMinecraftCommandsResponse'
        '400':
          description: Invalid call ID, JSON, fields, command strings, or command count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '500':
          description: Unexpected command-runner failure; earlier commands may already have taken effect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Bridge admission capacity or Paper command execution is unavailable, or the main-thread scheduler boundary could not be crossed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  parameters:
    DirtCallId:
      name: X-Dirt-Call-Id
      in: header
      required: true
      description: UUIDv4 mutation correlation ID. Creating edits retain it as callId; successful undo returns it as undoCallId.
      schema:
        $ref: '#/components/schemas/UuidV4'
  responses:
    InternalError:
      description: Unexpected internal failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid bearer token
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer realm="dirt-mcp"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GetMethodNotAllowed:
      description: Method not allowed
      headers:
        Allow:
          schema:
            const: GET
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PostMethodNotAllowed:
      description: Method not allowed
      headers:
        Allow:
          schema:
            const: POST
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/BridgeError'
    BridgeError:
      description: Code-discriminated error. Correctable failures require strict machine-readable details; internal errors deliberately omit them.
      oneOf:
        - $ref: '#/components/schemas/BridgeBusyError'
        - $ref: '#/components/schemas/ChangeLimitExceededError'
        - $ref: '#/components/schemas/EditNotFoundError'
        - $ref: '#/components/schemas/EditNotLatestError'
        - $ref: '#/components/schemas/HistoryCapacityExceededError'
        - $ref: '#/components/schemas/InternalErrorDetail'
        - $ref: '#/components/schemas/InvalidRequestError'
        - $ref: '#/components/schemas/MethodNotAllowedError'
        - $ref: '#/components/schemas/NotFoundError'
        - $ref: '#/components/schemas/PlayerNotFoundError'
        - $ref: '#/components/schemas/PlayerUnavailableError'
        - $ref: '#/components/schemas/RegionTooLargeError'
        - $ref: '#/components/schemas/ResultTooLargeError'
        - $ref: '#/components/schemas/ServerUnavailableError'
        - $ref: '#/components/schemas/UnauthorizedError'
        - $ref: '#/components/schemas/UnhealthyError'
        - $ref: '#/components/schemas/WorldBusyError'
        - $ref: '#/components/schemas/WorldNotFoundError'
        - $ref: '#/components/schemas/WorldUnavailableError'
    BridgeErrorCode:
      type: string
      enum:
        - bridge_busy
        - change_limit_exceeded
        - edit_not_found
        - edit_not_latest
        - history_capacity_exceeded
        - internal_error
        - invalid_request
        - method_not_allowed
        - not_found
        - player_not_found
        - player_unavailable
        - region_too_large
        - result_too_large
        - server_unavailable
        - unauthorized
        - unhealthy
        - world_busy
        - world_not_found
        - world_unavailable
    BridgeErrorBase:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/BridgeErrorCode'
        editId:
          description: Edit transaction associated with a failure that may need reconciliation against retained history; an absent history record means no undoable edit remains.
          $ref: '#/components/schemas/UuidV4'
        message:
          type: string
          minLength: 1
    BridgeBusyError:
      allOf:
        - $ref: '#/components/schemas/BridgeErrorBase'
        - type: object
          required:
            - details
          properties:
            code:
              const: bridge_busy
            details:
              type: object
              additionalProperties: false
              required:
                - maximumConcurrentRequests
              properties:
                maximumConcurrentRequests:
                  $ref: '#/components/schemas/PositiveInt32'
      unevaluatedProperties: false
    ChangeLimitExceededError:
      allOf:
        - $ref: '#/components/schemas/BridgeErrorBase'
        - type: object
          required:
            - details
          properties:
            code:
              const: change_limit_exceeded
            details:
              type: object
              additionalProperties: false
              required:
                - maximum
              properties:
                maximum:
                  $ref: '#/components/schemas/PositiveInt32'
      unevaluatedProperties: false
    EditNotFoundError:
      allOf:
        - $ref: '#/components/schemas/BridgeErrorBase'
        - type: object
          required:
            - details
          properties:
            code:
              const: edit_not_found
            details:
              type: object
              additionalProperties: false
              required:
                - world
                - requestedEditId
              properties:
                world:
                  type: string
                  minLength: 1
                  pattern: '.*\S.*'
                requestedEditId:
                  $ref: '#/components/schemas/UuidV4'
      unevaluatedProperties: false
    EditNotLatestError:
      allOf:
        - $ref: '#/components/schemas/BridgeErrorBase'
        - type: object
          required:
            - details
          properties:
            code:
              const: edit_not_latest
            details:
              type: object
              additionalProperties: false
              description: requestedEditId and newestEditId identify distinct edits.
              required:
                - world
                - requestedEditId
                - newestEditId
              properties:
                world:
                  type: string
                  minLength: 1
                  pattern: '.*\S.*'
                requestedEditId:
                  $ref: '#/components/schemas/UuidV4'
                newestEditId:
                  $ref: '#/components/schemas/UuidV4'
      unevaluatedProperties: false
    HistoryCapacityExceededError:
      allOf:
        - $ref: '#/components/schemas/BridgeErrorBase'
        - type: object
          required:
            - details
          properties:
            code:
              const: history_capacity_exceeded
            details:
              $ref: '#/components/schemas/HistoryCapacityDetails'
      unevaluatedProperties: false
    InternalErrorDetail:
      allOf:
        - $ref: '#/components/schemas/BridgeErrorBase'
        - type: object
          properties:
            code:
              const: internal_error
      unevaluatedProperties: false
    InvalidRequestError:
      allOf:
        - $ref: '#/components/schemas/BridgeErrorBase'
        - type: object
          required:
            - details
          properties:
            code:
              const: invalid_request
            details:
              $ref: '#/components/schemas/InvalidRequestDetails'
      unevaluatedProperties: false
    MethodNotAllowedError:
      allOf:
        - $ref: '#/components/schemas/BridgeErrorBase'
        - type: object
          required:
            - details
          properties:
            code:
              const: method_not_allowed
            details:
              type: object
              additionalProperties: false
              required:
                - allowedMethod
              properties:
                allowedMethod:
                  type: string
                  enum:
                    - GET
                    - POST
      unevaluatedProperties: false
    NotFoundError:
      allOf:
        - $ref: '#/components/schemas/BridgeErrorBase'
        - type: object
          required:
            - details
          properties:
            code:
              const: not_found
            details:
              type: object
              additionalProperties: false
              required:
                - reason
              properties:
                reason:
                  const: route_not_found
      unevaluatedProperties: false
    PlayerNotFoundError:
