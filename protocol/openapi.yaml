          description: Palette-indexed origin-relative positions; resolved positions must be distinct.
          items:
            $ref: '#/components/schemas/PalettePlacement'
        seed:
          type: integer
          format: int32
          description: A supplied seed is echoed in the response; omission generates and returns a fresh seed.
        dryRun:
          type: boolean
          description: True requires a preview outcome, false excludes preview, and omission uses the configured set-blocks default.
    SetBlocksResponse:
      type: object
      additionalProperties: false
      oneOf:
        - properties:
            outcome:
              const: preview
            edit:
              type: 'null'
        - properties:
            outcome:
              const: no_change
            changedBlockCount:
              const: 0
            edit:
              type: 'null'
        - properties:
            outcome:
              const: committed
            changedBlockCount:
              minimum: 1
            edit:
              allOf:
                - $ref: '#/components/schemas/EditRecord'
                - properties:
                    operation:
                      const: set_blocks
                    status:
                      const: committed
      required:
        - world
        - bounds
        - palettes
        - seed
        - outcome
        - edit
        - blockCount
        - changedBlockCount
        - unchangedBlockCount
      properties:
        world:
          type: string
          minLength: 1
        bounds:
          description: Smallest inclusive bounds containing all requested resolved placements.
          $ref: '#/components/schemas/Bounds'
        palettes:
          type: array
          minItems: 1
          maxItems: 64
          description: Canonical palettes used by the edit.
          items:
            type: array
            minItems: 1
            maxItems: 64
            items:
              $ref: '#/components/schemas/DestinationPaletteEntry'
        seed:
          type: integer
          format: int32
          description: Supplied request seed, or the generated seed when the request omitted one.
        outcome:
          type: string
          description: Explicit dryRun=true requires preview; false excludes preview.
          enum:
            - preview
            - no_change
            - committed
        edit:
          oneOf:
            - $ref: '#/components/schemas/EditRecord'
            - type: 'null'
        blockCount:
          type: integer
          format: int64
          minimum: 1
          description: Number of placements in the request.
        changedBlockCount:
          type: integer
          format: int64
          minimum: 0
          description: Blocks changed or that would change; together with unchangedBlockCount equals blockCount.
        unchangedBlockCount:
          type: integer
          format: int64
          minimum: 0
          description: Blocks already in their requested state; together with changedBlockCount equals blockCount.
    GetEditHistoryRequest:
      type: object
      additionalProperties: false
      required:
        - world
      properties:
        world:
          type: string
          minLength: 1
          pattern: '.*\S.*'
    GetEditHistoryResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - edits
      properties:
        world:
          type: string
          minLength: 1
        edits:
          type: array
          uniqueItems: true
          description: Retained undoable edit records for one loaded world UUID, ordered newest first with distinct edit IDs.
          items:
            $ref: '#/components/schemas/EditRecord'
    UndoEditRequest:
      type: object
      additionalProperties: false
      required:
        - world
        - editId
      properties:
        world:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        editId:
          $ref: '#/components/schemas/UuidV4'
    UndoEditResponse:
      type: object
      additionalProperties: false
      required:
        - edit
        - undoCallId
        - undoneAt
      properties:
        edit:
          description: Edit record as retained immediately before the successful undo consumed it.
          $ref: '#/components/schemas/EditRecord'
        undoCallId:
          $ref: '#/components/schemas/UuidV4'
        undoneAt:
          type: string
          format: date-time
    LimitConfiguration:
      type: object
      additionalProperties: false
      required:
        - maxRequestBytes
        - maxRegionVolume
        - maxTouchedChunks
        - maxInspectionTouchedChunks
        - maxBlockStatePatterns
        - maxChangedBlocks
        - maxInspectionVolume
        - defaultInspectionResultLimit
        - maxInspectionResultLimit
      properties:
        maxRequestBytes:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483646
          description: Maximum JSON request-body size accepted by the bridge; capped below the signed 32-bit maximum so over-limit detection cannot overflow.
        maxRegionVolume:
          type: integer
          format: int32
          minimum: 1
          description: Maximum cuboid mutation/count volume or placements in set_blocks.
        maxTouchedChunks:
          type: integer
          format: int32
          minimum: 1
          description: Maximum distinct loaded chunks one mutation may touch.
        maxInspectionTouchedChunks:
          type: integer
          format: int32
          minimum: 1
          description: Maximum distinct loaded chunks one inspection may snapshot; cannot exceed maxTouchedChunks.
        maxBlockStatePatterns:
          type: integer
          format: int32
          minimum: 1
          maximum: 64
          description: Maximum block-state patterns or palette entries in one operation; inspection include and exclude lists share this cap.
        maxChangedBlocks:
          type: integer
          format: int32
          minimum: 1
          description: Maximum blocks one mutation may change; cannot exceed maxRegionVolume.
        maxInspectionVolume:
          type: integer
          format: int32
          minimum: 1
          description: Maximum blocks scanned by exact block retrieval or an orthographic view; cannot exceed maxRegionVolume.
        defaultInspectionResultLimit:
          type: integer
          format: int32
          minimum: 1
          description: Default exact-block, run, or visible-block result limit; cannot exceed maxInspectionResultLimit.
        maxInspectionResultLimit:
          type: integer
          format: int32
          minimum: 1
          description: Maximum caller-selectable exact-block, run, or visible-block result limit; cannot exceed maxInspectionVolume.
    EditHistoryConfiguration:
      type: object
      additionalProperties: false
      required:
        - maxEntriesPerWorld
        - maxEntriesTotal
        - maxRetainedChangedBlocks
      properties:
        maxEntriesPerWorld:
          type: integer
          format: int32
          minimum: 1
          description: Maximum retained undoable edits in one loaded world; cannot exceed maxEntriesTotal.
        maxEntriesTotal:
          type: integer
          format: int32
          minimum: 1
          description: Maximum retained undoable edits across all loaded worlds.
        maxRetainedChangedBlocks:
          type: integer
          format: int32
          minimum: 1
          description: Maximum sum of changed-block counts across all retained undoable edits; must be at least LimitConfiguration.maxChangedBlocks.
    DefaultConfiguration:
      type: object
      additionalProperties: false
      required:
        - regionBlocksIncludeAir
        - regionBlocksFormat
        - editDryRun
      properties:
        regionBlocksIncludeAir:
          type: boolean
        regionBlocksFormat:
          type: string
          enum:
            - blocks
            - runs
        editDryRun:
          type: boolean
          description: Default dry-run behavior for every Dirt block-edit tool.
    LoggingConfiguration:
      type: object
      additionalProperties: false
      description: Active operator-console threshold and rotating Paper detail-log limits.
      required:
        - consoleLevel
        - detailFileMaxBytes
        - detailFileRetainedFiles
      properties:
        consoleLevel:
          type: string
          enum:
            - info
            - warning
            - error
          description: Minimum severity emitted to the Paper server console.
        detailFileMaxBytes:
          type: integer
          format: int32
          minimum: 1
          description: Approximate maximum bytes in each Paper JSONL detail-log generation before rotation.
        detailFileRetainedFiles:
          type: integer
          format: int32
          minimum: 2
          maximum: 100
          description: Number of rotating Paper JSONL detail-log generations retained, including the active generation.
    ToolConfiguration:
      type: object
      additionalProperties: false
      description: Resolved MCP tool allowlist. Every flag is reported; a tool omitted from YAML resolves to false.
      required:
        - ping_server
        - get_server_status
        - count_region_block_states
        - get_region_blocks
        - scan_orthographic_view
        - replace_region_blocks
        - fill_region
        - set_blocks
        - get_edit_history
        - undo_edit
      properties:
        ping_server:
          type: boolean
        get_server_status:
          type: boolean
        count_region_block_states:
          type: boolean
        get_region_blocks:
          type: boolean
        scan_orthographic_view:
          type: boolean
        replace_region_blocks:
          type: boolean
        fill_region:
          type: boolean
        set_blocks:
          type: boolean
        get_edit_history:
          type: boolean
        undo_edit:
          type: boolean
    PingResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          const: ok
    ServerBuilds:
      type: object
      additionalProperties: false
      required:
        - minecraft
        - paper
        - dirtMcp
        - fawe
      properties:
        minecraft:
          type: string
          minLength: 1
        paper:
          type: string
          minLength: 1
        dirtMcp:
          type: string
          minLength: 1
        fawe:
          type: string
          minLength: 1
    ServerPerformance:
      type: object
      additionalProperties: false
      required:
        - tpsOneMinute
        - averageTickTimeMillis
      properties:
        tpsOneMinute:
          type: number
          format: double
          minimum: 0
        averageTickTimeMillis:
          type: number
          format: double
          minimum: 0
    OnlinePlayer:
      type: object
      additionalProperties: false
      required:
        - name
        - world
        - gameMode
        - facing
        - blockPosition
      properties:
        name:
          type: string
          minLength: 1
        world:
          type: string
          minLength: 1
        gameMode:
          type: string
          enum:
            - survival
            - creative
            - adventure
            - spectator
        facing:
          type: string
          description: Current horizontal cardinal direction the player is facing.
          enum:
            - north
            - east
            - south
            - west
        blockPosition:
          $ref: '#/components/schemas/BlockPosition'
    PlayerSummary:
      type: object
      additionalProperties: false
      required:
        - online
        - maximum
        - entries
      properties:
        online:
          type: integer
          format: int32
          minimum: 0
        maximum:
          type: integer
          format: int32
          minimum: 0
        entries:
          type: array
          items:
            $ref: '#/components/schemas/OnlinePlayer'
    WorldStatus:
      type: object
      additionalProperties: false
      required:
        - name
        - environment
        - minY
        - maxY
        - spawn
        - timeOfDay
        - storm
        - thundering
        - playerCount
      properties:
        name:
          type: string
          minLength: 1
        environment:
          type: string
          minLength: 1
        minY:
          type: integer
          format: int32
        maxY:
          type: integer
          format: int32
        spawn:
          $ref: '#/components/schemas/BlockPosition'
        timeOfDay:
          type: integer
          format: int64
          minimum: 0
          maximum: 23999
        storm:
          type: boolean
        thundering:
          type: boolean
        playerCount:
          type: integer
          format: int32
          minimum: 0
    ServerStatusResponse:
      type: object
      additionalProperties: false
      required:
        - builds
        - performance
        - players
        - worlds
        - limits
        - editHistory
        - defaults
        - logging
        - tools
      properties:
        builds:
          $ref: '#/components/schemas/ServerBuilds'
        performance:
          $ref: '#/components/schemas/ServerPerformance'
        players:
          $ref: '#/components/schemas/PlayerSummary'
        worlds:
          type: array
          items:
            $ref: '#/components/schemas/WorldStatus'
        limits:
          $ref: '#/components/schemas/LimitConfiguration'
        editHistory:
          $ref: '#/components/schemas/EditHistoryConfiguration'
        defaults:
          $ref: '#/components/schemas/DefaultConfiguration'
        logging:
          $ref: '#/components/schemas/LoggingConfiguration'
        tools:
          $ref: '#/components/schemas/ToolConfiguration'
