openapi: 3.2.0
info:
  title: Dirt MCP Paper Bridge
  version: 0.1.0
  description: Local contract between the Dirt MCP stdio server and Paper plugin.
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:8765
    description: Default loopback development endpoint
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Report bridge availability and implemented capabilities
      responses:
        '200':
          description: Bridge health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '405':
          description: Method not allowed
          headers:
            Allow:
              description: Methods supported by this endpoint.
              schema:
                const: GET
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          const: method_not_allowed
    Health:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - version
        - minecraftVersion
        - capabilities
      properties:
        status:
          const: ok
        service:
          const: dirt-mcp-paper
        version:
          type: string
        minecraftVersion:
          type: string
        capabilities:
          type: object
          additionalProperties: false
          required:
            - worldEditing
          properties:
            worldEditing:
              const: false
