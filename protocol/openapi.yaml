    InvalidRequestDetails:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - reason
            - expected
          properties:
            reason:
              const: unsupported_media_type
            expected:
              const: application/json
        - type: object
          additionalProperties: false
          required:
            - reason
            - maximumBytes
          properties:
            reason:
              const: body_too_large
            maximumBytes:
              $ref: '#/components/schemas/PositiveInt32'
        - type: object
          additionalProperties: false
          required:
            - reason
          properties:
            reason:
              const: malformed_json
        - type: object
          additionalProperties: false
          required:
            - reason
            - field
          properties:
            reason:
              type: string
              enum:
                - missing
                - invalid_value
                - duplicate
                - unknown_fields
            field:
              type: string
              minLength: 1
              pattern: '.*\S.*'
        - type: object
          additionalProperties: false
          description: allowedValues is the non-empty unique list of values supported for target.
          required:
            - reason
            - target
            - allowedValues
          properties:
            reason:
              const: unsupported_value
            target:
              type: string
              minLength: 1
              pattern: '.*\S.*'
            allowedValues:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: string
                minLength: 1
                pattern: '.*\S.*'
        - type: object
          additionalProperties: false
          description: value must be outside the inclusive range from minimum through maximum, and minimum must be less than or equal to maximum.
          required:
            - reason
            - target
            - value
            - minimum
            - maximum
          properties:
            reason:
              const: out_of_range
            target:
              type: string
              minLength: 1
              pattern: '.*\S.*'
            value:
              description: Rejected value.
              $ref: '#/components/schemas/JsonSafeInteger'
            minimum:
              $ref: '#/components/schemas/JsonSafeInteger'
            maximum:
              $ref: '#/components/schemas/JsonSafeInteger'
        - type: object
          additionalProperties: false
          description: fields is a non-empty unique list of request fields whose aggregate item count exceeds maximum.
          required:
            - reason
            - fields
            - maximum
          properties:
            reason:
              const: too_many_items
            fields:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: string
                minLength: 1
                pattern: '.*\S.*'
            maximum:
              $ref: '#/components/schemas/PositiveInt32'
        - type: object
          additionalProperties: false
          required:
            - reason
            - field
          properties:
            reason:
              const: palette_weights_mixed
            field:
              type: string
              minLength: 1
              pattern: '.*\S.*'
        - type: object
          additionalProperties: false
          description: requested is the positive palette weight total and must differ from required, which is always 100.
          required:
            - reason
            - field
            - requested
            - required
          properties:
            reason:
              const: palette_weight_total
            field:
              type: string
              minLength: 1
              pattern: '.*\S.*'
            requested:
              allOf:
                - $ref: '#/components/schemas/PositiveJsonSafeInteger'
                - not:
                    const: 100
            required:
              const: 100
