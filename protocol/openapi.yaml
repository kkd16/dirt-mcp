openapi: 3.2.0
info:
  title: Dirt MCP Paper Bridge
  version: 0.1.0
  description: Local contract between the Dirt MCP stdio server and Paper plugin.
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:8765
    description: Default loopback development endpoint
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Report bridge availability and versions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Bridge health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '401':
          description: Missing or invalid bearer token
          headers:
            WWW-Authenticate:
              schema:
                type: string
                const: Bearer realm="dirt-mcp"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed
          headers:
            Allow:
              description: Methods supported by this endpoint.
              schema:
                const: GET
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/inspect-region:
    post:
      operationId: inspectRegion
      summary: Count block states in a bounded region of loaded chunks
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectRegionRequest'
      responses:
        '200':
          description: Region inspection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectRegionResponse'
        '400':
          description: Invalid JSON, fields, coordinates, or world height
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          headers:
            WWW-Authenticate:
              schema:
                type: string
                const: Bearer realm="dirt-mcp"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed
          headers:
            Allow:
              schema:
                const: POST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Normalized region exceeds the configured volume limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected inspection failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Region contains an unloaded chunk or inspection was interrupted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/replace-blocks:
    post:
      operationId: replaceBlocks
      summary: Replace one exact block state in a bounded region of loaded chunks
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceBlocksRequest'
      responses:
        '200':
          description: Executed edit or exact dry-run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceBlocksResponse'
        '400':
          description: Invalid JSON, fields, coordinates, world height, or block state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          headers:
            WWW-Authenticate:
              schema:
                type: string
                const: Bearer realm="dirt-mcp"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed
          headers:
            Allow:
              schema:
                const: POST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Another Dirt MCP edit is active in this world
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Region volume or estimated changed-block count exceeds its configured limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected edit failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Region contains an unloaded chunk or editing was interrupted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/undo-last-edit:
    post:
      operationId: undoLastEdit
      summary: Undo the newest successful Dirt MCP edit in a loaded world
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UndoLastEditRequest'
      responses:
        '200':
          description: Completed undo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UndoLastEditResponse'
        '400':
          description: Invalid JSON or fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          headers:
            WWW-Authenticate:
              schema:
                type: string
                const: Bearer realm="dirt-mcp"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed
          headers:
            Allow:
              schema:
                const: POST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: No undo is available or another Dirt MCP edit is active in this world
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected undo failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Undo was interrupted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - internal_error
                - invalid_request
                - method_not_allowed
                - change_limit_exceeded
                - nothing_to_undo
                - region_too_large
                - unauthorized
                - world_busy
                - world_not_found
                - world_unavailable
            message:
              type: string
    BlockPosition:
      type: object
      additionalProperties: false
      required:
        - x
        - y
        - z
      properties:
        x:
          type: integer
          format: int32
        y:
          type: integer
          format: int32
        z:
          type: integer
          format: int32
    Dimensions:
      type: object
      additionalProperties: false
      required:
        - x
        - y
        - z
      properties:
        x:
          type: integer
          format: int64
          minimum: 1
        y:
          type: integer
          format: int64
          minimum: 1
        z:
          type: integer
          format: int64
          minimum: 1
    InspectRegionRequest:
      type: object
      additionalProperties: false
      required:
        - world
        - min
        - max
      properties:
        world:
          type: string
          minLength: 1
        min:
          $ref: '#/components/schemas/BlockPosition'
        max:
          $ref: '#/components/schemas/BlockPosition'
    InspectRegionResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - bounds
        - dimensions
        - volume
        - blockStates
      properties:
        world:
          type: string
          minLength: 1
        bounds:
          type: object
          additionalProperties: false
          required:
            - min
            - max
          properties:
            min:
              $ref: '#/components/schemas/BlockPosition'
            max:
              $ref: '#/components/schemas/BlockPosition'
        dimensions:
          $ref: '#/components/schemas/Dimensions'
        volume:
          type: integer
          format: int64
          minimum: 1
        blockStates:
          type: object
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
    ReplaceBlocksRequest:
      type: object
      additionalProperties: false
      required:
        - world
        - min
        - max
        - source
        - destination
      properties:
        world:
          type: string
          minLength: 1
        min:
          $ref: '#/components/schemas/BlockPosition'
        max:
          $ref: '#/components/schemas/BlockPosition'
        source:
          type: string
          minLength: 1
        destination:
          type: string
          minLength: 1
        dryRun:
          type: boolean
          default: false
    ReplaceBlocksResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - bounds
        - source
        - destination
        - dryRun
        - matchedBlocks
        - changedBlocks
      properties:
        world:
          type: string
          minLength: 1
        bounds:
          type: object
          additionalProperties: false
          required:
            - min
            - max
          properties:
            min:
              $ref: '#/components/schemas/BlockPosition'
            max:
              $ref: '#/components/schemas/BlockPosition'
        source:
          type: string
          minLength: 1
        destination:
          type: string
          minLength: 1
        dryRun:
          type: boolean
        matchedBlocks:
          type: integer
          format: int64
          minimum: 0
        changedBlocks:
          type: integer
          format: int64
          minimum: 0
    UndoLastEditRequest:
      type: object
      additionalProperties: false
      required:
        - world
      properties:
        world:
          type: string
          minLength: 1
    UndoLastEditResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - changedBlocks
      properties:
        world:
          type: string
          minLength: 1
        changedBlocks:
          type: integer
          format: int64
          minimum: 1
    Health:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - version
        - minecraftVersion
      properties:
        status:
          const: ok
        service:
          const: dirt-mcp-paper
        version:
          type: string
        minecraftVersion:
          type: string
