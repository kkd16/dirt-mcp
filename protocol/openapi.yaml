openapi: 3.2.0
info:
  title: Dirt MCP Paper Bridge
  version: 0.1.0
  description: Local contract between the Dirt MCP stdio server and Paper plugin.
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:8765
    description: Default loopback development endpoint
security:
  - bearerAuth: []
paths:
  /v1/ping:
    get:
      operationId: pingServer
      summary: Verify the authenticated Dirt-to-Paper-to-FAWE path without mutation
      responses:
        '200':
          description: Every Dirt MCP runtime layer is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/GetMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Dirt, Paper, or FAWE is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/server-status:
    get:
      operationId: getServerStatus
      summary: Report current server, player, world, build, and tool-limit context
      responses:
        '200':
          description: Lightweight current server context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/GetMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Current Paper context is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/count-region-block-states:
    post:
      operationId: countRegionBlockStates
      summary: Count block states in a bounded region of loaded chunks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountRegionBlockStatesRequest'
      responses:
        '200':
          description: Region inspection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountRegionBlockStatesResponse'
        '400':
          description: Invalid JSON, fields, coordinates, or world height
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '413':
          description: Normalized region exceeds the configured volume or touched-chunk limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected inspection failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Region contains an unloaded chunk, inspection was interrupted, or inspection capacity is exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/get-region-blocks:
    post:
      operationId: getRegionBlocks
      summary: Return exact filtered block geometry from a bounded region of loaded chunks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetRegionBlocksRequest'
      responses:
        '200':
          description: Exact sparse blocks or deterministic axis-aligned runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRegionBlocksResponse'
        '400':
          description: Invalid JSON, fields, coordinates, filters, options, or world height
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '413':
          description: Region volume, touched chunks, or exact result exceeds its limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected inspection failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Region contains an unloaded chunk, inspection was interrupted, or inspection capacity is exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/scan-orthographic-view:
    post:
      operationId: scanOrthographicView
      summary: Return the first non-air block along each sightline in an orthographic view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanOrthographicViewRequest'
      responses:
        '200':
          description: Exact sparse visible block layer and its world-aligned view basis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanOrthographicViewResponse'
        '400':
          description: Invalid JSON, fields, coordinates, view geometry, or world height
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '413':
          description: View volume, touched chunks, or exact result exceeds its limit; scan-volume messages report requested and maximum volumes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected inspection failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: View contains an unloaded chunk, inspection was interrupted, or inspection capacity is exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/replace-region-blocks:
    post:
      operationId: replaceRegionBlocks
      summary: Replace block-state patterns with a weighted palette in loaded chunks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceRegionBlocksRequest'
      responses:
        '200':
          description: Executed edit or exact dry-run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceRegionBlocksResponse'
        '400':
          description: Invalid JSON, fields, coordinates, world height, or block state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '409':
          description: Another Dirt MCP edit is active or a failed edit requires recovery undo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Region volume, touched chunks, or exact changed-block count exceeds its configured limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected edit failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Region contains an unloaded chunk or editing was interrupted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/fill-region:
    post:
      operationId: fillRegion
      summary: Fill a bounded region of loaded chunks with a weighted palette
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FillRegionRequest'
      responses:
        '200':
          description: Executed edit or exact dry-run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FillRegionResponse'
        '400':
          description: Invalid JSON, fields, coordinates, world height, or block state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '409':
          description: Another Dirt MCP edit is active or a failed edit requires recovery undo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Region volume, touched chunks, or estimated changed-block count exceeds its configured limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected edit failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Region contains an unloaded chunk or editing was interrupted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/set-blocks:
    post:
      operationId: setBlocks
      summary: Place palette states at origin-relative offsets in one edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetBlocksRequest'
      responses:
        '200':
          description: Executed edit or exact dry-run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetBlocksResponse'
        '400':
          description: Invalid JSON, fields, palette, offsets, resolved coordinates, world height, block state, or duplicate position
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '409':
          description: Another Dirt MCP edit is active or a failed edit requires recovery undo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Position count, touched chunks, or changed-block count exceeds its configured limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected edit failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: A listed position is in an unloaded chunk or editing was interrupted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/undo-last-dirt-edit:
    post:
      operationId: undoLastDirtEdit
      summary: Undo the newest successful Dirt MCP edit in a loaded world
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UndoLastDirtEditRequest'
      responses:
        '200':
          description: Completed undo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UndoLastDirtEditResponse'
        '400':
          description: Invalid JSON or fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '409':
          description: No undo is available or another Dirt MCP edit is active in this world
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected undo failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Undo was interrupted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/run-minecraft-commands:
    post:
      operationId: runMinecraftCommands
      summary: Run registered Minecraft commands sequentially with operator-level permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunMinecraftCommandsRequest'
      responses:
        '200':
          description: Ordered dispatch outcomes and bounded synchronous command feedback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunMinecraftCommandsResponse'
        '400':
          description: Invalid JSON, fields, command strings, or command count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '500':
          description: Unexpected command-runner failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Paper command execution is unavailable or was interrupted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  responses:
    InternalError:
      description: Unexpected internal failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid bearer token
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer realm="dirt-mcp"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GetMethodNotAllowed:
      description: Method not allowed
      headers:
        Allow:
          schema:
            const: GET
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PostMethodNotAllowed:
      description: Method not allowed
      headers:
        Allow:
          schema:
            const: POST
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - bridge_busy
                - internal_error
                - invalid_request
                - method_not_allowed
                - change_limit_exceeded
                - not_found
                - nothing_to_undo
                - region_too_large
                - result_too_large
                - server_unavailable
                - unauthorized
                - unhealthy
                - world_busy
                - world_not_found
                - world_unavailable
            message:
              type: string
    BlockPosition:
      type: object
      additionalProperties: false
      required:
        - x
        - y
        - z
      properties:
        x:
          type: integer
          format: int32
        y:
          type: integer
          format: int32
        z:
          type: integer
          format: int32
    Bounds:
      type: object
      additionalProperties: false
      required:
        - min
        - max
      properties:
        min:
          $ref: '#/components/schemas/BlockPosition'
        max:
          $ref: '#/components/schemas/BlockPosition'
    Dimensions:
      type: object
      additionalProperties: false
      required:
        - x
        - y
        - z
      properties:
        x:
          type: integer
          format: int64
          minimum: 1
        y:
          type: integer
          format: int64
          minimum: 1
        z:
          type: integer
          format: int64
          minimum: 1
    CountRegionBlockStatesRequest:
      type: object
      additionalProperties: false
      required:
        - world
        - min
        - max
      properties:
        world:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        min:
          $ref: '#/components/schemas/BlockPosition'
        max:
          $ref: '#/components/schemas/BlockPosition'
    CountRegionBlockStatesResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - bounds
        - dimensions
        - volume
        - blockStateCounts
      properties:
        world:
          type: string
          minLength: 1
        bounds:
          $ref: '#/components/schemas/Bounds'
        dimensions:
          $ref: '#/components/schemas/Dimensions'
        volume:
          type: integer
          format: int64
          minimum: 1
        blockStateCounts:
          type: object
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
    GetRegionBlocksRequest:
      type: object
      additionalProperties: false
      required:
        - world
        - min
        - max
      properties:
        world:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        min:
          $ref: '#/components/schemas/BlockPosition'
        max:
          $ref: '#/components/schemas/BlockPosition'
        includeBlockStatePatterns:
          type: array
          maxItems: 64
          description: Block-state patterns to include; include and exclude lists are limited to 64 entries combined.
          items:
            type: string
            minLength: 1
            pattern: '.*\S.*'
        excludeBlockStatePatterns:
          type: array
          maxItems: 64
          description: Block-state patterns to exclude after include filtering; both lists are limited to 64 entries combined.
          items:
            type: string
            minLength: 1
            pattern: '.*\S.*'
        includeAir:
          type: boolean
          description: Include air-family states; omission uses the configured default.
        maxResults:
          type: integer
          format: int32
          minimum: 1
          description: Requested result cap; it cannot exceed the configured maximum.
        format:
          type: string
          enum:
            - blocks
            - runs
          description: Omission uses the configured region-blocks format.
    RegionBlock:
      type: object
      additionalProperties: false
      required:
        - position
        - blockState
      properties:
        position:
          $ref: '#/components/schemas/BlockPosition'
        blockState:
          type: string
          minLength: 1
    BlockRun:
      type: object
      additionalProperties: false
      required:
        - blockState
        - from
        - to
      properties:
        blockState:
          type: string
          minLength: 1
        from:
          description: Inclusive first position of the axis-aligned run.
          $ref: '#/components/schemas/BlockPosition'
        to:
          description: Inclusive last position of the axis-aligned run.
          $ref: '#/components/schemas/BlockPosition'
    GetRegionBlocksResponse:
      oneOf:
        - $ref: '#/components/schemas/GetRegionBlocksListResponse'
        - $ref: '#/components/schemas/GetRegionBlockRunsResponse'
      discriminator:
        propertyName: format
        mapping:
          blocks: '#/components/schemas/GetRegionBlocksListResponse'
          runs: '#/components/schemas/GetRegionBlockRunsResponse'
    GetRegionBlocksListResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - bounds
        - volume
        - matchedBlockCount
        - format
        - blocks
      properties:
        world:
          type: string
          minLength: 1
        bounds:
          $ref: '#/components/schemas/Bounds'
        volume:
          type: integer
          format: int64
          minimum: 1
        matchedBlockCount:
          type: integer
          format: int64
          minimum: 0
        format:
          const: blocks
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/RegionBlock'
    GetRegionBlockRunsResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - bounds
        - volume
        - matchedBlockCount
        - format
        - runs
      properties:
        world:
          type: string
          minLength: 1
        bounds:
          $ref: '#/components/schemas/Bounds'
        volume:
          type: integer
          format: int64
          minimum: 1
        matchedBlockCount:
          type: integer
          format: int64
          minimum: 0
        format:
          const: runs
        runs:
          type: array
          items:
            $ref: '#/components/schemas/BlockRun'
    ScanOrthographicViewRequest:
      type: object
      additionalProperties: false
      required:
        - world
        - origin
        - direction
        - horizontalRadius
        - verticalRadius
        - maxDistance
      properties:
        world:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        origin:
          description: Center anchor of the orthographic view; scanning starts one block forward.
          $ref: '#/components/schemas/BlockPosition'
        direction:
          type: string
          description: World-axis direction; north is -Z, east is +X, south is +Z, west is -X, up is +Y, and down is -Y.
          enum:
            - north
            - east
            - south
            - west
            - up
            - down
        horizontalRadius:
          type: integer
          format: int32
          minimum: 0
          description: Viewport cells on each side of the center sightline along the response's horizontal basis.
        verticalRadius:
          type: integer
          format: int32
          minimum: 0
          description: Viewport cells on each side of the center sightline along the response's vertical basis.
        maxDistance:
          type: integer
          format: int32
          minimum: 1
          description: Blocks scanned forward from the origin; distance 1 is adjacent.
        maxResults:
          type: integer
          format: int32
          minimum: 1
          description: Requested visible-block cap; omission and maximum use plugin configuration.
    AxisVector:
      type: object
      additionalProperties: false
      required:
        - x
        - y
        - z
      properties:
        x:
          type: integer
          format: int32
          minimum: -1
          maximum: 1
        y:
          type: integer
          format: int32
          minimum: -1
          maximum: 1
        z:
          type: integer
          format: int32
          minimum: -1
          maximum: 1
    ViewBasis:
      type: object
      additionalProperties: false
      description: World-axis unit vectors used to convert view-relative offsets to block positions.
      required:
        - forward
        - horizontal
        - vertical
      properties:
        forward:
          $ref: '#/components/schemas/AxisVector'
        horizontal:
          $ref: '#/components/schemas/AxisVector'
        vertical:
          $ref: '#/components/schemas/AxisVector'
    Viewport:
      type: object
      additionalProperties: false
      required:
        - horizontalRadius
        - verticalRadius
        - maxDistance
      properties:
        horizontalRadius:
          type: integer
          format: int32
          minimum: 0
        verticalRadius:
          type: integer
          format: int32
          minimum: 0
        maxDistance:
          type: integer
          format: int32
          minimum: 1
    ViewOffset:
      type: object
      additionalProperties: false
      required:
        - horizontal
        - vertical
        - distance
      properties:
        horizontal:
          type: integer
          format: int32
          description: Signed displacement along the view's horizontal basis.
        vertical:
          type: integer
          format: int32
          description: Signed displacement along the view's vertical basis.
        distance:
          type: integer
          format: int32
          minimum: 1
          description: Positive displacement along the forward basis; 1 is adjacent to the origin.
    OrthographicViewBlock:
      type: object
      additionalProperties: false
      required:
        - position
        - offset
        - blockState
      properties:
        position:
          $ref: '#/components/schemas/BlockPosition'
        offset:
          $ref: '#/components/schemas/ViewOffset'
        blockState:
          type: string
          minLength: 1
    ScanOrthographicViewResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - origin
        - direction
        - basis
        - viewport
        - bounds
        - scannedVolume
        - visibleBlockCount
        - format
        - blocks
      properties:
        world:
          type: string
          minLength: 1
        origin:
          $ref: '#/components/schemas/BlockPosition'
        direction:
          type: string
          enum:
            - north
            - east
            - south
            - west
            - up
            - down
        basis:
          $ref: '#/components/schemas/ViewBasis'
        viewport:
          $ref: '#/components/schemas/Viewport'
        bounds:
          $ref: '#/components/schemas/Bounds'
        scannedVolume:
          type: integer
          format: int64
          minimum: 1
        visibleBlockCount:
          type: integer
          format: int64
          minimum: 0
        format:
          const: blocks
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/OrthographicViewBlock'
    DestinationPaletteEntry:
      type: object
      additionalProperties: false
      required:
        - blockState
      properties:
        blockState:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Exact canonical block state to place.
        weight:
          type: integer
          minimum: 1
          maximum: 100
          description: Whole-number percentage supplied for every entry or omitted from every entry.
    ReplaceRegionBlocksRequest:
      type: object
      additionalProperties: false
      required:
        - world
        - min
        - max
        - sourceBlockStatePatterns
        - destinationPalette
      properties:
        world:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        min:
          $ref: '#/components/schemas/BlockPosition'
        max:
          $ref: '#/components/schemas/BlockPosition'
        sourceBlockStatePatterns:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          description: ORed block-state patterns; omitted properties match any value.
          items:
            type: string
            minLength: 1
            pattern: '.*\S.*'
        destinationPalette:
          type: array
          minItems: 1
          maxItems: 64
          description: Exact destination states; weights are all omitted for equal probability or all total 100.
          items:
            $ref: '#/components/schemas/DestinationPaletteEntry'
        seed:
          type: integer
          format: int32
          description: Omission generates a fresh seed returned in the response.
        dryRun:
          type: boolean
          description: Omission uses the configured replace default.
    ReplaceRegionBlocksResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - bounds
        - sourceBlockStatePatterns
        - destinationPalette
        - seed
        - dryRun
        - matchedBlockCount
        - changedBlockCount
      properties:
        world:
          type: string
          minLength: 1
        bounds:
          $ref: '#/components/schemas/Bounds'
        sourceBlockStatePatterns:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 1
            pattern: '.*\S.*'
        destinationPalette:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/DestinationPaletteEntry'
        seed:
          type: integer
          format: int32
        dryRun:
          type: boolean
        matchedBlockCount:
          type: integer
          format: int64
          minimum: 0
        changedBlockCount:
          type: integer
          format: int64
          minimum: 0
    FillRegionRequest:
      type: object
      additionalProperties: false
      required:
        - world
        - min
        - max
        - destinationPalette
      properties:
        world:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        min:
          $ref: '#/components/schemas/BlockPosition'
        max:
          $ref: '#/components/schemas/BlockPosition'
        destinationPalette:
          type: array
          minItems: 1
          maxItems: 64
          description: Exact destination states; weights are all omitted for equal probability or all total 100.
          items:
            $ref: '#/components/schemas/DestinationPaletteEntry'
        seed:
          type: integer
          format: int32
          description: Omission generates a fresh seed returned in the response.
        dryRun:
          type: boolean
          description: Omission uses the configured fill default.
    FillRegionResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - bounds
        - destinationPalette
        - seed
        - dryRun
        - volume
        - changedBlockCount
      properties:
        world:
          type: string
          minLength: 1
        bounds:
          $ref: '#/components/schemas/Bounds'
        destinationPalette:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/DestinationPaletteEntry'
        seed:
          type: integer
          format: int32
        dryRun:
          type: boolean
        volume:
          type: integer
          format: int64
          minimum: 1
        changedBlockCount:
          type: integer
          format: int64
          minimum: 0
    BlockOffset:
      type: array
      minItems: 3
      maxItems: 3
      description: Signed [x, y, z] offset from the request origin.
      items:
        type: integer
        format: int32
    PalettePlacement:
      type: object
      additionalProperties: false
      required:
        - paletteIndex
        - offsets
      properties:
        paletteIndex:
          type: integer
          format: int32
          minimum: 0
          description: Zero-based index into the request palette.
        offsets:
          type: array
          minItems: 1
          description: Origin-relative block positions that receive this palette state.
          items:
            $ref: '#/components/schemas/BlockOffset'
    SetBlocksRequest:
      type: object
      additionalProperties: false
      required:
        - world
        - origin
        - palette
        - placements
      properties:
        world:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        origin:
          $ref: '#/components/schemas/BlockPosition'
        palette:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          description: Exact block states referenced by zero-based index from placements.
          items:
            type: string
            minLength: 1
            pattern: '.*\S.*'
        placements:
          type: array
          minItems: 1
          description: Palette-indexed groups of origin-relative offsets; resolved positions must be distinct.
          items:
            $ref: '#/components/schemas/PalettePlacement'
        dryRun:
          type: boolean
          description: Omission uses the configured set-blocks default.
    SetBlocksResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - dryRun
        - blockCount
        - changedBlockCount
        - unchangedBlockCount
      properties:
        world:
          type: string
          minLength: 1
        dryRun:
          type: boolean
        blockCount:
          type: integer
          format: int64
          minimum: 1
        changedBlockCount:
          type: integer
          format: int64
          minimum: 0
        unchangedBlockCount:
          type: integer
          format: int64
          minimum: 0
    UndoLastDirtEditRequest:
      type: object
      additionalProperties: false
      required:
        - world
      properties:
        world:
          type: string
          minLength: 1
          pattern: '.*\S.*'
    UndoLastDirtEditResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - changedBlockCount
      properties:
        world:
          type: string
          minLength: 1
        changedBlockCount:
          type: integer
          format: int64
          minimum: 1
    RunMinecraftCommandsRequest:
      type: object
      additionalProperties: false
      required:
        - commands
      properties:
        commands:
          type: array
          minItems: 1
          description: Commands in execution order. Each may include one in-game leading slash.
          items:
            type: string
            minLength: 1
            pattern: '.*\S.*'
    CommandSender:
      type: object
      additionalProperties: false
      required:
        - name
        - isOperator
        - isPlayer
      properties:
        name:
          type: string
          minLength: 1
        isOperator:
          const: true
        isPlayer:
          const: false
    CommandResult:
      type: object
      additionalProperties: false
      required:
        - command
        - outcome
        - feedback
        - message
        - rawMessage
      properties:
        command:
          type: string
          minLength: 1
          description: Normalized command passed to Paper without the in-game leading slash.
        outcome:
          type: string
          enum:
            - dispatched
            - not_found
            - dispatch_failed
        feedback:
          type: array
          description: Plain-text feedback emitted synchronously while dispatching this command.
          items:
            type: string
        message:
          type:
            - string
            - 'null'
          description: Actionable underlying failure explanation, otherwise null.
        rawMessage:
          type:
            - string
            - 'null'
          description: Original Paper CommandException message for dispatch failures, otherwise null.
    RunMinecraftCommandsResponse:
      type: object
      additionalProperties: false
      required:
        - sender
        - feedbackTruncated
        - results
      properties:
        sender:
          $ref: '#/components/schemas/CommandSender'
        feedbackTruncated:
          type: boolean
          description: Whether feedback exceeded the configured request-wide character limit.
        results:
          type: array
          minItems: 1
          description: One result per supplied command; every command is attempted once in the original order.
          items:
            $ref: '#/components/schemas/CommandResult'
    LimitConfiguration:
      type: object
      additionalProperties: false
      required:
        - maxRequestBytes
        - maxRegionVolume
        - maxTouchedChunks
        - maxInspectionTouchedChunks
        - maxBlockStatePatterns
        - maxChangedBlocks
        - maxInspectionVolume
        - defaultInspectionResultLimit
        - maxInspectionResultLimit
        - maxCommandsPerRequest
        - maxCommandFeedbackCharacters
        - undoHistoryPerWorld
      properties:
        maxRequestBytes:
          type: integer
          format: int32
          minimum: 1
          description: Maximum JSON request-body size accepted by the bridge.
        maxRegionVolume:
          type: integer
          format: int32
          minimum: 1
          description: Maximum cuboid mutation/count volume or resolved offsets in set_blocks.
        maxTouchedChunks:
          type: integer
          format: int32
          minimum: 1
          description: Maximum distinct loaded chunks one mutation may touch.
        maxInspectionTouchedChunks:
          type: integer
          format: int32
          minimum: 1
          description: Maximum distinct loaded chunks one inspection may snapshot.
        maxBlockStatePatterns:
          type: integer
          format: int32
          minimum: 1
          description: Maximum block-state patterns or palette entries in one operation; inspection include and exclude lists share this cap.
        maxChangedBlocks:
          type: integer
          format: int32
          minimum: 1
          description: Maximum blocks one mutation may change.
        maxInspectionVolume:
          type: integer
          format: int32
          minimum: 1
          description: Maximum blocks scanned by exact block retrieval or an orthographic view.
        defaultInspectionResultLimit:
          type: integer
          format: int32
          minimum: 1
          description: Default exact-block, run, or visible-block result limit.
        maxInspectionResultLimit:
          type: integer
          format: int32
          minimum: 1
          description: Maximum caller-selectable exact-block, run, or visible-block result limit.
        maxCommandsPerRequest:
          type: integer
          format: int32
          minimum: 1
        maxCommandFeedbackCharacters:
          type: integer
          format: int32
          minimum: 1
        undoHistoryPerWorld:
          type: integer
          format: int32
          minimum: 0
    DefaultConfiguration:
      type: object
      additionalProperties: false
      required:
        - regionBlocksIncludeAir
        - regionBlocksFormat
        - editDryRun
      properties:
        regionBlocksIncludeAir:
          type: boolean
        regionBlocksFormat:
          type: string
          enum:
            - blocks
            - runs
        editDryRun:
          type: boolean
          description: Default dry-run behavior for every Dirt block-edit tool.
    PingResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          const: ok
    ServerBuilds:
      type: object
      additionalProperties: false
      required:
        - minecraft
        - paper
        - dirtMcp
        - fawe
      properties:
        minecraft:
          type: string
          minLength: 1
        paper:
          type: string
          minLength: 1
        dirtMcp:
          type: string
          minLength: 1
        fawe:
          type: string
          minLength: 1
    ServerPerformance:
      type: object
      additionalProperties: false
      required:
        - tpsOneMinute
        - averageTickTimeMillis
      properties:
        tpsOneMinute:
          type: number
          format: double
          minimum: 0
        averageTickTimeMillis:
          type: number
          format: double
          minimum: 0
    OnlinePlayer:
      type: object
      additionalProperties: false
      required:
        - name
        - world
        - gameMode
        - facing
        - blockPosition
      properties:
        name:
          type: string
          minLength: 1
        world:
          type: string
          minLength: 1
        gameMode:
          type: string
          enum:
            - survival
            - creative
            - adventure
            - spectator
        facing:
          type: string
          description: Current horizontal cardinal direction the player is facing.
          enum:
            - north
            - east
            - south
            - west
        blockPosition:
          $ref: '#/components/schemas/BlockPosition'
    PlayerSummary:
      type: object
      additionalProperties: false
      required:
        - online
        - maximum
