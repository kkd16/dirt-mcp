openapi: 3.2.0
info:
  title: Dirt MCP Paper Bridge
  version: 0.1.0
  description: Local contract between the Dirt MCP stdio server and Paper plugin.
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:8765
    description: Default loopback development endpoint
security:
  - bearerAuth: []
paths:
  /v1/ping:
    get:
      operationId: pingServer
      summary: Verify the authenticated Dirt-to-Paper-to-FAWE path without mutation
      responses:
        '200':
          description: Every Dirt MCP runtime layer is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/GetMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Dirt, Paper, or FAWE is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/server-status:
    get:
      operationId: getServerStatus
      summary: Report current server, player, world, build, and tool-limit context
      responses:
        '200':
          description: Lightweight current server context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/GetMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Current Paper context is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/count-region-block-states:
    post:
      operationId: countRegionBlockStates
      summary: Count block states in a bounded region of loaded chunks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountRegionBlockStatesRequest'
      responses:
        '200':
          description: Region inspection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountRegionBlockStatesResponse'
        '400':
          description: Invalid JSON, fields, coordinates, or world height
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '413':
          description: Normalized region exceeds the configured volume limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected inspection failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Region contains an unloaded chunk or inspection was interrupted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/get-region-blocks:
    post:
      operationId: getRegionBlocks
      summary: Return exact filtered block geometry from a bounded region of loaded chunks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetRegionBlocksRequest'
      responses:
        '200':
          description: Exact sparse blocks or deterministic axis-aligned runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRegionBlocksResponse'
        '400':
          description: Invalid JSON, fields, coordinates, filters, options, or world height
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '413':
          description: Region volume or exact result exceeds its limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected inspection failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Region contains an unloaded chunk or inspection was interrupted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/scan-orthographic-view:
    post:
      operationId: scanOrthographicView
      summary: Return the first non-air block along each sightline in an orthographic view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanOrthographicViewRequest'
      responses:
        '200':
          description: Exact sparse visible block layer and its world-aligned view basis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanOrthographicViewResponse'
        '400':
          description: Invalid JSON, fields, coordinates, view geometry, or world height
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '413':
          description: View scan volume or exact result exceeds its limit; scan-volume messages report requested and maximum volumes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected inspection failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: View contains an unloaded chunk or inspection was interrupted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/replace-region-blocks:
    post:
      operationId: replaceRegionBlocks
      summary: Replace one exact block state in a bounded region of loaded chunks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceRegionBlocksRequest'
      responses:
        '200':
          description: Executed edit or exact dry-run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceRegionBlocksResponse'
        '400':
          description: Invalid JSON, fields, coordinates, world height, or block state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '409':
          description: Another Dirt MCP edit is active in this world
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Region volume or estimated changed-block count exceeds its configured limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected edit failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Region contains an unloaded chunk or editing was interrupted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/fill-region:
    post:
      operationId: fillRegion
      summary: Fill a bounded region of loaded chunks with one block state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FillRegionRequest'
      responses:
        '200':
          description: Executed edit or exact dry-run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FillRegionResponse'
        '400':
          description: Invalid JSON, fields, coordinates, world height, or block state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '409':
          description: Another Dirt MCP edit is active in this world
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Region volume or estimated changed-block count exceeds its configured limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected edit failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Region contains an unloaded chunk or editing was interrupted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/undo-last-dirt-edit:
    post:
      operationId: undoLastDirtEdit
      summary: Undo the newest successful Dirt MCP edit in a loaded world
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UndoLastDirtEditRequest'
      responses:
        '200':
          description: Completed undo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UndoLastDirtEditResponse'
        '400':
          description: Invalid JSON or fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '409':
          description: No undo is available or another Dirt MCP edit is active in this world
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected undo failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Undo was interrupted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer realm="dirt-mcp"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GetMethodNotAllowed:
      description: Method not allowed
      headers:
        Allow:
          schema:
            const: GET
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PostMethodNotAllowed:
      description: Method not allowed
      headers:
        Allow:
          schema:
            const: POST
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - internal_error
                - invalid_request
                - method_not_allowed
                - change_limit_exceeded
                - nothing_to_undo
                - region_too_large
                - result_too_large
                - unauthorized
                - world_busy
                - world_not_found
                - world_unavailable
            message:
              type: string
    BlockPosition:
      type: object
      additionalProperties: false
      required:
        - x
        - y
        - z
      properties:
        x:
          type: integer
          format: int32
        y:
          type: integer
          format: int32
        z:
          type: integer
          format: int32
    Bounds:
      type: object
      additionalProperties: false
      required:
        - min
        - max
      properties:
        min:
          $ref: '#/components/schemas/BlockPosition'
        max:
          $ref: '#/components/schemas/BlockPosition'
    Dimensions:
      type: object
      additionalProperties: false
      required:
        - x
        - y
        - z
      properties:
        x:
          type: integer
          format: int64
          minimum: 1
        y:
          type: integer
          format: int64
          minimum: 1
        z:
          type: integer
          format: int64
          minimum: 1
    CountRegionBlockStatesRequest:
      type: object
      additionalProperties: false
      required:
        - world
        - min
        - max
      properties:
        world:
          type: string
          minLength: 1
        min:
          $ref: '#/components/schemas/BlockPosition'
        max:
          $ref: '#/components/schemas/BlockPosition'
    CountRegionBlockStatesResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - bounds
        - dimensions
        - volume
        - blockStateCounts
      properties:
        world:
          type: string
          minLength: 1
        bounds:
          $ref: '#/components/schemas/Bounds'
        dimensions:
          $ref: '#/components/schemas/Dimensions'
        volume:
          type: integer
          format: int64
          minimum: 1
        blockStateCounts:
          type: object
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
    GetRegionBlocksRequest:
      type: object
      additionalProperties: false
      required:
        - world
        - min
        - max
      properties:
        world:
          type: string
          minLength: 1
        min:
          $ref: '#/components/schemas/BlockPosition'
        max:
          $ref: '#/components/schemas/BlockPosition'
        includeBlockStatePatterns:
          type: array
          description: Block-state patterns to include; omitted properties match any value.
          items:
            type: string
            minLength: 1
        excludeBlockStatePatterns:
          type: array
          description: Block-state patterns to exclude after include filtering.
          items:
            type: string
            minLength: 1
        includeAir:
          type: boolean
          description: Include air-family states; omission uses the configured default.
        maxResults:
          type: integer
          format: int32
          minimum: 1
          description: Requested result cap; it cannot exceed the configured maximum.
        format:
          type: string
          enum:
            - blocks
            - runs
          description: Omission uses the configured region-blocks format.
    RegionBlock:
      type: object
      additionalProperties: false
      required:
        - position
        - blockState
      properties:
        position:
          $ref: '#/components/schemas/BlockPosition'
        blockState:
          type: string
          minLength: 1
    BlockRun:
      type: object
      additionalProperties: false
      required:
        - blockState
        - from
        - to
      properties:
        blockState:
          type: string
          minLength: 1
        from:
          description: Inclusive first position of the axis-aligned run.
          $ref: '#/components/schemas/BlockPosition'
        to:
          description: Inclusive last position of the axis-aligned run.
          $ref: '#/components/schemas/BlockPosition'
    GetRegionBlocksResponse:
      oneOf:
        - $ref: '#/components/schemas/GetRegionBlocksListResponse'
        - $ref: '#/components/schemas/GetRegionBlockRunsResponse'
      discriminator:
        propertyName: format
        mapping:
          blocks: '#/components/schemas/GetRegionBlocksListResponse'
          runs: '#/components/schemas/GetRegionBlockRunsResponse'
    GetRegionBlocksListResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - bounds
        - volume
        - matchedBlockCount
        - format
        - blocks
      properties:
        world:
          type: string
          minLength: 1
        bounds:
          $ref: '#/components/schemas/Bounds'
        volume:
          type: integer
          format: int64
          minimum: 1
        matchedBlockCount:
          type: integer
          format: int64
          minimum: 0
        format:
          const: blocks
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/RegionBlock'
    GetRegionBlockRunsResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - bounds
        - volume
        - matchedBlockCount
        - format
        - runs
      properties:
        world:
          type: string
          minLength: 1
        bounds:
          $ref: '#/components/schemas/Bounds'
        volume:
          type: integer
          format: int64
          minimum: 1
        matchedBlockCount:
          type: integer
          format: int64
          minimum: 0
        format:
          const: runs
        runs:
          type: array
          items:
            $ref: '#/components/schemas/BlockRun'
    ScanOrthographicViewRequest:
      type: object
      additionalProperties: false
      required:
        - world
        - origin
        - direction
        - horizontalRadius
        - verticalRadius
        - maxDistance
      properties:
        world:
          type: string
          minLength: 1
        origin:
          description: Center anchor of the orthographic view; scanning starts one block forward.
          $ref: '#/components/schemas/BlockPosition'
        direction:
          type: string
          description: World-axis direction; north is -Z, east is +X, south is +Z, west is -X, up is +Y, and down is -Y.
          enum:
            - north
            - east
            - south
            - west
            - up
            - down
        horizontalRadius:
          type: integer
          format: int32
          minimum: 0
          description: Viewport cells on each side of the center sightline along the response's horizontal basis.
        verticalRadius:
          type: integer
          format: int32
          minimum: 0
          description: Viewport cells on each side of the center sightline along the response's vertical basis.
        maxDistance:
          type: integer
          format: int32
          minimum: 1
          description: Blocks scanned forward from the origin; distance 1 is adjacent.
        maxResults:
          type: integer
          format: int32
          minimum: 1
          description: Requested visible-block cap; omission and maximum use plugin configuration.
    AxisVector:
      type: object
      additionalProperties: false
      required:
        - x
        - y
        - z
      properties:
        x:
          type: integer
          format: int32
          minimum: -1
          maximum: 1
        y:
          type: integer
          format: int32
          minimum: -1
          maximum: 1
        z:
          type: integer
          format: int32
          minimum: -1
          maximum: 1
    ViewBasis:
      type: object
      additionalProperties: false
      description: World-axis unit vectors used to convert view-relative offsets to block positions.
      required:
        - forward
        - horizontal
        - vertical
      properties:
        forward:
          $ref: '#/components/schemas/AxisVector'
        horizontal:
          $ref: '#/components/schemas/AxisVector'
        vertical:
          $ref: '#/components/schemas/AxisVector'
    Viewport:
      type: object
      additionalProperties: false
      required:
        - horizontalRadius
        - verticalRadius
        - maxDistance
      properties:
        horizontalRadius:
          type: integer
          format: int32
          minimum: 0
        verticalRadius:
          type: integer
          format: int32
          minimum: 0
        maxDistance:
          type: integer
          format: int32
          minimum: 1
    ViewOffset:
      type: object
      additionalProperties: false
      required:
        - horizontal
        - vertical
        - distance
      properties:
        horizontal:
          type: integer
          format: int32
          description: Signed displacement along the view's horizontal basis.
        vertical:
          type: integer
          format: int32
          description: Signed displacement along the view's vertical basis.
        distance:
          type: integer
          format: int32
          minimum: 1
          description: Positive displacement along the forward basis; 1 is adjacent to the origin.
    OrthographicViewBlock:
      type: object
      additionalProperties: false
      required:
        - position
        - offset
        - blockState
      properties:
        position:
          $ref: '#/components/schemas/BlockPosition'
        offset:
          $ref: '#/components/schemas/ViewOffset'
        blockState:
          type: string
          minLength: 1
    ScanOrthographicViewResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - origin
        - direction
        - basis
        - viewport
        - bounds
        - scannedVolume
        - visibleBlockCount
        - format
        - blocks
      properties:
        world:
          type: string
          minLength: 1
        origin:
          $ref: '#/components/schemas/BlockPosition'
        direction:
          type: string
          enum:
            - north
            - east
            - south
            - west
            - up
            - down
        basis:
          $ref: '#/components/schemas/ViewBasis'
        viewport:
          $ref: '#/components/schemas/Viewport'
        bounds:
          $ref: '#/components/schemas/Bounds'
        scannedVolume:
          type: integer
          format: int64
          minimum: 1
        visibleBlockCount:
          type: integer
          format: int64
          minimum: 0
        format:
          const: blocks
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/OrthographicViewBlock'
    ReplaceRegionBlocksRequest:
      type: object
      additionalProperties: false
      required:
        - world
        - min
        - max
        - sourceBlockState
        - destinationBlockState
      properties:
        world:
          type: string
          minLength: 1
        min:
          $ref: '#/components/schemas/BlockPosition'
        max:
          $ref: '#/components/schemas/BlockPosition'
        sourceBlockState:
          type: string
          minLength: 1
        destinationBlockState:
          type: string
          minLength: 1
        dryRun:
          type: boolean
          description: Omission uses the configured replace default.
    ReplaceRegionBlocksResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - bounds
        - sourceBlockState
        - destinationBlockState
        - dryRun
        - matchedBlockCount
        - changedBlockCount
      properties:
        world:
          type: string
          minLength: 1
        bounds:
          $ref: '#/components/schemas/Bounds'
        sourceBlockState:
          type: string
          minLength: 1
        destinationBlockState:
          type: string
          minLength: 1
        dryRun:
          type: boolean
        matchedBlockCount:
          type: integer
          format: int64
          minimum: 0
        changedBlockCount:
          type: integer
          format: int64
          minimum: 0
    FillRegionRequest:
      type: object
      additionalProperties: false
      required:
        - world
        - min
        - max
        - blockState
      properties:
        world:
          type: string
          minLength: 1
        min:
          $ref: '#/components/schemas/BlockPosition'
        max:
          $ref: '#/components/schemas/BlockPosition'
        blockState:
          type: string
          minLength: 1
        dryRun:
          type: boolean
          description: Omission uses the configured fill default.
    FillRegionResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - bounds
        - blockState
        - dryRun
        - volume
        - changedBlockCount
      properties:
        world:
          type: string
          minLength: 1
        bounds:
          $ref: '#/components/schemas/Bounds'
        blockState:
          type: string
          minLength: 1
        dryRun:
          type: boolean
        volume:
          type: integer
          format: int64
          minimum: 1
        changedBlockCount:
          type: integer
          format: int64
          minimum: 0
    UndoLastDirtEditRequest:
      type: object
      additionalProperties: false
      required:
        - world
      properties:
        world:
          type: string
          minLength: 1
    UndoLastDirtEditResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - changedBlockCount
      properties:
        world:
          type: string
          minLength: 1
        changedBlockCount:
          type: integer
          format: int64
          minimum: 1
    LimitConfiguration:
      type: object
      additionalProperties: false
      required:
        - maxRegionVolume
        - maxChangedBlocks
        - maxRegionBlocksVolume
        - defaultRegionBlocksResultLimit
        - maxRegionBlocksResultLimit
        - maxOrthographicViewVolume
        - defaultOrthographicViewResultLimit
        - maxOrthographicViewResultLimit
        - undoHistoryPerWorld
      properties:
        maxRegionVolume:
          type: integer
          format: int32
          minimum: 1
        maxChangedBlocks:
          type: integer
          format: int32
          minimum: 1
        maxRegionBlocksVolume:
          type: integer
          format: int32
          minimum: 1
        defaultRegionBlocksResultLimit:
          type: integer
          format: int32
          minimum: 1
        maxRegionBlocksResultLimit:
          type: integer
          format: int32
          minimum: 1
        maxOrthographicViewVolume:
          type: integer
          format: int32
          minimum: 1
        defaultOrthographicViewResultLimit:
          type: integer
          format: int32
          minimum: 1
        maxOrthographicViewResultLimit:
          type: integer
          format: int32
          minimum: 1
        undoHistoryPerWorld:
          type: integer
          format: int32
          minimum: 0
    DefaultConfiguration:
      type: object
      additionalProperties: false
      required:
        - regionBlocksIncludeAir
        - regionBlocksFormat
        - replaceRegionBlocksDryRun
        - fillRegionDryRun
      properties:
        regionBlocksIncludeAir:
          type: boolean
        regionBlocksFormat:
          type: string
          enum:
            - blocks
            - runs
        replaceRegionBlocksDryRun:
          type: boolean
        fillRegionDryRun:
          type: boolean
    PingResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          const: ok
    ServerBuilds:
      type: object
      additionalProperties: false
      required:
        - minecraft
        - paper
        - dirtMcp
        - fawe
      properties:
        minecraft:
          type: string
          minLength: 1
        paper:
          type: string
          minLength: 1
        dirtMcp:
          type: string
          minLength: 1
        fawe:
          type: string
          minLength: 1
    ServerPerformance:
      type: object
      additionalProperties: false
      required:
        - tpsOneMinute
        - averageTickTimeMillis
      properties:
        tpsOneMinute:
          type: number
          format: double
          minimum: 0
        averageTickTimeMillis:
          type: number
          format: double
          minimum: 0
    OnlinePlayer:
      type: object
      additionalProperties: false
      required:
        - name
        - world
        - gameMode
        - blockPosition
      properties:
        name:
          type: string
          minLength: 1
        world:
          type: string
          minLength: 1
        gameMode:
          type: string
          enum:
            - survival
            - creative
            - adventure
            - spectator
        blockPosition:
          $ref: '#/components/schemas/BlockPosition'
    PlayerSummary:
      type: object
      additionalProperties: false
      required:
        - online
        - maximum
        - entries
      properties:
        online:
          type: integer
          format: int32
          minimum: 0
        maximum:
          type: integer
          format: int32
          minimum: 0
        entries:
          type: array
          items:
            $ref: '#/components/schemas/OnlinePlayer'
    WorldStatus:
      type: object
      additionalProperties: false
      required:
        - name
        - environment
        - minY
        - maxY
        - spawn
        - timeOfDay
        - storm
        - thundering
        - playerCount
      properties:
        name:
          type: string
          minLength: 1
        environment:
          type: string
          minLength: 1
        minY:
          type: integer
          format: int32
        maxY:
          type: integer
          format: int32
        spawn:
          $ref: '#/components/schemas/BlockPosition'
        timeOfDay:
          type: integer
          format: int64
          minimum: 0
          maximum: 23999
        storm:
          type: boolean
        thundering:
          type: boolean
        playerCount:
          type: integer
          format: int32
          minimum: 0
    ServerStatusResponse:
      type: object
      additionalProperties: false
      required:
        - builds
        - performance
        - players
        - worlds
        - limits
        - defaults
      properties:
        builds:
          $ref: '#/components/schemas/ServerBuilds'
        performance:
          $ref: '#/components/schemas/ServerPerformance'
        players:
          $ref: '#/components/schemas/PlayerSummary'
        worlds:
          type: array
          items:
            $ref: '#/components/schemas/WorldStatus'
        limits:
          $ref: '#/components/schemas/LimitConfiguration'
        defaults:
          $ref: '#/components/schemas/DefaultConfiguration'
