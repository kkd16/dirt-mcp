      additionalProperties: false
      required:
        - player
      properties:
        player:
          $ref: '#/components/schemas/PlayerSelector'
        include:
          allOf:
            - $ref: '#/components/schemas/PlayerContextIncludeOptions'
          default:
            equipment: true
            inventory: false
            enderChest: false
            vitals: false
            movement: false
            client: false
            effects: false
    ExactPosition:
      type: object
      additionalProperties: false
      required:
        - x
        - y
        - z
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        z:
          type: number
          format: double
    PlayerIdentity:
      type: object
      additionalProperties: false
      required:
        - name
        - uuid
      properties:
        name:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        uuid:
          type: string
          pattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
    Rotation:
      type: object
      additionalProperties: false
      required:
        - yaw
        - pitch
      properties:
        yaw:
          type: number
          format: double
          description: Paper yaw in degrees.
        pitch:
          type: number
          format: double
    PerspectiveInputRotation:
      type: object
      additionalProperties: false
      required:
        - yaw
        - pitch
      properties:
        yaw:
          type: number
          format: double
          description: Paper yaw in degrees; the resolved response yaw is normalized to [-180, 180).
        pitch:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Paper pitch in degrees; positive values look downward.
    PerspectivePlayerSource:
      type: object
      additionalProperties: false
      required:
        - type
        - player
      properties:
        type:
          const: player
        player:
          $ref: '#/components/schemas/PlayerSelector'
    PerspectiveLocationSource:
      type: object
      additionalProperties: false
      required:
        - type
        - world
        - cameraPosition
        - rotation
      properties:
        type:
          const: location
        world:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Exact name of an already-loaded Paper world.
        cameraPosition:
          allOf:
            - $ref: '#/components/schemas/ExactPosition'
          description: Exact camera and ray origin; no player eye height is added.
        rotation:
          $ref: '#/components/schemas/PerspectiveInputRotation'
    PerspectiveSource:
      oneOf:
        - $ref: '#/components/schemas/PerspectivePlayerSource'
        - $ref: '#/components/schemas/PerspectiveLocationSource'
      discriminator:
        propertyName: type
        mapping:
          player: '#/components/schemas/PerspectivePlayerSource'
          location: '#/components/schemas/PerspectiveLocationSource'
    GetPerspectiveViewRequest:
      type: object
      additionalProperties: false
      required:
        - source
      properties:
        source:
          $ref: '#/components/schemas/PerspectiveSource'
        width:
          type: integer
          format: int32
          minimum: 1
          maximum: 255
          default: 21
          description: Odd number of left-to-right ray columns.
          not:
            multipleOf: 2
        height:
          type: integer
          format: int32
          minimum: 1
          maximum: 255
          default: 13
          description: Odd number of top-to-bottom ray rows.
          not:
            multipleOf: 2
        verticalFieldOfViewDegrees:
          type: integer
          format: int32
          minimum: 1
          maximum: 170
          default: 70
          description: Vertical projection angle. Paper cannot observe a client's configured or dynamically modified FOV.
        maxDistance:
          type: integer
          format: int32
          minimum: 1
          maximum: 128
          default: 32
          description: Maximum Euclidean block-ray distance from cameraPosition.
        fluidCollision:
          type: string
          enum:
            - never
            - source_only
            - always
          default: never
        ignorePassableBlocks:
          type: boolean
          default: false
          description: Whether passable but collidable blocks are ignored by Paper ray tracing.
    PerspectiveViewBasis:
      type: object
      additionalProperties: false
      description: Orthonormal camera basis resolved from the camera rotation.
      required:
        - forward
        - right
        - up
      properties:
        forward:
          $ref: '#/components/schemas/ExactPosition'
        right:
          $ref: '#/components/schemas/ExactPosition'
        up:
          $ref: '#/components/schemas/ExactPosition'
    ResolvedPerspectiveViewport:
      type: object
      additionalProperties: false
      required:
        - width
        - height
        - verticalFieldOfViewDegrees
        - horizontalFieldOfViewDegrees
        - maxDistance
        - fluidCollision
        - ignorePassableBlocks
      properties:
        width:
          type: integer
          format: int32
          minimum: 1
          maximum: 255
        height:
          type: integer
          format: int32
          minimum: 1
          maximum: 255
        verticalFieldOfViewDegrees:
          type: integer
          format: int32
          minimum: 1
          maximum: 170
        horizontalFieldOfViewDegrees:
          type: number
          format: double
          exclusiveMinimum: 0
          exclusiveMaximum: 180
          description: Horizontal projection angle derived from vertical FOV and viewport aspect ratio.
        maxDistance:
          type: integer
          format: int32
          minimum: 1
          maximum: 128
        fluidCollision:
          type: string
          enum:
            - never
            - source_only
            - always
        ignorePassableBlocks:
          type: boolean
    PerspectiveViewHit:
      type: object
      additionalProperties: false
      required:
        - row
        - column
        - blockStateIndex
        - blockPosition
        - hitPosition
        - face
        - distance
      properties:
        row:
          type: integer
          format: int32
          minimum: 0
          description: Zero-based top-to-bottom viewport row.
        column:
          type: integer
          format: int32
          minimum: 0
          description: Zero-based left-to-right viewport column.
        blockStateIndex:
          type: integer
          format: int32
          minimum: 1
          description: One-based index into blockStatePalette.
        blockPosition:
          $ref: '#/components/schemas/BlockPosition'
        hitPosition:
          $ref: '#/components/schemas/ExactPosition'
        face:
          oneOf:
            - type: string
              enum:
                - up
                - down
                - north
                - east
                - south
                - west
            - type: 'null'
          description: Hit block face when Paper supplies one.
        distance:
          type: number
          format: double
          minimum: 0
          description: Euclidean ray distance from cameraPosition.
    PlayerEnchantment:
      type: object
      additionalProperties: false
      required:
        - type
        - level
      properties:
        type:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Namespaced enchantment identifier.
        level:
          $ref: '#/components/schemas/Int32'
    PlayerItemStack:
      type: object
      additionalProperties: false
      required:
        - type
        - amount
        - maxStackSize
        - damage
        - maxDamage
        - unbreakable
        - enchantments
      properties:
        type:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Namespaced item type.
        amount:
          $ref: '#/components/schemas/PositiveInt32'
        maxStackSize:
          $ref: '#/components/schemas/PositiveInt32'
        damage:
          oneOf:
            - type: integer
              format: int32
              minimum: 0
            - type: 'null'
        maxDamage:
          oneOf:
            - $ref: '#/components/schemas/PositiveInt32'
            - type: 'null'
        unbreakable:
          type: boolean
        enchantments:
          type: array
          description: Enchantments with distinct types in strictly increasing type order.
          items:
            $ref: '#/components/schemas/PlayerEnchantment'
    NullablePlayerItemStack:
      oneOf:
        - $ref: '#/components/schemas/PlayerItemStack'
        - type: 'null'
    PlayerEquipment:
      type: object
      additionalProperties: false
      required:
        - selectedHotbarSlot
        - mainHand
        - offHand
        - helmet
        - chestplate
        - leggings
        - boots
      properties:
        selectedHotbarSlot:
          type: integer
          format: int32
          minimum: 0
          maximum: 8
        mainHand:
          $ref: '#/components/schemas/NullablePlayerItemStack'
        offHand:
          $ref: '#/components/schemas/NullablePlayerItemStack'
        helmet:
          $ref: '#/components/schemas/NullablePlayerItemStack'
        chestplate:
          $ref: '#/components/schemas/NullablePlayerItemStack'
        leggings:
          $ref: '#/components/schemas/NullablePlayerItemStack'
        boots:
          $ref: '#/components/schemas/NullablePlayerItemStack'
    PlayerInventorySlot:
      type: object
      additionalProperties: false
      required:
        - slot
        - item
      properties:
        slot:
          type: integer
          format: int32
          minimum: 0
        item:
          $ref: '#/components/schemas/PlayerItemStack'
    PlayerInventory:
      type: object
      additionalProperties: false
      description: Sparse occupied container slots in ascending slot order. Player inventory excludes equipment and off-hand; ender chest uses the same shape.
      required:
        - size
        - slots
      properties:
        size:
          $ref: '#/components/schemas/PositiveInt32'
        slots:
          type: array
          description: Occupied slots with distinct indexes in strictly increasing order.
          items:
            $ref: '#/components/schemas/PlayerInventorySlot'
    PlayerVitals:
      type: object
      additionalProperties: false
      required:
        - health
        - maxHealth
        - absorptionAmount
        - foodLevel
        - saturation
        - exhaustion
        - remainingAir
        - maximumAir
        - experienceLevel
        - experienceProgress
        - calculatedExperiencePoints
        - fireTicks
        - freezeTicks
      properties:
        health:
          type: number
          format: double
          minimum: 0
        maxHealth:
          type: number
          format: double
          exclusiveMinimum: 0
        absorptionAmount:
          type: number
          format: double
          minimum: 0
        foodLevel:
          $ref: '#/components/schemas/Int32'
        saturation:
          type: number
          format: double
        exhaustion:
          type: number
          format: double
        remainingAir:
          type: integer
          format: int32
        maximumAir:
          $ref: '#/components/schemas/Int32'
        experienceLevel:
          type: integer
          format: int32
          minimum: 0
        experienceProgress:
          type: number
          format: double
          minimum: 0
          maximum: 1
        calculatedExperiencePoints:
          $ref: '#/components/schemas/Int32'
          description: Total points calculated from the current experience level and progress.
        fireTicks:
          type: integer
          format: int32
        freezeTicks:
          type: integer
          format: int32
          minimum: 0
    PlayerMovement:
      type: object
      additionalProperties: false
      required:
        - velocity
        - fallDistance
        - allowFlight
        - flying
        - sneaking
        - sprinting
        - swimming
        - gliding
        - sleeping
        - blocking
        - riptiding
      properties:
        velocity:
          $ref: '#/components/schemas/ExactPosition'
        fallDistance:
          type: number
          format: double
        allowFlight:
          type: boolean
        flying:
          type: boolean
        sneaking:
          type: boolean
        sprinting:
          type: boolean
        swimming:
          type: boolean
        gliding:
          type: boolean
        sleeping:
          type: boolean
        blocking:
          type: boolean
        riptiding:
          type: boolean
    PlayerClient:
      type: object
      additionalProperties: false
      required:
        - pingMillis
        - locale
        - clientViewDistance
        - viewDistance
        - sendViewDistance
      properties:
        pingMillis:
          $ref: '#/components/schemas/Int32'
        locale:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        clientViewDistance:
          type: integer
          format: int32
          minimum: 0
          description: Chunk render-distance preference reported by the client.
        viewDistance:
          allOf:
            - $ref: '#/components/schemas/Int32'
          description: Effective Paper chunk load distance for this player.
        sendViewDistance:
          allOf:
            - $ref: '#/components/schemas/Int32'
          description: Effective Paper chunk send distance for this player.
    PlayerEffect:
      type: object
      additionalProperties: false
      required:
        - type
        - amplifier
        - durationTicks
        - ambient
        - particles
        - icon
      properties:
        type:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Namespaced effect identifier.
        amplifier:
          $ref: '#/components/schemas/Int32'
        durationTicks:
          allOf:
            - $ref: '#/components/schemas/Int32'
          description: Remaining ticks; Paper uses -1 as the infinite-duration sentinel and plugins may expose other signed values.
        ambient:
          type: boolean
        particles:
          type: boolean
        icon:
          type: boolean
    ResolvedPerspectivePlayerSource:
      type: object
      additionalProperties: false
      required:
        - type
        - player
      properties:
        type:
          const: player
        player:
          $ref: '#/components/schemas/PlayerIdentity'
    ResolvedPerspectiveLocationSource:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          const: location
    ResolvedPerspectiveSource:
      oneOf:
        - $ref: '#/components/schemas/ResolvedPerspectivePlayerSource'
        - $ref: '#/components/schemas/ResolvedPerspectiveLocationSource'
      discriminator:
        propertyName: type
        mapping:
          player: '#/components/schemas/ResolvedPerspectivePlayerSource'
          location: '#/components/schemas/ResolvedPerspectiveLocationSource'
    GetPerspectiveViewResponse:
      type: object
      additionalProperties: false
      description: Exact first Paper block-collision hits from one resolved camera pose; misses are omitted and the result is not a client framebuffer.
      required:
        - capturedAt
        - source
        - world
        - worldId
        - cameraPosition
        - rotation
        - lookDirection
        - basis
        - viewport
        - checkedChunkCount
        - blockStatePalette
        - hits
        - crosshairHitIndex
      properties:
        capturedAt:
          type: string
          format: date-time
        source:
          $ref: '#/components/schemas/ResolvedPerspectiveSource'
        world:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        worldId:
          $ref: '#/components/schemas/Uuid'
        cameraPosition:
          $ref: '#/components/schemas/ExactPosition'
        rotation:
          $ref: '#/components/schemas/Rotation'
        lookDirection:
          $ref: '#/components/schemas/ExactPosition'
        basis:
          $ref: '#/components/schemas/PerspectiveViewBasis'
        viewport:
          $ref: '#/components/schemas/ResolvedPerspectiveViewport'
        checkedChunkCount:
          type: integer
          format: int32
          minimum: 0
          description: Exact size of the conservative loaded-chunk preflight for the sampled rays.
        blockStatePalette:
          type: array
          uniqueItems: true
          description: Unique block states ordered by first appearance in hits.
          items:
            type: string
            minLength: 1
            pattern: '.*\S.*'
        hits:
          type: array
          description: Sparse first hits in strictly increasing row-major viewport order.
          items:
            $ref: '#/components/schemas/PerspectiveViewHit'
        crosshairHitIndex:
          oneOf:
            - type: integer
              format: int32
              minimum: 0
            - type: 'null'
          description: Zero-based hits index for the center ray, or null when it did not hit a block.
    GetPlayerContextResponse:
      type: object
      additionalProperties: false
      description: Coherent Paper main-thread capture. Each requested section is non-null and each excluded section is null. When equipment and inventory are both included, equipment.mainHand equals the selectedHotbarSlot item, or is null when that sparse slot is omitted.
      required:
        - capturedAt
        - player
        - world
        - worldId
        - gameMode
        - feetPosition
        - blockPosition
        - eyePosition
        - rotation
        - lookDirection
        - pose
        - onGround
        - equipment
        - inventory
        - enderChest
        - vitals
        - movement
        - client
        - effects
      properties:
        capturedAt:
          type: string
          format: date-time
        player:
          $ref: '#/components/schemas/PlayerIdentity'
        world:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        worldId:
          $ref: '#/components/schemas/Uuid'
        gameMode:
          type: string
          enum:
            - survival
            - creative
            - adventure
            - spectator
        feetPosition:
          $ref: '#/components/schemas/ExactPosition'
        blockPosition:
          $ref: '#/components/schemas/BlockPosition'
        eyePosition:
          $ref: '#/components/schemas/ExactPosition'
        rotation:
          $ref: '#/components/schemas/Rotation'
        lookDirection:
          $ref: '#/components/schemas/ExactPosition'
        pose:
          type: string
          enum:
            - standing
            - fall_flying
            - sleeping
            - swimming
            - spin_attack
            - sneaking
            - long_jumping
            - dying
            - croaking
            - using_tongue
            - sitting
            - roaring
            - sniffing
            - emerging
            - digging
            - sliding
            - shooting
            - inhaling
        onGround:
          type: boolean
        equipment:
          oneOf:
            - $ref: '#/components/schemas/PlayerEquipment'
            - type: 'null'
        inventory:
          oneOf:
            - $ref: '#/components/schemas/PlayerInventory'
            - type: 'null'
        enderChest:
          oneOf:
            - $ref: '#/components/schemas/PlayerInventory'
            - type: 'null'
        vitals:
          oneOf:
            - $ref: '#/components/schemas/PlayerVitals'
            - type: 'null'
        movement:
          oneOf:
            - $ref: '#/components/schemas/PlayerMovement'
            - type: 'null'
        client:
          oneOf:
            - $ref: '#/components/schemas/PlayerClient'
            - type: 'null'
        effects:
          oneOf:
            - type: array
              description: Active effects with distinct types in strictly increasing type order.
              items:
                $ref: '#/components/schemas/PlayerEffect'
            - type: 'null'
    DestinationPaletteEntry:
      type: object
      additionalProperties: false
      required:
        - blockState
      properties:
        blockState:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Exact canonical block state to place.
        weight:
          type: integer
          minimum: 1
          maximum: 100
          description: Whole-number percentage supplied for every entry or omitted from every entry.
    EditRecord:
      type: object
      additionalProperties: false
      description: Identity and lifecycle metadata for one Dirt edit transaction.
      required:
        - editId
        - callId
        - operation
        - world
        - worldId
        - bounds
        - changedBlockCount
        - completedAt
        - status
      properties:
        editId:
          $ref: '#/components/schemas/UuidV4'
        callId:
          $ref: '#/components/schemas/UuidV4'
        operation:
          type: string
          enum:
            - replace_region_blocks
            - fill_region
            - set_blocks
        world:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        worldId:
          $ref: '#/components/schemas/Uuid'
        bounds:
          description: Normalized operation bounds; set-block edits use the smallest inclusive bounds containing every requested position.
          $ref: '#/components/schemas/Bounds'
        changedBlockCount:
          type: integer
          format: int64
          minimum: 1
        completedAt:
          type: string
          format: date-time
          description: Timestamp recorded when the original edit completed or entered recovery; later undo attempts do not change it.
        status:
          type: string
          description: Last retained state represented by this record. A successful undo returns the state immediately before consumption.
          enum:
            - committed
            - recovery_required
    ReplaceRegionBlocksRequest:
      type: object
      additionalProperties: false
      required:
        - world
        - min
        - max
        - sourceBlockStatePatterns
        - destinationPalette
      properties:
        world:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        min:
          $ref: '#/components/schemas/BlockPosition'
        max:
          $ref: '#/components/schemas/BlockPosition'
        sourceBlockStatePatterns:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          description: ORed block-state patterns; omitted properties match any value.
          items:
            type: string
            minLength: 1
            pattern: '.*\S.*'
        destinationPalette:
          type: array
          minItems: 1
          maxItems: 64
          description: Exact destination states; weights are all omitted for equal probability or all total 100.
          items:
            $ref: '#/components/schemas/DestinationPaletteEntry'
        seed:
          type: integer
          format: int32
          description: A supplied seed is echoed in the response; omission generates and returns a fresh seed.
        dryRun:
          type: boolean
          description: True requires a preview outcome, false excludes preview, and omission uses the configured replace default.
    ReplaceRegionBlocksResponse:
      type: object
      additionalProperties: false
      oneOf:
        - properties:
            outcome:
              const: preview
            edit:
              type: 'null'
        - properties:
            outcome:
              const: no_change
            changedBlockCount:
              const: 0
            edit:
              type: 'null'
        - properties:
            outcome:
              const: committed
            changedBlockCount:
              minimum: 1
            edit:
              allOf:
                - $ref: '#/components/schemas/EditRecord'
                - properties:
                    operation:
                      const: replace_region_blocks
                    status:
                      const: committed
      required:
        - world
        - bounds
        - sourceBlockStatePatterns
        - destinationPalette
        - seed
        - outcome
        - edit
        - matchedBlockCount
        - changedBlockCount
      properties:
        world:
          type: string
          minLength: 1
        bounds:
          description: Normalized inclusive bounds from the requested corners.
          $ref: '#/components/schemas/Bounds'
        sourceBlockStatePatterns:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 1
            pattern: '.*\S.*'
        destinationPalette:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/DestinationPaletteEntry'
        seed:
          type: integer
          format: int32
          description: Supplied request seed, or the generated seed when the request omitted one.
        outcome:
          type: string
          description: Explicit dryRun=true requires preview; false excludes preview.
          enum:
            - preview
            - no_change
            - committed
        edit:
          oneOf:
            - $ref: '#/components/schemas/EditRecord'
            - type: 'null'
        matchedBlockCount:
          type: integer
          format: int64
          minimum: 0
          description: Blocks matching a source pattern; cannot exceed the inclusive bounds volume.
        changedBlockCount:
          type: integer
          format: int64
          minimum: 0
          description: Blocks changed or that would change; cannot exceed matchedBlockCount.
    FillRegionRequest:
      type: object
      additionalProperties: false
      required:
        - world
        - min
        - max
        - destinationPalette
      properties:
        world:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        min:
          $ref: '#/components/schemas/BlockPosition'
        max:
          $ref: '#/components/schemas/BlockPosition'
        destinationPalette:
          type: array
          minItems: 1
          maxItems: 64
          description: Exact destination states; weights are all omitted for equal probability or all total 100.
          items:
            $ref: '#/components/schemas/DestinationPaletteEntry'
        seed:
          type: integer
          format: int32
          description: A supplied seed is echoed in the response; omission generates and returns a fresh seed.
        dryRun:
          type: boolean
          description: True requires a preview outcome, false excludes preview, and omission uses the configured fill default.
    FillRegionResponse:
      type: object
      additionalProperties: false
      oneOf:
        - properties:
            outcome:
              const: preview
            edit:
              type: 'null'
        - properties:
            outcome:
              const: no_change
            changedBlockCount:
              const: 0
            edit:
              type: 'null'
        - properties:
            outcome:
              const: committed
            changedBlockCount:
              minimum: 1
            edit:
              allOf:
                - $ref: '#/components/schemas/EditRecord'
                - properties:
                    operation:
                      const: fill_region
                    status:
                      const: committed
      required:
        - world
        - bounds
        - destinationPalette
        - seed
        - outcome
        - edit
        - volume
        - changedBlockCount
      properties:
        world:
          type: string
          minLength: 1
        bounds:
          description: Normalized inclusive bounds from the requested corners.
          $ref: '#/components/schemas/Bounds'
        destinationPalette:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/DestinationPaletteEntry'
        seed:
          type: integer
          format: int32
          description: Supplied request seed, or the generated seed when the request omitted one.
        outcome:
          type: string
          description: Explicit dryRun=true requires preview; false excludes preview.
          enum:
            - preview
            - no_change
            - committed
        edit:
          oneOf:
            - $ref: '#/components/schemas/EditRecord'
            - type: 'null'
        volume:
          type: integer
          format: int64
          minimum: 1
          description: Exact inclusive volume of the requested normalized bounds.
        changedBlockCount:
          type: integer
          format: int64
          minimum: 0
          description: Blocks changed or that would change; cannot exceed volume.
    SetBlocksRequest:
      type: object
      additionalProperties: false
      required:
        - world
        - origin
        - palettes
        - placements
        - runs
      properties:
        world:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        origin:
          $ref: '#/components/schemas/BlockPosition'
        palettes:
          type: array
          maxItems: 64
          description: Weighted palettes referenced by zero-based index; empty exactly when placements and runs are both empty, with at most 64 entries across all palettes.
          items:
            type: array
            minItems: 1
            maxItems: 64
            description: Exact states; weights are all omitted for equal probability or all supplied as whole percentages totaling 100.
            items:
              $ref: '#/components/schemas/DestinationPaletteEntry'
        placements:
          type: array
          description: Palette-indexed origin-relative singleton positions; all represented blocks across placements and runs must be distinct.
          items:
            $ref: '#/components/schemas/PalettePlacement'
        runs:
          type: array
          description: Palette-indexed origin-relative forward inclusive cuboids; all represented blocks across placements and runs must be distinct.
          items:
            $ref: '#/components/schemas/PaletteRun'
        seed:
          type: integer
          format: int32
          description: A supplied seed is echoed in the response; omission generates and returns a fresh seed.
        dryRun:
          type: boolean
          description: True requires a preview outcome, false excludes preview, and omission uses the configured set-blocks default.
    SetBlocksResponse:
      type: object
      additionalProperties: false
      oneOf:
        - properties:
            outcome:
              const: preview
            edit:
              type: 'null'
        - properties:
            outcome:
              const: no_change
            changedBlockCount:
              const: 0
            edit:
              type: 'null'
        - properties:
            outcome:
              const: committed
            changedBlockCount:
              minimum: 1
            edit:
              allOf:
                - $ref: '#/components/schemas/EditRecord'
                - properties:
                    operation:
                      const: set_blocks
                    status:
                      const: committed
      required:
        - world
        - bounds
        - palettes
        - seed
        - outcome
        - edit
        - blockCount
        - changedBlockCount
        - unchangedBlockCount
      properties:
        world:
          type: string
          minLength: 1
        bounds:
          description: Smallest inclusive bounds containing all requested resolved blocks, or null for empty geometry.
          oneOf:
            - $ref: '#/components/schemas/Bounds'
            - type: 'null'
        palettes:
          type: array
          maxItems: 64
          description: Canonical palettes used by the edit, or an empty array for empty geometry.
          items:
            type: array
            minItems: 1
            maxItems: 64
            items:
              $ref: '#/components/schemas/DestinationPaletteEntry'
        seed:
          type: integer
          format: int32
          description: Supplied request seed, or the generated seed when the request omitted one.
        outcome:
          type: string
          description: Explicit dryRun=true requires preview; false excludes preview.
          enum:
            - preview
            - no_change
            - committed
        edit:
          oneOf:
            - $ref: '#/components/schemas/EditRecord'
            - type: 'null'
        blockCount:
          type: integer
          format: int64
          minimum: 0
          description: Expanded number of unique blocks represented by placements and runs.
        changedBlockCount:
          type: integer
          format: int64
          minimum: 0
          description: Blocks changed or that would change; together with unchangedBlockCount equals blockCount.
        unchangedBlockCount:
          type: integer
          format: int64
          minimum: 0
          description: Blocks already in their requested state; together with changedBlockCount equals blockCount.
    GetEditHistoryRequest:
      type: object
      additionalProperties: false
      required:
        - world
      properties:
        world:
          type: string
          minLength: 1
          pattern: '.*\S.*'
    GetEditHistoryResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - edits
      properties:
        world:
          type: string
          minLength: 1
        edits:
          type: array
          uniqueItems: true
          description: Retained undoable edit records for one loaded world UUID, ordered newest first with distinct edit IDs.
          items:
            $ref: '#/components/schemas/EditRecord'
    UndoEditRequest:
      type: object
      additionalProperties: false
      required:
        - world
        - editId
      properties:
        world:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        editId:
          $ref: '#/components/schemas/UuidV4'
    UndoEditResponse:
      type: object
      additionalProperties: false
      required:
        - edit
        - undoCallId
        - undoneAt
      properties:
        edit:
          description: Edit record as retained immediately before the successful undo consumed it.
          $ref: '#/components/schemas/EditRecord'
        undoCallId:
          $ref: '#/components/schemas/UuidV4'
        undoneAt:
          type: string
          format: date-time
    RunMinecraftCommandsRequest:
      type: object
      additionalProperties: false
      required:
        - commands
      properties:
        commands:
          type: array
          minItems: 1
          description: Commands in execution order. The active maximum count is reported by server status. Each entry may include one in-game leading slash and must not contain control characters.
          items:
            $ref: '#/components/schemas/MinecraftCommandInput'
    MinecraftCommandInput:
      type: string
      minLength: 1
      pattern: '^(?![ \u1680\u2000-\u2006\u2008-\u200A\u2028\u2029\u205F\u3000]*\/?[ \u1680\u2000-\u2006\u2008-\u200A\u2028\u2029\u205F\u3000]*$)[^\u0000-\u001F\u007F-\u009F]+$'
      description: A command containing no ISO control characters and remaining non-empty after Java whitespace and at most one leading slash are removed.
    NormalizedMinecraftCommand:
      type: string
      minLength: 1
      pattern: '^[^ \u0000-\u001F\u007F-\u009F\u1680\u2000-\u2006\u2008-\u200A\u2028\u2029\u205F\u3000](?:[^\u0000-\u001F\u007F-\u009F]*[^ \u0000-\u001F\u007F-\u009F\u1680\u2000-\u2006\u2008-\u200A\u2028\u2029\u205F\u3000])?$'
      description: A control-free command after Dirt removes Java outer whitespace and at most one leading slash.
    CommandSender:
      type: object
      additionalProperties: false
      required:
        - name
        - isOperator
        - isPlayer
      properties:
        name:
          type: string
          minLength: 1
          description: Actual Paper feedback-forwarding sender name.
        isOperator:
          const: true
          description: The sender has console-equivalent permissions.
        isPlayer:
          const: false
          description: The sender has no player entity or location context.
    CommandResult:
      description: Outcome and bounded synchronous feedback for one normalized command.
      oneOf:
        - $ref: '#/components/schemas/DispatchedCommandResult'
        - $ref: '#/components/schemas/CommandNotFoundResult'
        - $ref: '#/components/schemas/CommandDispatchFailedResult'
    DispatchedCommandResult:
      type: object
      additionalProperties: false
      required:
        - command
        - outcome
        - feedback
        - message
        - rawMessage
      properties:
        command:
          $ref: '#/components/schemas/NormalizedMinecraftCommand'
        outcome:
          const: dispatched
          description: Paper found and invoked a target without a dispatch exception; this does not assert semantic command success.
        feedback:
          type: array
          description: Bounded non-empty plain-text messages synchronously sent to this command's feedback sender.
          items:
            type: string
            minLength: 1
        message:
          type: 'null'
        rawMessage:
          type: 'null'
    CommandNotFoundResult:
      type: object
      additionalProperties: false
      required:
        - command
        - outcome
        - feedback
        - message
        - rawMessage
      properties:
        command:
          $ref: '#/components/schemas/NormalizedMinecraftCommand'
        outcome:
          const: not_found
          description: Paper found no command target; this result ends the batch and later commands are not attempted.
        feedback:
          type: array
          description: Bounded non-empty plain-text messages synchronously sent to this command's feedback sender.
          items:
            type: string
            minLength: 1
        message:
          type: string
          minLength: 1
          description: Actionable explanation of the missing target.
        rawMessage:
          type: 'null'
    CommandDispatchFailedResult:
      type: object
      additionalProperties: false
      required:
        - command
        - outcome
        - feedback
        - message
        - rawMessage
      properties:
        command:
          $ref: '#/components/schemas/NormalizedMinecraftCommand'
        outcome:
          const: dispatch_failed
          description: The command target raised a Paper CommandException; this result ends the batch and later commands are not attempted.
        feedback:
          type: array
          description: Bounded non-empty plain-text messages synchronously sent to this command's feedback sender.
          items:
            type: string
            minLength: 1
        message:
          type: string
          minLength: 1
          description: Deepest non-empty cause message found within bounded traversal of the dispatch failure.
        rawMessage:
          type: string
          minLength: 1
          description: Original non-empty Paper CommandException message, or a stable fallback when Paper supplies none.
    RunMinecraftCommandsResponse:
      type: object
      additionalProperties: false
      required:
        - sender
        - feedbackTruncated
        - results
      properties:
        sender:
          $ref: '#/components/schemas/CommandSender'
        feedbackTruncated:
          type: boolean
          description: Whether synchronous feedback exceeded the active request-wide Unicode-code-point limit.
        results:
          type: array
          minItems: 1
          description: Non-empty attempted prefix in original order. All non-final results are dispatched; the final result is the first failure, or every supplied command was dispatched.
          items:
            $ref: '#/components/schemas/CommandResult'
    LimitConfiguration:
      type: object
      additionalProperties: false
      required:
        - maxRequestBytes
        - maxRegionVolume
        - maxTouchedChunks
        - maxInspectionTouchedChunks
        - maxBlockStatePatterns
        - maxChangedBlocks
        - maxInspectionVolume
        - defaultInspectionResultLimit
        - maxInspectionResultLimit
        - maxCommandsPerRequest
        - maxCommandFeedbackCharacters
      properties:
        maxRequestBytes:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483646
          description: Maximum JSON request-body size accepted by the bridge; capped below the signed 32-bit maximum so over-limit detection cannot overflow.
        maxRegionVolume:
          type: integer
          format: int32
          minimum: 1
          description: Maximum cuboid mutation/count volume or placements in set_blocks.
        maxTouchedChunks:
          type: integer
          format: int32
          minimum: 1
          description: Maximum distinct loaded chunks one mutation may touch.
        maxInspectionTouchedChunks:
          type: integer
          format: int32
          minimum: 1
          description: Maximum distinct loaded chunks a region inspection may snapshot or a perspective view may check; cannot exceed maxTouchedChunks.
        maxBlockStatePatterns:
          type: integer
          format: int32
          minimum: 1
          maximum: 64
          description: Maximum block-state patterns or palette entries in one operation; inspection include and exclude lists share this cap.
        maxChangedBlocks:
          type: integer
          format: int32
          minimum: 1
          description: Maximum blocks one mutation may change; cannot exceed maxRegionVolume.
        maxInspectionVolume:
          type: integer
          format: int32
          minimum: 1
          description: Maximum blocks scanned by exact block retrieval or an orthographic view, and maximum configured perspective-view ray-distance budget; cannot exceed maxRegionVolume.
        defaultInspectionResultLimit:
          type: integer
          format: int32
          minimum: 1
          description: Default exact-block, run, or visible-block result limit; cannot exceed maxInspectionResultLimit.
        maxInspectionResultLimit:
          type: integer
          format: int32
          minimum: 1
          description: Maximum caller-selectable exact-block, run, or visible-block result limit and maximum perspective-view ray count; cannot exceed maxInspectionVolume.
        maxCommandsPerRequest:
          type: integer
          format: int32
          minimum: 1
          description: Maximum commands accepted in one ordered command batch.
        maxCommandFeedbackCharacters:
          type: integer
          format: int32
          minimum: 1
          description: Maximum Unicode code points of synchronous plain-text feedback retained across one command batch.
    EditHistoryConfiguration:
      type: object
      additionalProperties: false
      required:
        - maxEntriesPerWorld
        - maxEntriesTotal
        - maxRetainedChangedBlocks
      properties:
        maxEntriesPerWorld:
          type: integer
          format: int32
          minimum: 1
          description: Maximum retained undoable edits in one loaded world; cannot exceed maxEntriesTotal.
        maxEntriesTotal:
          type: integer
          format: int32
          minimum: 1
          description: Maximum retained undoable edits across all loaded worlds.
        maxRetainedChangedBlocks:
          type: integer
          format: int32
          minimum: 1
          description: Maximum sum of changed-block counts across all retained undoable edits; must be at least LimitConfiguration.maxChangedBlocks.
    DefaultConfiguration:
      type: object
      additionalProperties: false
      required:
        - getBlocksIncludeAir
        - editDryRun
      properties:
        getBlocksIncludeAir:
          type: boolean
        editDryRun:
          type: boolean
          description: Default dry-run behavior for every Dirt block-edit tool.
    LoggingConfiguration:
      type: object
      additionalProperties: false
      description: Active operator-console threshold and rotating Paper detail-log limits.
      required:
        - consoleLevel
        - detailFileMaxBytes
        - detailFileRetainedFiles
      properties:
        consoleLevel:
          type: string
          enum:
            - info
            - warning
            - error
          description: Minimum severity emitted to the Paper server console.
        detailFileMaxBytes:
          type: integer
          format: int32
          minimum: 1
          description: Approximate maximum bytes in each Paper JSONL detail-log generation before rotation.
        detailFileRetainedFiles:
          type: integer
          format: int32
          minimum: 2
          maximum: 100
          description: Number of rotating Paper JSONL detail-log generations retained, including the active generation.
    ToolConfiguration:
      type: object
      additionalProperties: false
      description: Resolved MCP tool allowlist. Every flag is reported; a tool omitted from YAML resolves to false.
      required:
        - ping_server
        - get_server_status
        - count_region_block_states
        - get_blocks
        - scan_orthographic_view
        - get_player_context
        - get_perspective_view
        - replace_region_blocks
        - fill_region
        - set_blocks
        - get_edit_history
        - undo_edit
        - run_minecraft_commands
      properties:
        ping_server:
          type: boolean
        get_server_status:
          type: boolean
        count_region_block_states:
          type: boolean
        get_blocks:
          type: boolean
        scan_orthographic_view:
          type: boolean
        get_player_context:
          type: boolean
        get_perspective_view:
          type: boolean
        replace_region_blocks:
          type: boolean
        fill_region:
          type: boolean
        set_blocks:
          type: boolean
        get_edit_history:
          type: boolean
        undo_edit:
          type: boolean
        run_minecraft_commands:
          type: boolean
    PingResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          const: ok
    ServerBuilds:
      type: object
      additionalProperties: false
      required:
        - minecraft
        - paper
        - dirtMcp
        - fawe
      properties:
        minecraft:
          type: string
          minLength: 1
        paper:
          type: string
          minLength: 1
        dirtMcp:
          type: string
          minLength: 1
        fawe:
          type: string
          minLength: 1
    ServerPerformance:
      type: object
      additionalProperties: false
      required:
        - tpsOneMinute
        - averageTickTimeMillis
      properties:
        tpsOneMinute:
          type: number
          format: double
          minimum: 0
        averageTickTimeMillis:
          type: number
          format: double
          minimum: 0
    OnlinePlayer:
      type: object
      additionalProperties: false
      required:
        - name
        - world
        - gameMode
        - facing
        - blockPosition
      properties:
        name:
          type: string
          minLength: 1
        world:
          type: string
          minLength: 1
        gameMode:
          type: string
          enum:
            - survival
            - creative
            - adventure
            - spectator
        facing:
          type: string
          description: Current horizontal cardinal direction the player is facing.
          enum:
            - north
            - east
            - south
            - west
        blockPosition:
          $ref: '#/components/schemas/BlockPosition'
    PlayerSummary:
      type: object
      additionalProperties: false
      required:
        - online
        - maximum
        - entries
      properties:
        online:
          type: integer
          format: int32
          minimum: 0
        maximum:
          type: integer
          format: int32
          minimum: 0
        entries:
          type: array
          items:
            $ref: '#/components/schemas/OnlinePlayer'
    WorldStatus:
      type: object
      additionalProperties: false
      required:
        - name
        - environment
        - minY
        - maxY
        - spawn
        - timeOfDay
        - storm
        - thundering
        - playerCount
      properties:
        name:
          type: string
          minLength: 1
        environment:
          type: string
          minLength: 1
        minY:
          type: integer
          format: int32
        maxY:
          type: integer
          format: int32
        spawn:
          $ref: '#/components/schemas/BlockPosition'
        timeOfDay:
          type: integer
          format: int64
          minimum: 0
          maximum: 23999
        storm:
          type: boolean
        thundering:
          type: boolean
        playerCount:
          type: integer
          format: int32
          minimum: 0
    ServerStatusResponse:
      type: object
      additionalProperties: false
      required:
        - builds
        - performance
        - players
        - worlds
        - limits
        - editHistory
        - defaults
        - logging
        - tools
      properties:
        builds:
          $ref: '#/components/schemas/ServerBuilds'
        performance:
          $ref: '#/components/schemas/ServerPerformance'
        players:
          $ref: '#/components/schemas/PlayerSummary'
        worlds:
          type: array
          items:
            $ref: '#/components/schemas/WorldStatus'
        limits:
          $ref: '#/components/schemas/LimitConfiguration'
        editHistory:
          $ref: '#/components/schemas/EditHistoryConfiguration'
        defaults:
          $ref: '#/components/schemas/DefaultConfiguration'
        logging:
          $ref: '#/components/schemas/LoggingConfiguration'
        tools:
          $ref: '#/components/schemas/ToolConfiguration'
