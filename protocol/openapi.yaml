openapi: 3.2.0
info:
  title: Dirt MCP Paper Bridge
  version: 0.1.0
  description: Local contract between the Dirt MCP stdio server and Paper plugin.
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:8765
    description: Default loopback development endpoint
security:
  - bearerAuth: []
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Report bridge availability, versions, and active non-secret configuration
      responses:
        '200':
          description: Bridge health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/GetMethodNotAllowed'
  /v1/inspect-region:
    post:
      operationId: inspectRegion
      summary: Count block states in a bounded region of loaded chunks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectRegionRequest'
      responses:
        '200':
          description: Region inspection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectRegionResponse'
        '400':
          description: Invalid JSON, fields, coordinates, or world height
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '413':
          description: Normalized region exceeds the configured volume limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected inspection failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Region contains an unloaded chunk or inspection was interrupted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/inspect-blocks:
    post:
      operationId: inspectBlocks
      summary: Return exact filtered block geometry from a bounded region of loaded chunks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectBlocksRequest'
      responses:
        '200':
          description: Exact sparse blocks or deterministic axis-aligned runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectBlocksResponse'
        '400':
          description: Invalid JSON, fields, coordinates, filters, options, or world height
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '413':
          description: Region volume or exact result exceeds its limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected inspection failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Region contains an unloaded chunk or inspection was interrupted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/inspect-view:
    post:
      operationId: inspectView
      summary: Return the first non-air block along each sightline in an orthographic view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectViewRequest'
      responses:
        '200':
          description: Exact sparse visible block layer and its world-aligned view basis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectViewResponse'
        '400':
          description: Invalid JSON, fields, coordinates, view geometry, or world height
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '413':
          description: View scan volume or exact result exceeds its limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected inspection failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: View contains an unloaded chunk or inspection was interrupted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/replace-blocks:
    post:
      operationId: replaceBlocks
      summary: Replace one exact block state in a bounded region of loaded chunks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceBlocksRequest'
      responses:
        '200':
          description: Executed edit or exact dry-run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceBlocksResponse'
        '400':
          description: Invalid JSON, fields, coordinates, world height, or block state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '409':
          description: Another Dirt MCP edit is active in this world
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Region volume or estimated changed-block count exceeds its configured limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected edit failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Region contains an unloaded chunk or editing was interrupted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/fill-region:
    post:
      operationId: fillRegion
      summary: Fill a bounded region of loaded chunks with one block state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FillRegionRequest'
      responses:
        '200':
          description: Executed edit or exact dry-run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FillRegionResponse'
        '400':
          description: Invalid JSON, fields, coordinates, world height, or block state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '409':
          description: Another Dirt MCP edit is active in this world
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Region volume or estimated changed-block count exceeds its configured limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected edit failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Region contains an unloaded chunk or editing was interrupted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/undo-last-edit:
    post:
      operationId: undoLastEdit
      summary: Undo the newest successful Dirt MCP edit in a loaded world
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UndoLastEditRequest'
      responses:
        '200':
          description: Completed undo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UndoLastEditResponse'
        '400':
          description: Invalid JSON or fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: World is not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '409':
          description: No undo is available or another Dirt MCP edit is active in this world
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected undo failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Undo was interrupted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer realm="dirt-mcp"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GetMethodNotAllowed:
      description: Method not allowed
      headers:
        Allow:
          schema:
            const: GET
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PostMethodNotAllowed:
      description: Method not allowed
      headers:
        Allow:
          schema:
            const: POST
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - internal_error
                - invalid_request
                - method_not_allowed
                - change_limit_exceeded
                - nothing_to_undo
                - region_too_large
                - result_too_large
                - unauthorized
                - world_busy
                - world_not_found
                - world_unavailable
            message:
              type: string
    BlockPosition:
      type: object
      additionalProperties: false
      required:
        - x
        - y
        - z
      properties:
        x:
          type: integer
          format: int32
        y:
          type: integer
          format: int32
        z:
          type: integer
          format: int32
    Bounds:
      type: object
      additionalProperties: false
      required:
        - min
        - max
      properties:
        min:
          $ref: '#/components/schemas/BlockPosition'
        max:
          $ref: '#/components/schemas/BlockPosition'
    Dimensions:
      type: object
      additionalProperties: false
      required:
        - x
        - y
        - z
      properties:
        x:
          type: integer
          format: int64
          minimum: 1
        y:
          type: integer
          format: int64
          minimum: 1
        z:
          type: integer
          format: int64
          minimum: 1
    InspectRegionRequest:
      type: object
      additionalProperties: false
      required:
        - world
        - min
        - max
      properties:
        world:
          type: string
          minLength: 1
        min:
          $ref: '#/components/schemas/BlockPosition'
        max:
          $ref: '#/components/schemas/BlockPosition'
    InspectRegionResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - bounds
        - dimensions
        - volume
        - blockStates
      properties:
        world:
          type: string
          minLength: 1
        bounds:
          $ref: '#/components/schemas/Bounds'
        dimensions:
          $ref: '#/components/schemas/Dimensions'
        volume:
          type: integer
          format: int64
          minimum: 1
        blockStates:
          type: object
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
    InspectBlocksRequest:
      type: object
      additionalProperties: false
      required:
        - world
        - min
        - max
      properties:
        world:
          type: string
          minLength: 1
        min:
          $ref: '#/components/schemas/BlockPosition'
        max:
          $ref: '#/components/schemas/BlockPosition'
        include:
          type: array
          description: Block-state patterns to include; omitted properties match any value.
          items:
            type: string
            minLength: 1
        exclude:
          type: array
          description: Block-state patterns to exclude after include filtering.
          items:
            type: string
            minLength: 1
        includeAir:
          type: boolean
          description: Include air-family states; omission uses the configured default.
        maxResults:
          type: integer
          format: int32
          minimum: 1
          description: Requested result cap; it cannot exceed the configured maximum.
        mode:
          type: string
          enum:
            - blocks
            - runs
          description: Omission uses the configured exact-inspection mode.
    InspectedBlock:
      type: object
      additionalProperties: false
      required:
        - position
        - state
      properties:
        position:
          $ref: '#/components/schemas/BlockPosition'
        state:
          type: string
          minLength: 1
    BlockRun:
      type: object
      additionalProperties: false
      required:
        - state
        - from
        - to
      properties:
        state:
          type: string
          minLength: 1
        from:
          description: Inclusive first position of the axis-aligned run.
          $ref: '#/components/schemas/BlockPosition'
        to:
          description: Inclusive last position of the axis-aligned run.
          $ref: '#/components/schemas/BlockPosition'
    InspectBlocksResponse:
      oneOf:
        - $ref: '#/components/schemas/InspectBlocksListResponse'
        - $ref: '#/components/schemas/InspectBlockRunsResponse'
      discriminator:
        propertyName: mode
        mapping:
          blocks: '#/components/schemas/InspectBlocksListResponse'
          runs: '#/components/schemas/InspectBlockRunsResponse'
    InspectBlocksListResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - bounds
        - volume
        - matchedBlocks
        - mode
        - blocks
      properties:
        world:
          type: string
          minLength: 1
        bounds:
          $ref: '#/components/schemas/Bounds'
        volume:
          type: integer
          format: int64
          minimum: 1
        matchedBlocks:
          type: integer
          format: int64
          minimum: 0
        mode:
          const: blocks
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/InspectedBlock'
    InspectBlockRunsResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - bounds
        - volume
        - matchedBlocks
        - mode
        - runs
      properties:
        world:
          type: string
          minLength: 1
        bounds:
          $ref: '#/components/schemas/Bounds'
        volume:
          type: integer
          format: int64
          minimum: 1
        matchedBlocks:
          type: integer
          format: int64
          minimum: 0
        mode:
          const: runs
        runs:
          type: array
          items:
            $ref: '#/components/schemas/BlockRun'
    InspectViewRequest:
      type: object
      additionalProperties: false
      required:
        - world
        - origin
        - direction
        - horizontalRadius
        - verticalRadius
        - maxDistance
      properties:
        world:
          type: string
          minLength: 1
        origin:
          description: Center anchor of the orthographic view; scanning starts one block forward.
          $ref: '#/components/schemas/BlockPosition'
        direction:
          type: string
          description: World-axis direction; north is -Z, east is +X, south is +Z, west is -X, up is +Y, and down is -Y.
          enum:
            - north
            - east
            - south
            - west
            - up
            - down
        horizontalRadius:
          type: integer
          format: int32
          minimum: 0
          description: Viewport cells on each side of the center sightline along the response's horizontal basis.
        verticalRadius:
          type: integer
          format: int32
          minimum: 0
          description: Viewport cells on each side of the center sightline along the response's vertical basis.
        maxDistance:
          type: integer
          format: int32
          minimum: 1
          description: Blocks scanned forward from the origin; distance 1 is adjacent.
        maxResults:
          type: integer
          format: int32
          minimum: 1
          description: Requested visible-block cap; omission and maximum use plugin configuration.
    AxisVector:
      type: object
      additionalProperties: false
      required:
        - x
        - y
        - z
      properties:
        x:
          type: integer
          format: int32
          minimum: -1
          maximum: 1
        y:
          type: integer
          format: int32
          minimum: -1
          maximum: 1
        z:
          type: integer
          format: int32
          minimum: -1
          maximum: 1
    ViewBasis:
      type: object
      additionalProperties: false
      description: World-axis unit vectors used to convert view-relative offsets to block positions.
      required:
        - forward
        - horizontal
        - vertical
      properties:
        forward:
          $ref: '#/components/schemas/AxisVector'
        horizontal:
          $ref: '#/components/schemas/AxisVector'
        vertical:
          $ref: '#/components/schemas/AxisVector'
    Viewport:
      type: object
      additionalProperties: false
      required:
        - horizontalRadius
        - verticalRadius
        - maxDistance
      properties:
        horizontalRadius:
          type: integer
          format: int32
          minimum: 0
        verticalRadius:
          type: integer
          format: int32
          minimum: 0
        maxDistance:
          type: integer
          format: int32
          minimum: 1
    ViewOffset:
      type: object
      additionalProperties: false
      required:
        - horizontal
        - vertical
        - distance
      properties:
        horizontal:
          type: integer
          format: int32
          description: Signed displacement along the view's horizontal basis.
        vertical:
          type: integer
          format: int32
          description: Signed displacement along the view's vertical basis.
        distance:
          type: integer
          format: int32
          minimum: 1
          description: Positive displacement along the forward basis; 1 is adjacent to the origin.
    ViewBlock:
      type: object
      additionalProperties: false
      required:
        - position
        - offset
        - state
      properties:
        position:
          $ref: '#/components/schemas/BlockPosition'
        offset:
          $ref: '#/components/schemas/ViewOffset'
        state:
          type: string
          minLength: 1
    InspectViewResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - origin
        - direction
        - basis
        - viewport
        - bounds
        - scannedVolume
        - visibleBlocks
        - blocks
      properties:
        world:
          type: string
          minLength: 1
        origin:
          $ref: '#/components/schemas/BlockPosition'
        direction:
          type: string
          enum:
            - north
            - east
            - south
            - west
            - up
            - down
        basis:
          $ref: '#/components/schemas/ViewBasis'
        viewport:
          $ref: '#/components/schemas/Viewport'
        bounds:
          $ref: '#/components/schemas/Bounds'
        scannedVolume:
          type: integer
          format: int64
          minimum: 1
        visibleBlocks:
          type: integer
          format: int64
          minimum: 0
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/ViewBlock'
    ReplaceBlocksRequest:
      type: object
      additionalProperties: false
      required:
        - world
        - min
        - max
        - source
        - destination
      properties:
        world:
          type: string
          minLength: 1
        min:
          $ref: '#/components/schemas/BlockPosition'
        max:
          $ref: '#/components/schemas/BlockPosition'
        source:
          type: string
          minLength: 1
        destination:
          type: string
          minLength: 1
        dryRun:
          type: boolean
          description: Omission uses the configured replace default.
    ReplaceBlocksResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - bounds
        - source
        - destination
        - dryRun
        - matchedBlocks
        - changedBlocks
      properties:
        world:
          type: string
          minLength: 1
        bounds:
          $ref: '#/components/schemas/Bounds'
        source:
          type: string
          minLength: 1
        destination:
          type: string
          minLength: 1
        dryRun:
          type: boolean
        matchedBlocks:
          type: integer
          format: int64
          minimum: 0
        changedBlocks:
          type: integer
          format: int64
          minimum: 0
    FillRegionRequest:
      type: object
      additionalProperties: false
      required:
        - world
        - min
        - max
        - destination
      properties:
        world:
          type: string
          minLength: 1
        min:
          $ref: '#/components/schemas/BlockPosition'
        max:
          $ref: '#/components/schemas/BlockPosition'
        destination:
          type: string
          minLength: 1
        dryRun:
          type: boolean
          description: Omission uses the configured fill default.
    FillRegionResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - bounds
        - destination
        - dryRun
        - volume
        - changedBlocks
      properties:
        world:
          type: string
          minLength: 1
        bounds:
          $ref: '#/components/schemas/Bounds'
        destination:
          type: string
          minLength: 1
        dryRun:
          type: boolean
        volume:
          type: integer
          format: int64
          minimum: 1
        changedBlocks:
          type: integer
          format: int64
          minimum: 0
    UndoLastEditRequest:
      type: object
      additionalProperties: false
      required:
        - world
      properties:
        world:
          type: string
          minLength: 1
    UndoLastEditResponse:
      type: object
      additionalProperties: false
      required:
        - world
        - changedBlocks
      properties:
        world:
          type: string
          minLength: 1
        changedBlocks:
          type: integer
          format: int64
          minimum: 1
    BridgeConfiguration:
      type: object
      additionalProperties: false
      required:
        - port
        - backlog
        - shutdownDelaySeconds
        - maxRequestBytes
        - minimumTokenBytes
      properties:
        port:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
        backlog:
          type: integer
          format: int32
          minimum: 0
        shutdownDelaySeconds:
          type: integer
          format: int32
          minimum: 0
        maxRequestBytes:
          type: integer
          format: int32
          minimum: 1
        minimumTokenBytes:
          type: integer
          format: int32
          minimum: 1
    LimitConfiguration:
      type: object
      additionalProperties: false
      required:
        - maxRegionVolume
        - maxChangedBlocks
        - maxExactInspectionVolume
        - defaultExactResults
        - maxExactResults
        - maxViewVolume
        - defaultViewResults
        - maxViewResults
        - undoHistoryPerWorld
      properties:
        maxRegionVolume:
          type: integer
          format: int32
          minimum: 1
        maxChangedBlocks:
          type: integer
          format: int32
          minimum: 1
        maxExactInspectionVolume:
          type: integer
          format: int32
          minimum: 1
        defaultExactResults:
          type: integer
          format: int32
          minimum: 1
        maxExactResults:
          type: integer
          format: int32
          minimum: 1
        maxViewVolume:
          type: integer
          format: int32
          minimum: 1
        defaultViewResults:
          type: integer
          format: int32
          minimum: 1
        maxViewResults:
          type: integer
          format: int32
          minimum: 1
        undoHistoryPerWorld:
          type: integer
          format: int32
          minimum: 0
    DefaultConfiguration:
      type: object
      additionalProperties: false
      required:
        - exactInspectionIncludeAir
        - exactInspectionMode
        - replaceDryRun
        - fillDryRun
      properties:
        exactInspectionIncludeAir:
          type: boolean
        exactInspectionMode:
          type: string
          enum:
            - blocks
            - runs
        replaceDryRun:
          type: boolean
        fillDryRun:
          type: boolean
    PluginConfiguration:
      type: object
      additionalProperties: false
      required:
        - bridge
        - limits
        - defaults
      properties:
        bridge:
          $ref: '#/components/schemas/BridgeConfiguration'
        limits:
          $ref: '#/components/schemas/LimitConfiguration'
        defaults:
          $ref: '#/components/schemas/DefaultConfiguration'
    Health:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - version
        - minecraftVersion
        - configuration
      properties:
        status:
          const: ok
        service:
          const: dirt-mcp-paper
        version:
          type: string
        minecraftVersion:
          type: string
        configuration:
          $ref: '#/components/schemas/PluginConfiguration'
