      properties:
        online:
          type: integer
          format: int32
          minimum: 0
        maximum:
          type: integer
          format: int32
          minimum: 0
        entries:
          type: array
          items:
            $ref: '#/components/schemas/OnlinePlayer'
    WorldStatus:
      type: object
      additionalProperties: false
      required:
        - name
        - environment
        - minY
        - maxY
        - spawn
        - timeOfDay
        - storm
        - thundering
        - playerCount
      properties:
        name:
          type: string
          minLength: 1
        environment:
          type: string
          minLength: 1
        minY:
          type: integer
          format: int32
        maxY:
          type: integer
          format: int32
        spawn:
          $ref: '#/components/schemas/BlockPosition'
        timeOfDay:
          type: integer
          format: int64
          minimum: 0
          maximum: 23999
        storm:
          type: boolean
        thundering:
          type: boolean
        playerCount:
          type: integer
          format: int32
          minimum: 0
    ServerStatusResponse:
      type: object
      additionalProperties: false
      required:
        - builds
        - performance
        - players
        - worlds
        - limits
        - defaults
      properties:
        builds:
          $ref: '#/components/schemas/ServerBuilds'
        performance:
          $ref: '#/components/schemas/ServerPerformance'
        players:
          $ref: '#/components/schemas/PlayerSummary'
        worlds:
          type: array
          items:
            $ref: '#/components/schemas/WorldStatus'
        limits:
          $ref: '#/components/schemas/LimitConfiguration'
        defaults:
          $ref: '#/components/schemas/DefaultConfiguration'
