# Settings are validated and snapshotted when the plugin starts; restart Paper
# after changing this file. The authenticated server-status endpoint reports
# active values but never reports the bearer token.
# The bridge always listens on 127.0.0.1 while the plugin is enabled.
bridge:
  # HTTP port on 127.0.0.1. DIRT_MCP_BRIDGE_PORT overrides this value.
  port: 8765
  # Zero asks the operating system to choose its normal HTTP connection backlog.
  backlog: 0
  # Seconds to wait for interrupted bridge request workers during shutdown.
  shutdown-delay-seconds: 5
  # Maximum seconds an authenticated request may take to upload its JSON body.
  request-body-timeout-seconds: 5
  # Lowering this below 32 weakens bearer-token security.
  minimum-token-bytes: 32
  # Maximum authenticated requests allowed to execute concurrently.
  max-concurrent-requests: 32
  # Maximum inspection operations allowed to capture and scan concurrently.
  max-concurrent-inspections: 2

limits:
  # Maximum JSON request body. Oversized requests fail before parsing or mutation.
  max-request-bytes: 262144
  # Maximum inclusive cuboid volume or resolved set-blocks offsets in one operation.
  max-region-volume: 262144
  # Maximum distinct loaded chunks one edit may touch.
  max-touched-chunks: 256
  # Maximum distinct loaded chunks one inspection may snapshot.
  max-inspection-touched-chunks: 32
  # Maximum block-state patterns or palette entries; inspection filters share it.
  max-block-state-patterns: 64
  # Maximum blocks one mutation may change.
  max-changed-blocks: 65536
  # Maximum blocks scanned by exact block retrieval or an orthographic view.
  max-inspection-volume: 16384
  # Result limit used when a detailed inspection omits maxResults.
  default-inspection-results: 512
  # Highest maxResults accepted for a detailed inspection.
  max-inspection-results: 2048
  # Maximum commands accepted in one ordered batch.
  max-commands-per-request: 10
  # Maximum plain-text command feedback retained across one request.
  max-command-feedback-characters: 8192
  # Zero disables retaining undo entries while leaving edit tools enabled.
  undo-history-per-world: 20

defaults:
  # Whether get_region_blocks includes air-family states when includeAir is omitted.
  region-blocks-include-air: false
  # get_region_blocks format used when format is omitted: blocks or runs.
  region-blocks-format: blocks
  # Dry-run value used when a block-edit request omits dryRun.
  edit-dry-run: false
