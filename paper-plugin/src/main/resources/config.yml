# Settings are validated and snapshotted when the plugin starts; restart Paper
# after changing this file. The authenticated server-status endpoint reports
# active values but never reports the bearer token.
# The bridge always listens on 127.0.0.1 while the plugin is enabled.
bridge:
  # HTTP port on 127.0.0.1. DIRT_MCP_BRIDGE_PORT overrides this value.
  port: 8765
  # Seconds to wait for interrupted bridge request workers during shutdown (1-30).
  shutdown-delay-seconds: 5
  # Maximum seconds an authenticated request may take to upload its JSON body (1-30).
  request-body-timeout-seconds: 5
  # Maximum authenticated requests allowed to execute concurrently.
  max-concurrent-requests: 32
  # Maximum concurrent inspections; cannot exceed max-concurrent-requests.
  max-concurrent-inspections: 4
  # Maximum JSON request body (1-67108864 bytes). Oversized requests fail before parsing or mutation.
  max-request-bytes: 1048576
  # Authenticated bridge operations admitted by Paper. Values are exact OpenAPI
  # operationIds; an empty list disables every operation except capabilities.
  allowed-operations:
    - pingServer
    - getServerStatus
    - countRegionBlockStates
    - getBlocks
    - scanOrthographicView
    - getPlayerContext
    - getPerspectiveView
    - replaceRegionBlocks
    - setBlocks
    - getEditHistory
    - undoEdits
    - runMinecraftCommands

access-control:
  # Loopback origin of the Dirt web service. DIRT_MCP_CONTROL_URL overrides this value.
  url: http://127.0.0.1:3000
  # Connection and complete-request deadlines for Paper administrative calls.
  connect-timeout-millis: 2000
  request-timeout-millis: 5000

logging:
  # Minimum severity shown in the Paper console: info, warning, or error.
  # Read-only requests and previews remain in the detailed file at every level.
  console-level: info
  # Detailed JSON Lines logs rotate under plugins/DirtMCP/logs/.
  detail-file-max-bytes: 10485760
  # Keep between 2 and 100 generations so rotation never discards the newest record.
  detail-file-retained-files: 5

limits:
  # Maximum inclusive cuboid volume or expanded set-blocks geometry in one operation.
  max-region-volume: 1048576
  # Maximum distinct loaded chunks one edit may touch.
  max-edit-touched-chunks: 512
  # Maximum distinct loaded chunks one region inspection may snapshot.
  max-inspection-touched-chunks: 128
  # Maximum distinct loaded chunks one perspective ray set may check.
  max-perspective-touched-chunks: 256
  # Maximum source or inspection match patterns; inspection filters share it.
  max-block-state-patterns: 64
  # Maximum exact block-state entries in one edit or exact inspection structure palette.
  max-palette-entries: 256
  # Maximum blocks one mutation may change; cannot exceed max-region-volume.
  max-changed-blocks: 262144
  # Maximum blocks scanned by exact retrieval or an orthographic view.
  max-inspection-volume: 262144
  # Maximum conservative perspective ray-count x distance work budget.
  max-perspective-ray-distance-budget: 131072
  # Paper ceiling on exact-structure placements plus runs.
  max-inspection-results: 4096
  # Maximum rays in one perspective view.
  max-perspective-rays: 2048
  # Maximum commands accepted in one ordered batch.
  max-commands-per-request: 10
  # Maximum plain-text feedback Unicode code points retained across one command batch.
  max-command-feedback-characters: 8192

edit-history:
  # Maximum undoable edits per world; cannot exceed max-entries-total.
  max-entries-per-world: 50
  # Maximum undoable edits retained across all loaded worlds.
  max-entries-total: 200
  # Sum of changed blocks across retained undo entries; must accommodate one
  # max-changed-blocks edit.
  max-retained-changed-blocks: 2621440
