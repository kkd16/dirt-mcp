# Settings are validated and snapshotted when the plugin starts; restart Paper
# after changing this file. The authenticated health endpoint reports active
# values but never reports the bearer token.
# The bridge always listens on 127.0.0.1 while the plugin is enabled.
# DIRT_MCP_BRIDGE_PORT overrides this value.
bridge:
  port: 8765
  # Zero asks the operating system to choose its normal HTTP connection backlog.
  backlog: 0
  # Seconds that the HTTP server allows active exchanges to finish during shutdown.
  shutdown-delay-seconds: 0
  max-request-bytes: 8192
  # Lowering this below 32 weakens bearer-token security.
  minimum-token-bytes: 32

limits:
  max-region-volume: 1000000
  max-changed-blocks: 250000
  max-exact-inspection-volume: 32768
  default-exact-results: 10000
  max-exact-results: 10000
  max-view-volume: 32768
  default-view-results: 2048
  max-view-results: 10000
  # Commands run sequentially on Paper's main thread, so keep batches bounded.
  max-commands-per-request: 20
  # Total plain-text command feedback retained across one request.
  max-command-feedback-characters: 32768
  # Zero disables retaining undo entries while leaving edit tools enabled.
  undo-history-per-world: 20

defaults:
  exact-inspection-include-air: false
  exact-inspection-mode: blocks
  replace-dry-run: false
  fill-dry-run: false
  set-blocks-dry-run: false
