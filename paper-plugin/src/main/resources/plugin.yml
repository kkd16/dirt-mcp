name: DirtMCP
version: '${version}'
main: ca.deliyannides.dirtmcp.paper.DirtMcpPlugin
description: AI access to live Minecraft worlds
author: kkd16
website: https://github.com/kkd16/dirt-mcp
api-version: '${paperVersion}'
depend: [FastAsyncWorldEdit]
permissions:
  dirtmcp.admin:
    description: Manage Dirt MCP access and view Paper bridge diagnostics
    default: op
  dirtmcp.link:
    description: Link your Minecraft account to Dirt MCP
    default: true
