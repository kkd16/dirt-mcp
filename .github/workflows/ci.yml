name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          install: false
          version: '11.24.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install tmux, Overmind, and actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          OVERMIND_VERSION: 2.5.1
        run: |
          sudo apt-get install --no-install-recommends --yes tmux
          ci_tool_dir="$(mktemp -d)"

          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 60 \
            --output "${ci_tool_dir}/overmind.gz" \
            "https://github.com/DarthSim/overmind/releases/download/v${OVERMIND_VERSION}/overmind-v${OVERMIND_VERSION}-linux-amd64.gz"
          echo "a17159b8e97d13f3679a4e8fbc9d4747f82d5af9f6d32597b72821378b5d0b6f  ${ci_tool_dir}/overmind.gz" \
            | sha256sum --check
          gzip --decompress --stdout "${ci_tool_dir}/overmind.gz" > "${ci_tool_dir}/overmind"
          sudo install --mode 0755 "${ci_tool_dir}/overmind" /usr/local/bin/overmind

          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 60 \
            --output "${ci_tool_dir}/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${ci_tool_dir}/actionlint.tar.gz" \
            | sha256sum --check
          tar --extract --gzip --file "${ci_tool_dir}/actionlint.tar.gz" --directory "${ci_tool_dir}" actionlint
          sudo install --mode 0755 "${ci_tool_dir}/actionlint" /usr/local/bin/actionlint

      - name: Verify every component
        run: make ci

      - name: Stop the managed development stack
        if: always()
        run: make down
