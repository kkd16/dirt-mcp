name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          install: false
          version: '11.24.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install tmux, Overmind, and actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          OVERMIND_VERSION: 2.5.1
        run: |
          sudo apt-get install --no-install-recommends --yes tmux
          ci_tool_dir="$(mktemp -d)"

          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 60 \
            --output "${ci_tool_dir}/overmind.gz" \
            "https://github.com/DarthSim/overmind/releases/download/v${OVERMIND_VERSION}/overmind-v${OVERMIND_VERSION}-linux-amd64.gz"
          echo "a17159b8e97d13f3679a4e8fbc9d4747f82d5af9f6d32597b72821378b5d0b6f  ${ci_tool_dir}/overmind.gz" \
            | sha256sum --check
          gzip --decompress --stdout "${ci_tool_dir}/overmind.gz" > "${ci_tool_dir}/overmind"
          sudo install --mode 0755 "${ci_tool_dir}/overmind" /usr/local/bin/overmind

          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 60 \
            --output "${ci_tool_dir}/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${ci_tool_dir}/actionlint.tar.gz" \
            | sha256sum --check
          tar --extract --gzip --file "${ci_tool_dir}/actionlint.tar.gz" --directory "${ci_tool_dir}" actionlint
          sudo install --mode 0755 "${ci_tool_dir}/actionlint" /usr/local/bin/actionlint

      - name: Run the clean build, test, and package gate
        run: make ci

      - name: Exercise the native installer
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get purge --yes nginx nginx-common nginx-core apache2 apache2-bin apache2-data apache2-utils

          sudo useradd --system --user-group --home-dir /nonexistent --no-create-home \
            --shell /usr/sbin/nologin dirt-paper-ci
          paper_fixture=/srv/dirt-ci-paper
          sudo install -d -o dirt-paper-ci -g dirt-paper-ci -m 0755 \
            "${paper_fixture}" "${paper_fixture}/plugins" "${paper_fixture}/.paper"

          fixture_files="$(mktemp -d)"
          printf '%s\n' 'online-mode=true' > "${fixture_files}/server.properties"
          printf '%s\n' '{"currentVersion":"26.2-120-a2a42c5 (MC: 26.2)"}' \
            > "${fixture_files}/version_history.json"
          sudo install -o dirt-paper-ci -g dirt-paper-ci -m 0644 \
            "${fixture_files}/server.properties" "${paper_fixture}/server.properties"
          sudo install -o dirt-paper-ci -g dirt-paper-ci -m 0644 \
            "${fixture_files}/version_history.json" "${paper_fixture}/.paper/version_history.json"

          mapfile -t archives < <(compgen -G 'build/release/dirt-mcp-*-ubuntu-24.04-x86_64.tar.gz')
          [[ "${#archives[@]}" -eq 1 ]]
          extracted="$(mktemp -d)"
          tar --extract --gzip --file "${archives[0]}" --directory "${extracted}"
          mapfile -t installers < <(find "${extracted}" -mindepth 2 -maxdepth 2 -type f -name install.sh)
          [[ "${#installers[@]}" -eq 1 ]]

          if sudo "${installers[0]}" --paper-dir "${paper_fixture}" --hostname 0x7f.1; then
            printf 'Installer accepted a hostname that the web service normalizes to an IP address.\n' >&2
            exit 1
          fi
          [[ ! -e /etc/dirt-mcp && ! -e /opt/dirt-mcp ]]
          if sudo "${installers[0]}" \
            --paper-dir "${paper_fixture}" --hostname ci.dirt-mcp.internal; then
            printf 'Installer accepted an unsupported Paper build.\n' >&2
            exit 1
          fi
          [[ ! -e /etc/dirt-mcp && ! -e /opt/dirt-mcp ]]

          printf '%s\n' '{"currentVersion":"26.2-121-a2a42c5 (MC: 26.2)"}' \
            > "${fixture_files}/version_history.json"
          sudo install -o dirt-paper-ci -g dirt-paper-ci -m 0644 \
            "${fixture_files}/version_history.json" "${paper_fixture}/.paper/version_history.json"

          printf '%s\n' 'online-mode=false' > "${fixture_files}/server.properties"
          sudo install -o dirt-paper-ci -g dirt-paper-ci -m 0644 \
            "${fixture_files}/server.properties" "${paper_fixture}/server.properties"
          if sudo "${installers[0]}" \
            --paper-dir "${paper_fixture}" --hostname ci.dirt-mcp.internal; then
            printf 'Installer accepted offline-mode Paper.\n' >&2
            exit 1
          fi
          [[ ! -e /etc/dirt-mcp && ! -e /opt/dirt-mcp && \
            ! -e /etc/systemd/system/dirt-mcp.service && ! -e /var/lib/dirt-mcp ]]
          printf '%s\n' 'online-mode=true' > "${fixture_files}/server.properties"
          sudo install -o dirt-paper-ci -g dirt-paper-ci -m 0644 \
            "${fixture_files}/server.properties" "${paper_fixture}/server.properties"

          printf '%s\n' 'conflicting plugin' > "${fixture_files}/WorldEdit.jar"
          sudo install -o dirt-paper-ci -g dirt-paper-ci -m 0644 \
            "${fixture_files}/WorldEdit.jar" "${paper_fixture}/plugins/WorldEdit.jar"
          if sudo "${installers[0]}" \
            --paper-dir "${paper_fixture}" --hostname ci.dirt-mcp.internal; then
            printf 'Installer accepted WorldEdit alongside FAWE.\n' >&2
            exit 1
          fi
          [[ ! -e /etc/dirt-mcp && ! -e /opt/dirt-mcp && \
            ! -e /etc/systemd/system/dirt-mcp.service && ! -e /var/lib/dirt-mcp ]]
          sudo rm -f -- "${paper_fixture}/plugins/WorldEdit.jar"

          sudo --preserve-env=DEBIAN_FRONTEND,NEEDRESTART_MODE \
            "${installers[0]}" --paper-dir "${paper_fixture}" --hostname ci.dirt-mcp.internal

          systemctl is-active --quiet dirt-mcp.service
          systemctl is-enabled --quiet dirt-mcp.service
          systemctl is-active --quiet caddy.service
          systemctl is-enabled --quiet caddy.service
          curl --fail --silent --show-error http://127.0.0.1:3000/healthz > /dev/null
          curl --insecure --fail --silent --show-error \
            --retry 20 --retry-all-errors --retry-delay 1 \
            --resolve ci.dirt-mcp.internal:443:127.0.0.1 \
            https://ci.dirt-mcp.internal/assets/app.js > /dev/null
          [[ "$(curl --insecure --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --resolve ci.dirt-mcp.internal:443:127.0.0.1 \
            https://ci.dirt-mcp.internal/healthz)" == '404' ]]
          [[ "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --resolve ci.dirt-mcp.internal:80:127.0.0.1 \
            http://ci.dirt-mcp.internal/)" == '400' ]]
          sudo caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          sudo systemd-analyze verify /etc/systemd/system/dirt-mcp.service

          for unused_port in 25565 8765; do
            if ss -H -ltn "sport = :${unused_port}" | grep -q .; then
              printf 'Installer unexpectedly opened TCP port %s.\n' "${unused_port}" >&2
              exit 1
            fi
          done

          plugin_secret_directory="${paper_fixture}/plugins/DirtMCP/secrets"
          [[ "$(sudo stat -c '%U:%G:%a' /opt/dirt-mcp)" == 'root:root:755' ]]
          [[ "$(sudo stat -c '%U:%G:%a' /opt/dirt-mcp/app)" == 'root:root:755' ]]
          [[ "$(sudo stat -c '%U:%G:%a' /opt/dirt-mcp/node/bin/node)" == 'root:root:755' ]]
          sudo -u dirt-mcp test -x /opt/dirt-mcp/node/bin/node
          sudo -u dirt-mcp test -r /opt/dirt-mcp/app/dist/index.js
          [[ "$(sudo stat -c '%U:%G:%a' /etc/dirt-mcp)" == 'root:root:700' ]]
          [[ "$(sudo stat -c '%U:%G:%a' /var/lib/dirt-mcp)" == 'dirt-mcp:dirt-mcp:700' ]]
          [[ "$(sudo stat -c '%U:%G:%a' /var/lib/dirt-mcp/dirt.sqlite3)" == 'dirt-mcp:dirt-mcp:600' ]]
          [[ "$(sudo stat -c '%U:%G:%a' /etc/caddy/Caddyfile)" == 'root:caddy:640' ]]
          [[ "$(sudo stat -c '%U:%G:%a' /etc/systemd/system/dirt-mcp.service)" == 'root:root:644' ]]
          [[ "$(sudo stat -c '%U:%G:%a' "${paper_fixture}/plugins/dirt-mcp-paper.jar")" == 'dirt-paper-ci:dirt-paper-ci:644' ]]
          [[ "$(sudo stat -c '%U:%G:%a' "${paper_fixture}/plugins/FastAsyncWorldEdit-Paper-2.15.4.jar")" == 'dirt-paper-ci:dirt-paper-ci:644' ]]
          [[ "$(sudo stat -c '%U:%G:%a' "${paper_fixture}/plugins/DirtMCP")" == 'dirt-paper-ci:dirt-paper-ci:750' ]]
          [[ "$(sudo stat -c '%U:%G:%a' "${plugin_secret_directory}")" == 'dirt-paper-ci:dirt-paper-ci:700' ]]
          [[ "$(sudo stat -c '%U:%G:%a' "${plugin_secret_directory}/bridge-token")" == 'dirt-paper-ci:dirt-paper-ci:600' ]]
          [[ "$(sudo stat -c '%U:%G:%a' "${plugin_secret_directory}/control-token")" == 'dirt-paper-ci:dirt-paper-ci:600' ]]
          [[ "$(sudo stat -c '%U:%G:%a' /etc/dirt-mcp/credentials/auth-secret)" == 'root:root:600' ]]
          [[ "$(sudo sha256sum \
            "${plugin_secret_directory}/bridge-token" \
            "${plugin_secret_directory}/control-token" \
            /etc/dirt-mcp/credentials/auth-secret | awk '{print $1}' | sort --unique | wc --lines)" -eq 3 ]]
          if sudo -u dirt-mcp test -r "${plugin_secret_directory}/bridge-token"; then
            printf 'The web service account can read Paper-owned source credentials.\n' >&2
            exit 1
          fi
          if sudo -u dirt-paper-ci test -r /etc/dirt-mcp/credentials/auth-secret; then
            printf 'The Paper account can read the web authentication secret.\n' >&2
            exit 1
          fi

          sudo sha256sum \
            "${plugin_secret_directory}/bridge-token" \
            "${plugin_secret_directory}/control-token" \
            /etc/dirt-mcp/credentials/auth-secret | tee "${fixture_files}/secret-hashes" > /dev/null
          sudo --preserve-env=DEBIAN_FRONTEND,NEEDRESTART_MODE \
            "${installers[0]}" --paper-dir "${paper_fixture}" --hostname ci.dirt-mcp.internal
          sudo sha256sum --check "${fixture_files}/secret-hashes"

      - name: Print native service diagnostics
        if: failure()
        run: |
          sudo systemctl stop dirt-mcp.service || true
          sudo systemctl reset-failed dirt-mcp.service || true
          sudo systemctl set-environment SYSTEMD_LOG_LEVEL=debug
          sudo systemd-analyze log-level debug
          sudo systemd-run --wait --collect --unit=dirt-credential-inline \
            --property=SetCredential=probe:ok /usr/bin/true || true
          sudo systemd-run --wait --collect --unit=dirt-credential-auth \
            --property=LoadCredential=auth-secret:/etc/dirt-mcp/credentials/auth-secret \
            /usr/bin/true || true
          sudo systemd-run --wait --collect --unit=dirt-credential-bridge \
            --property=LoadCredential=bridge-token:/srv/dirt-ci-paper/plugins/DirtMCP/secrets/bridge-token \
            /usr/bin/true || true
          sudo systemd-run --wait --collect --unit=dirt-credential-user \
            --property=User=dirt-mcp \
            --property=LoadCredential=auth-secret:/etc/dirt-mcp/credentials/auth-secret \
            /usr/bin/true || true
          probe_service_override() {
            local label="$1"
            local setting="$2"
            printf '[Service]\n%s\n' "${setting}" \
              | sudo tee /run/systemd/system/dirt-mcp.service.d/diagnostic.conf > /dev/null
            sudo systemctl daemon-reload
            sudo systemctl reset-failed dirt-mcp.service
            if sudo systemctl start dirt-mcp.service; then
              printf 'Service probe %s started successfully.\n' "${label}"
            else
              printf 'Service probe %s failed.\n' "${label}"
            fi
            sudo systemctl stop dirt-mcp.service || true
          }
          sudo install -d /run/systemd/system/dirt-mcp.service.d
          probe_service_override restrict-namespaces 'RestrictNamespaces=false'
          probe_service_override capability-bounding-set 'CapabilityBoundingSet=CAP_SYS_ADMIN'
          probe_service_override inaccessible-paths 'InaccessiblePaths='
          probe_service_override private-devices 'PrivateDevices=false'
          probe_service_override exec-start-pre 'ExecStartPre='
          sudo rm /run/systemd/system/dirt-mcp.service.d/diagnostic.conf
          sudo systemctl daemon-reload
          sudo systemd-analyze log-level info
          sudo systemctl unset-environment SYSTEMD_LOG_LEVEL
          sudo systemctl status dirt-mcp.service caddy.service --no-pager || true
          sudo journalctl \
            --unit dirt-mcp.service \
            --unit dirt-credential-inline.service \
            --unit dirt-credential-auth.service \
            --unit dirt-credential-bridge.service \
            --unit dirt-credential-user.service \
            --no-pager --lines 300 || true

      - name: Stop the managed development stack
        if: always()
        run: make down
