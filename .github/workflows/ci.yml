name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@26
          cache: false
          install: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Install tmux and actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          sudo apt-get install --no-install-recommends --yes tmux
          ci_tool_dir="$(mktemp -d)"

          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 60 \
            --output "${ci_tool_dir}/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${ci_tool_dir}/actionlint.tar.gz" \
            | sha256sum --check
          tar --extract --gzip --file "${ci_tool_dir}/actionlint.tar.gz" --directory "${ci_tool_dir}" actionlint
          sudo install --mode 0755 "${ci_tool_dir}/actionlint" /usr/local/bin/actionlint

      - name: Verify every component
        run: make ci

      - name: Stop the managed Paper server
        if: always()
        run: make down
