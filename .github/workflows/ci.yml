name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.20.0
          cache: false
          install: false

      - name: Install tmux and actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          sudo apt-get install --no-install-recommends --yes tmux
          ci_tool_dir="$(mktemp -d)"

          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 60 \
            --output "${ci_tool_dir}/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${ci_tool_dir}/actionlint.tar.gz" \
            | sha256sum --check
          tar --extract --gzip --file "${ci_tool_dir}/actionlint.tar.gz" --directory "${ci_tool_dir}" actionlint
          sudo install --mode 0755 "${ci_tool_dir}/actionlint" /usr/local/bin/actionlint

      - name: Validate the production deployment
        env:
          DIRT_AUTH_SECRET_FILE: /dev/null
          DIRT_BRIDGE_TOKEN_FILE: /dev/null
          DIRT_CONTROL_TOKEN_FILE: /dev/null
          DIRT_PUBLIC_HOST: dirt.example.com
        run: |
          docker compose config --quiet
          docker build --pull --tag dirt-mcp-web:ci .
          docker run --rm --entrypoint /bin/sh dirt-mcp-web:ci -c 'test -r /app/LICENSE'
          docker compose run --rm --no-deps caddy \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Verify every component
        run: make ci

      - name: Stop the managed Paper server
        if: always()
        run: make down
